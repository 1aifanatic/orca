name: Shared xterm dependency cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-xterm-cache.yml'
      - '.github/actions/prepare-xterm-dependencies/**'
      - 'config/patches/xterm-upstream.json'
      - 'config/scripts/regenerate-xterm-patches.mjs'
      - 'config/scripts/xterm-patch-text.mjs'
      - 'package.json'
  pull_request:
    paths: ['.github/workflows/ci-xterm-cache.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xterm-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - uses: ./.github/actions/prepare-xterm-dependencies
        id: cache
      - name: Restore baseline downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            ${{ runner.temp }}/xterm-patch-build/upstream/.git
          key: xterm-upstream-${{ hashFiles('config/patches/xterm-upstream.json') }}
      - name: Verify and populate dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: node config/scripts/regenerate-xterm-patches.mjs --check --work-dir="$RUNNER_TEMP/xterm-patch-build"
      - uses: actions/cache/save@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ runner.temp }}/xterm-patch-build/upstream/.git
            ${{ runner.temp }}/xterm-patch-build/upstream/node_modules
          key: ${{ steps.cache.outputs.cache-key }}
  measure:
    if: github.event_name == 'pull_request'
    needs: seed
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
        cache: [false, true]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Restore baseline downloads
        if: matrix.cache == false
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.npm
            ${{ runner.temp }}/xterm-patch-build/upstream/.git
          key: xterm-upstream-${{ hashFiles('config/patches/xterm-upstream.json') }}
      - name: Restore installed dependencies
        if: matrix.cache == true
        id: cache
        uses: ./.github/actions/prepare-xterm-dependencies
      - name: Require treatment cache hit
        if: matrix.cache == true
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Verify patches
        run: node config/scripts/regenerate-xterm-patches.mjs --check --work-dir="$RUNNER_TEMP/xterm-patch-build"
