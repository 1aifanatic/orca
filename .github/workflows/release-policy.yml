name: Release Policy

on:
  release:
    types:
      - published
      - edited

permissions:
  contents: write

concurrency:
  group: release-policy
  cancel-in-progress: false

jobs:
  enforce:
    if: github.repository == 'stablyai/orca'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Why: run the policy from the default branch; the release tag is never checked out.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: config/scripts/release-policy.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Enforce release policy
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = await import("node:url")
            const { enforceReleasePolicy } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/config/scripts/release-policy.mjs`).href
            )
            await enforceReleasePolicy({ github, context, core })
