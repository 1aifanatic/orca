name: E2E
run-name: Sidebar paired Linux ABBAABBA
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pinned diagnostic source
        required: true
        type: string
      test_files:
        description: Reserved for compatibility; the paired probe is fixed
        required: false
        type: string
jobs:
  paired:
    name: paired sidebar motion on one Linux VM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Install native and hidden UI tools
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Build immutable baseline and candidate outputs
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          set -euo pipefail
          mkdir -p paired-evidence "$RUNNER_TEMP/sidebar-paired-builds"
          cp tests/sidebar-paired-source-manifest.json paired-evidence/source-manifest.json
          cp src/renderer/src/components/sidebar/use-worktree-context-menu-model.tsx "$RUNNER_TEMP/sidebar-menu-candidate.tsx"
          cp tests/sidebar-menu-baseline-source.txt src/renderer/src/components/sidebar/use-worktree-context-menu-model.tsx
          node -p 'JSON.stringify({node:process.version,versions:process.versions,arch:process.arch,platform:process.platform})' > paired-evidence/node.json
          pnpm --version > paired-evidence/pnpm.txt
          uname -a > paired-evidence/kernel.txt
          pnpm run build:relay > paired-evidence/build-relay.log 2>&1
          pnpm exec electron-vite build --mode e2e > paired-evidence/build-A.log 2>&1
          pnpm run build:web-from-renderer >> paired-evidence/build-A.log 2>&1
          cp -a out "$RUNNER_TEMP/sidebar-paired-builds/A"
          python3 tests/sidebar-paired-build-manifest.py out paired-evidence/build-A.json
          cp "$RUNNER_TEMP/sidebar-menu-candidate.tsx" src/renderer/src/components/sidebar/use-worktree-context-menu-model.tsx
          pnpm exec electron-vite build --mode e2e > paired-evidence/build-B.log 2>&1
          pnpm run build:web-from-renderer >> paired-evidence/build-B.log 2>&1
          cp -a out "$RUNNER_TEMP/sidebar-paired-builds/B"
          python3 tests/sidebar-paired-build-manifest.py out paired-evidence/build-B.json
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Run fixed ABBAABBA sequence with fresh apps
        run: xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh bash tests/sidebar-paired-run.sh
      - name: Upload all paired evidence including failed legs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sidebar-paired-linux
          path: paired-evidence/
          retention-days: 7
          if-no-files-found: error
