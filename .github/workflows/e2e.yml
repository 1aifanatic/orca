name: Linux sidebar hidden-vs-mapped frame diagnostic
run-name: Linux sidebar hidden-vs-mapped frame diagnostic (${{ github.ref_name }})
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pinned diagnostic ref
        required: true
        type: string
jobs:
  sidebar-frame-diagnostic:
    name: twelve fixed hidden/mapped sidebar motion cases
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_E2E_FORWARD_APP_LOGS: '1'
      PRODUCT_COMMIT: a9deac1f890f196826f1d215fb630141c9709d95
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Guarantee the pinned parent is present
        run: |
          set -euo pipefail
          if ! git cat-file -e "$PRODUCT_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PRODUCT_COMMIT"
          fi
          git cat-file -e "$PRODUCT_COMMIT^{commit}"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_COMMIT"
      - name: Install native and hidden UI tools
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Record source identities and build E2E app
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          set -euo pipefail
          mkdir -p capture-evidence
          git rev-parse HEAD > capture-evidence/diagnostic-commit.txt
          git rev-parse HEAD^ > capture-evidence/product-commit.txt
          git diff --check HEAD^ HEAD
          git diff --name-only HEAD^ HEAD > capture-evidence/diagnostic-files.txt
          git diff HEAD^ HEAD > capture-evidence/diagnostic-diff.patch
          for path in $(cat capture-evidence/diagnostic-files.txt); do git hash-object "$path"; done > capture-evidence/source-blobs.txt
          sha256sum $(cat capture-evidence/diagnostic-files.txt) > capture-evidence/source-sha256.txt
          node -p 'JSON.stringify({node:process.version,versions:process.versions,arch:process.arch,platform:process.platform})' > capture-evidence/node.json
          pnpm --version > capture-evidence/pnpm.txt
          uname -a > capture-evidence/kernel.txt
          cat /etc/os-release > capture-evidence/os-release.txt
          pnpm run build:relay > capture-evidence/build.log 2>&1
          npx electron-vite build --mode e2e >> capture-evidence/build.log 2>&1
          pnpm run build:web-from-renderer >> capture-evidence/build.log 2>&1
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Verify both isolated-display guards fail closed
        run: |
          set +e
          pnpm exec vitest run tests/e2e/sidebar-motion-presentation.unit.test.ts tests/e2e/terminal-perf-presentation.unit.test.ts > capture-evidence/guard-unit-tests.log 2>&1
          status=$?
          printf 'guard_unit_tests_exit=%s\n' "$status" >> capture-evidence/outcomes.txt
          exit "$status"
      - name: Discover exactly one title per case spec
        run: |
          set +e
          discover() {
            local name="$1" spec="$2" pattern="$3" expected="$4"
            SKIP_BUILD=1 ORCA_E2E_WEB_CLIENT=1 ORCA_RELAY_PATH="$GITHUB_WORKSPACE/out/relay" pnpm exec playwright test "$spec" --config tests/playwright.config.ts --project=electron-headless --list --grep "$pattern" > "capture-evidence/discovery-$name.log" 2>&1
            local status=$?
            local found total
            found=$(grep -cF '[electron-headless] ' "capture-evidence/discovery-$name.log")
            total=$(sed -n 's/^Total: \([0-9]*\) test.*/\1/p' "capture-evidence/discovery-$name.log" | tail -1)
            printf 'discovery=%s listed_lines=%s total_line=%s\n' "$name" "$found" "${total:-missing}" >> capture-evidence/outcomes.txt
            if [ "${total:-missing}" != "$found" ]; then
              printf 'discovery_count_disagreement=%s\n' "$name" >> capture-evidence/outcomes.txt
              return 1
            fi
            printf 'discovery=%s exit=%s titles=%s expected=%s\n' "$name" "$status" "$found" "$expected" >> capture-evidence/outcomes.txt
            if [ "$status" -ne 0 ] || [ "$found" -ne "$expected" ]; then
              printf 'discovery_invalid=%s\n' "$name" >> capture-evidence/outcomes.txt
              return 1
            fi
            return 0
          }
          ok=0
          discover continuity tests/e2e/sidebar-reveal-continuity.spec.ts 'native reveal continuity: up$' 1 || ok=1
          discover lineage tests/e2e/sidebar-lineage-scroll-regressions.spec.ts 'smooth worktree reveal child 150 after 0ms idle keeps the inactive descendant mounted until its title lands$' 1 || ok=1
          discover rename tests/e2e/sidebar-rename-readiness.spec.ts 'untyped distant rename keeps native motion after early focus$' 1 || ok=1
          discover stationary tests/e2e/sidebar-capture-stall-controls.spec.ts 'stationary event-loop control$' 1 || ok=1
          discover moving tests/e2e/sidebar-capture-stall-controls.spec.ts 'moving event-loop control$' 1 || ok=1
          printf 'discovery_all_valid=%s\n' "$([ "$ok" -eq 0 ] && echo true || echo false)" >> capture-evidence/outcomes.txt
          exit "$ok"
      - name: Run twelve fixed cases in one owned xvfb-run
        run: |
          set +e
          chmod +x .github/scripts/sidebar-frame-diagnostic-cases.sh
          xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh bash .github/scripts/sidebar-frame-diagnostic-cases.sh
          printf 'xvfb_sequence_exit=%s\n' "$?" >> capture-evidence/outcomes.txt
          exit 0
      - name: Reduce the four Chromium traces and keep the compressed originals
        if: always()
        run: |
          set +e
          found=0
          while IFS= read -r trace; do
            found=$((found + 1))
            node .github/scripts/sidebar-frame-trace-reduce.mjs "$trace" "${trace%.json}-decisions.json" "${trace}.gz" >> capture-evidence/trace-reduce.log 2>&1
            printf 'trace_reduced=%s exit=%s\n' "$trace" "$?" >> capture-evidence/outcomes.txt
            rm -f "$trace"
          done < <(find capture-evidence -name 'chromium-trace.json' -print)
          printf 'traces_found=%s\n' "$found" >> capture-evidence/outcomes.txt
          du -sh capture-evidence >> capture-evidence/outcomes.txt
          exit 0
      - name: Upload all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sidebar-frame-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: capture-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
