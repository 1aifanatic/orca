name: Linux sidebar arrival probe diagnostic
run-name: Linux sidebar arrival probe diagnostic (${{ github.ref_name }})
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Pinned diagnostic ref
        required: true
        type: string
jobs:
  sidebar-arrival-probe:
    name: six fixed child-400 arrival cases
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_E2E_FORWARD_APP_LOGS: '1'
      PRODUCT_COMMIT: 7a64ac65ef413f56b246abf27828c772cb67f2c1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
      - name: Guarantee the pinned parent is present
        run: |
          set -euo pipefail
          if ! git cat-file -e "$PRODUCT_COMMIT^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$PRODUCT_COMMIT"
          fi
          git cat-file -e "$PRODUCT_COMMIT^{commit}"
          test "$(git rev-parse HEAD^)" = "$PRODUCT_COMMIT"
      - name: Install native build and headless UI tools
        run: sudo apt-get update && sudo apt-get install -y build-essential fonts-noto-cjk python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Record source identities and build the E2E app once
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          set -euo pipefail
          mkdir -p probe-evidence/logs
          git rev-parse HEAD > probe-evidence/diagnostic-commit.txt
          git rev-parse HEAD^ > probe-evidence/product-commit.txt
          git diff --check HEAD^ HEAD
          git diff --name-only HEAD^ HEAD > probe-evidence/diagnostic-files.txt
          git diff HEAD^ HEAD > probe-evidence/diagnostic-diff.patch
          test -z "$(git diff --name-only HEAD^ HEAD -- src/)" || { echo 'product source changed'; exit 1; }
          sha256sum $(cat probe-evidence/diagnostic-files.txt) > probe-evidence/source-sha256.txt
          node -p 'JSON.stringify({node:process.version,versions:process.versions,arch:process.arch,platform:process.platform})' > probe-evidence/node.json
          pnpm --version > probe-evidence/pnpm.txt
          uname -a > probe-evidence/kernel.txt
          cat /etc/os-release > probe-evidence/os-release.txt
          npx electron-vite build --mode e2e > probe-evidence/logs/build.log 2>&1
          pnpm run build:cli >> probe-evidence/logs/build.log 2>&1
          # Renderer identity is the emitted assets, not index.html alone.
          sha256sum out/main/index.js out/preload/index.js out/cli/index.js out/renderer/index.html > probe-evidence/build-sha256.txt
          find out/renderer/assets -type f \( -name '*.js' -o -name '*.css' \) -print0 | sort -z | xargs -0 sha256sum >> probe-evidence/build-sha256.txt
          wc -l probe-evidence/build-sha256.txt >> probe-evidence/outcomes.txt
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Validate the write recorder before trusting it
        run: |
          set +e
          pnpm exec vitest run tests/e2e/sidebar-arrival-write-recorder.unit.test.ts > probe-evidence/logs/recorder-unit.log 2>&1
          status=$?
          printf 'recorder_unit_exit=%s\n' "$status" >> probe-evidence/outcomes.txt
          exit "$status"
      - name: Discover exactly one title per case pattern
        run: |
          set +e
          suffix='idle keeps the inactive descendant mounted until its title lands$'
          discover() {
            local name="$1" spec="$2" pattern="$3"
            env SKIP_BUILD=1 ORCA_E2E_WEB_CLIENT=1 "ORCA_RELAY_PATH=$GITHUB_WORKSPACE/out/relay" pnpm exec playwright test "$spec" --config tests/playwright.config.ts --project=electron-headless --list --grep "$pattern" > "probe-evidence/logs/discovery-$name.log" 2>&1
            local status=$? found total
            found=$(grep -cF '[electron-headless] ' "probe-evidence/logs/discovery-$name.log")
            total=$(sed -n 's/^Total: \([0-9]*\) test.*/\1/p' "probe-evidence/logs/discovery-$name.log" | tail -1)
            printf 'discovery=%s exit=%s listed=%s total=%s expected=1\n' "$name" "$status" "$found" "${total:-missing}" >> probe-evidence/outcomes.txt
            [ "$status" -eq 0 ] && [ "$found" -eq 1 ] && [ "${total:-missing}" = "1" ]
          }
          ok=0
          discover probe-400-0   tests/e2e/sidebar-lineage-arrival-probe.spec.ts      "arrival probe: smooth worktree reveal child 400 after 0ms $suffix" || ok=1
          discover probe-100-0   tests/e2e/sidebar-lineage-arrival-probe.spec.ts      "arrival probe: smooth worktree reveal child 100 after 0ms $suffix" || ok=1
          discover probe-400-800 tests/e2e/sidebar-lineage-arrival-probe.spec.ts      "arrival probe: smooth worktree reveal child 400 after 800ms $suffix" || ok=1
          discover maintained-400-0 tests/e2e/sidebar-lineage-scroll-regressions.spec.ts "smooth worktree reveal child 400 after 0ms $suffix" || ok=1
          printf 'discovery_all_valid=%s\n' "$([ "$ok" -eq 0 ] && echo true || echo false)" >> probe-evidence/outcomes.txt
          exit "$ok"
      - name: Run six fixed cases in one owned xvfb-run
        run: |
          set +e
          chmod +x .github/scripts/sidebar-arrival-probe-cases.sh
          xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh bash .github/scripts/sidebar-arrival-probe-cases.sh
          printf 'xvfb_sequence_exit=%s\n' "$?" >> probe-evidence/outcomes.txt
          exit 0
      - name: Verify all six cases produced evidence
        if: always()
        run: |
          set +e
          missing=0
          for label in case-1-I-child400-worktree-0ms case-2-U-child400-worktree-0ms \
                       case-3-U-child400-worktree-0ms case-4-I-child400-worktree-0ms \
                       case-5-I-child100-worktree-0ms case-6-I-child400-worktree-800ms; do
            case "$label" in
              *-I-*) artifact='arrival-probe-frames.json' ;;
              *)     artifact='smooth-reveal-frames.json' ;;
            esac
            found=$(find "probe-evidence/$label" -name "$artifact" 2>/dev/null | wc -l | tr -d ' ')
            printf 'capture=%s artifact=%s count=%s\n' "$label" "$artifact" "$found" >> probe-evidence/outcomes.txt
            [ "$found" -ge 1 ] || missing=$((missing + 1))
          done
          recorded=$(grep -c '^case=' probe-evidence/outcomes.txt)
          printf 'capture_cases_recorded=%s capture_missing_artifacts=%s\n' "$recorded" "$missing" >> probe-evidence/outcomes.txt
          complete=false
          if [ "$recorded" -eq 6 ] && [ "$missing" -eq 0 ]; then
            complete=true
          fi
          printf 'capture_complete=%s\n' "$complete" >> probe-evidence/outcomes.txt
          # A green job proves nothing on its own, so an incomplete capture fails the job after the
          # verdict is recorded. The six records still have to be inspected by hand either way.
          [ "$complete" = true ]
      - name: Analyse the captured jumps
        if: always()
        run: |
          set +e
          node .github/scripts/sidebar-arrival-probe-analyze.mjs probe-evidence probe-evidence/arrival-analysis.json > probe-evidence/logs/analysis.log 2>&1
          printf 'analysis_exit=%s\n' "$?" >> probe-evidence/outcomes.txt
          cat probe-evidence/logs/analysis.log || true
          du -sh probe-evidence >> probe-evidence/outcomes.txt
          exit 0
      - name: Upload all probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sidebar-arrival-probe-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: probe-evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
