name: CI runtime cost pilot

on:
  pull_request:
    paths: ['.github/workflows/ci-runtime-cost-pilot.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runtime-cost-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  screen_clock:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - name: Compare identical transcript assertions in both orders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node config/scripts/ci-screen-clock-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screen-clock-comparison-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screen-clock-comparison

  electron_without_global_gyp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
      - name: Force three real Electron native rebuilds without external node-gyp
        env:
          npm_config_node_gyp: /tmp/orca-missing-external-node-gyp.js
        run: |
          for sample in 1 2 3; do
            node config/scripts/rebuild-native-deps.mjs --force
            node config/scripts/rebuild-native-deps.mjs
          done
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
          node-version: '24'
      - name: Probe warm Electron native output
        run: node config/scripts/rebuild-native-deps.mjs

  electron_restored_cache:
    needs: electron_without_global_gyp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: electron
          node-version: '24'
          persist-native-cache: 'false'
      - name: Require an actual restored native cache and usable Electron binaries
        env:
          CACHE_HIT: ${{ steps.deps.outputs.native-cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          node config/scripts/rebuild-native-deps.mjs

  network_only_baseline:
    uses: ./.github/workflows/e2e.yml
    with:
      test_files: '["tests/e2e/ssh-browser-network-execution-route.docker.unit.test.ts"]'

  network_only_consumers:
    uses: ./.github/workflows/e2e.yml
    with:
      test_files: '["tests/e2e/ssh-browser-network-execution-route.docker.unit.test.ts"]'
      run_changed_e2e: false
      needs_build: false
