name: Serializer oracle performance pilot

on:
  pull_request:
    paths:
      - '.github/workflows/ci-serialize-oracle-pilot.yml'
      - 'config/scripts/ci-serialize-oracle-pilot*'
      - 'src/main/daemon/serialize-grid-cell-descriptors.ts'
      - 'src/main/daemon/serialize-grid-cell-descriptors.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serialize-oracle-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
      - name: Compare unchanged serializer-oracle cases
        run: pnpm exec node config/scripts/ci-serialize-oracle-pilot.mjs --output "$RUNNER_TEMP/serialize-oracle-pilot"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serialize-oracle-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/serialize-oracle-pilot
          retention-days: 7
          compression-level: 0
