name: Oxlint scan consolidation comparison

on:
  pull_request:
    paths:
      - '.github/workflows/ci-oxlint-consolidation-pilot.yml'
      - 'config/scripts/ci-oxlint-consolidation-pilot.mjs'
      - '.oxlintrc.json'
      - 'mobile/.oxlintrc.json'
      - 'config/oxlint-anti-slop.json'
      - 'config/oxlint-code-quality-native-plugins.json'
      - 'config/oxlint-code-quality-type-aware.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oxlint-consolidation-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
      - name: Compare three alternating scan pairs and lint policy controls
        run: node config/scripts/ci-oxlint-consolidation-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oxlint-consolidation-comparison-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oxlint-consolidation-pilot/
          if-no-files-found: error
          retention-days: 7
