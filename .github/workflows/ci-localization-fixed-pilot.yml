name: Corrected localization CLI pilot
on:
  push:
    branches: [nwparker/ci-localization-fixed-pilot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localization-fixed-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Verify extraction syntax regressions
        run: pnpm exec vitest run --config config/vitest.config.ts config/scripts/localization-extraction-call-syntax.test.mjs
      - name: Compare corrected localization CLI with baseline
        env:
          LOCALIZATION_PILOT_OUTPUT: ${{ runner.temp }}/localization-pilot
        run: node config/scripts/ci-localization-fixed-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: localization-fixed-pilot
          path: |
            ${{ runner.temp }}/localization-pilot/results.json
            ${{ runner.temp }}/localization-pilot/catalog-comparison.json
            ${{ runner.temp }}/localization-pilot/*/en.json
            ${{ runner.temp }}/localization-pilot/*/run.log
          retention-days: 7
