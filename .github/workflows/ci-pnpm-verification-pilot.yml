name: Manual Web session canonical operation import qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed8b20 source; temporary definition must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-web-session-tabs-canonical-imports-qualification
  cancel-in-progress: false
jobs:
  qualify:
    name: Web session operation imports ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WEB_TABS_SOURCE_SHA: ${{ inputs.source_sha }}
      WEB_TABS_RUNTIME: ${{ matrix.runtime }}
      WEB_TABS_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize unchanged stock controller and source-bound proposal
        run: node .benchmark-definition/.github/benchmark/web-session-tabs-canonical-imports/materialize.mjs
      - name: Preserve original attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before "$WEB_TABS_RUNTIME" notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20/shipping-launch-plan.json "web-session-tabs-canonical-imports-ci-8b20/runs/$WEB_TABS_RUNTIME-$WEB_TABS_SEED/before" "$WEB_TABS_SEED"
      - name: Require source and process boundaries before shipping patch
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20')
          prefix = directory / 'runs' / (os.environ['WEB_TABS_RUNTIME'] + '-' + os.environ['WEB_TABS_SEED']) / 'before'
          proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
          assert proof['normalClose'] and proof['result'] in [0, 1] and proof['sourceUnchanged']
          assert proof['before'] == proof['after'] and not proof['samplingErrors']
          assert not proof['externalObserved'] and not proof['postCloseCoordinators']
          plan = json.loads((directory / 'shipping-launch-plan.json').read_text())
          for target, versions in plan['patchTargets'].items():
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest() == versions['beforeSha256']
          PY
          git apply --check notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20/shipping.patch
          git apply notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20/shipping.patch
      - name: Preserve candidate attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WEB_TABS_RUNTIME" notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20/shipping-launch-plan.json "web-session-tabs-canonical-imports-ci-8b20/runs/$WEB_TABS_RUNTIME-$WEB_TABS_SEED/after" "$WEB_TABS_SEED"
      - name: Preserve every raw attempt and runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-session-tabs-canonical-imports-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/web-session-tabs-canonical-imports-ci-8b20/
  evidence:
    name: Independently verify eight original and candidate attempts
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: web-session-tabs-canonical-imports-*
          path: leaf-artifacts
      - name: Verify exact original cases, routes and provenance
        env:
          WEB_TABS_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/web-session-tabs-canonical-imports/collect-results.py leaf-artifacts .github/benchmark/web-session-tabs-canonical-imports/payload web-session-tabs-canonical-imports-result.json
      - name: Preserve evidence even when qualification rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-session-tabs-canonical-imports-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: web-session-tabs-canonical-imports-result.json
