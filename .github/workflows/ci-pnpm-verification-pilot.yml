name: CI unit capacity paired pilot
run-name: CI unit capacity | ${{ inputs.cohort }}
on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Frozen unit cohort
        type: choice
        options:
          - all
          - next-fixtures
          - new-fixtures
          - fixtures
          - status-store
          - serializer
          - storm
          - antigravity
          - frame
          - fidelity
          - imports
          - recovery
          - cursor
          - deadlines
          - binary
          - nativechat
        default: all
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: "1"
jobs:
  status-store:
    name: unit capacity status-store
    if: inputs.cohort == 'all' || inputs.cohort == 'status-store'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: "24"
          cache-pnpm-store: "false"
      - name: Typecheck modified Node sources
        run: pnpm tc:node
      - name: Expand frozen baseline and portable benchmark
        run: |-
          mkdir -p "$RUNNER_TEMP/capacity-support" "$RUNNER_TEMP/capacity-output"
          tar -xzf config/ci-capacity-benchmark/status-store.tar.gz -C "$RUNNER_TEMP/capacity-support"
          git rev-parse HEAD > "$RUNNER_TEMP/capacity-output/source-sha.txt"
          node --version > "$RUNNER_TEMP/capacity-output/node-version.txt"
          pnpm --version > "$RUNNER_TEMP/capacity-output/pnpm-version.txt"
      - name: Run alternating timed pairs and separate failure controls
        run: |-
          python3 "$RUNNER_TEMP/capacity-support/run-status-store-benchmark.py"
          python3 "$RUNNER_TEMP/capacity-support/run-status-store-controls.py"
          cp "$RUNNER_TEMP/capacity-support/"*.json "$RUNNER_TEMP/capacity-output/"
          cp "$RUNNER_TEMP/capacity-support/"*.log "$RUNNER_TEMP/capacity-output/"
      - uses: actions/upload-artifact@v7
        if: "!cancelled()"
        with:
          name: unit-capacity-status-store
          path: ${{ runner.temp }}/capacity-output
          retention-days: 14
  serializer:
    name: unit capacity serializer
    if: inputs.cohort == 'all' || inputs.cohort == 'serializer'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
