name: Manual isolated Zod consumer timing
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact corrected source bound to a fresh broad compatibility admission.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-zod-twelve-consumer-timing
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ZOD_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize source-bound reviewed timing draft
        run: node .benchmark-definition/.github/benchmark/zod-twelve-timing/materialize.mjs
      - name: Count complete cold commands and three alternating warm pairs
        run: |
          driver=notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e-inline-output-twelve-consumer-held-timing-draft/benchmark-config-only.mjs
          plan=notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e-inline-output-twelve-consumer-held-timing-draft/measurement-plan.json
          pnpm exec node "$driver" before cold "$plan"
          pnpm exec node "$driver" after cold "$plan"
          pnpm exec node "$driver" before 0 "$plan"
          pnpm exec node "$driver" after 0 "$plan"
          pnpm exec node "$driver" after 1 "$plan"
          pnpm exec node "$driver" before 1 "$plan"
          pnpm exec node "$driver" before 2 "$plan"
          pnpm exec node "$driver" after 2 "$plan"
      - name: Independently verify all eight retained raw commands
        if: always()
        run: python3 notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e-inline-output-twelve-consumer-held-timing-draft/collect-results.py
      - name: Preserve every outcome, source proof and owned optimizer output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zod-twelve-timing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e-inline-output-twelve-consumer-held-timing-draft/
            notes/bun-migration/performance/zod-twelve-inline-config-only-30bc-draft-*
