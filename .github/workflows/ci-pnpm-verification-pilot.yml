name: Manual Serializer blank predicate qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed e9b3 source; temporary definition must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-serialize-oracle-blank-predicate
  cancel-in-progress: false
jobs:
  qualify:
    name: Serializer predicate ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
      WAIT_RUNTIME: ${{ matrix.runtime }}
      WAIT_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize capture-aware stock controller and source-bound proposal
        run: node .benchmark-definition/.github/benchmark/serialize-oracle-blank-predicate/materialize.mjs
      - name: Preserve original attempt without retry
        continue-on-error: true
        env:
          ORCA_SERIALIZE_CHECKPOINT_CAPTURE: notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/runs/${{ matrix.runtime }}-${{ matrix.seed }}/before-checkpoints.jsonl
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before "$WAIT_RUNTIME" notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/shipping-launch-plan.json "serialize-oracle-blank-predicate-ci-e9b3/runs/$WAIT_RUNTIME-$WAIT_SEED/before" "$WAIT_SEED"
      - name: Require source and process boundaries before shipping patch
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3')
          prefix = directory / 'runs' / (os.environ['WAIT_RUNTIME'] + '-' + os.environ['WAIT_SEED']) / 'before'
          proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
          assert proof['normalClose'] and proof['result'] == 0 and proof['sourceUnchanged']
          assert proof['before'] == proof['after'] and not proof['samplingErrors']
          assert not proof['externalObserved'] and not proof['postCloseCoordinators']
          plan = json.loads((directory / 'shipping-launch-plan.json').read_text())
          for target, versions in plan['patchTargets'].items():
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest() == versions['beforeSha256']
          PY
          git apply --check notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/shipping.patch
          git apply notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/shipping.patch
      - name: Preserve shipping attempt without retry
        continue-on-error: true
        env:
          ORCA_SERIALIZE_CHECKPOINT_CAPTURE: notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/runs/${{ matrix.runtime }}-${{ matrix.seed }}/after-checkpoints.jsonl
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WAIT_RUNTIME" notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/shipping-launch-plan.json "serialize-oracle-blank-predicate-ci-e9b3/runs/$WAIT_RUNTIME-$WAIT_SEED/after" "$WAIT_SEED"
      - name: Preserve every raw attempt and runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serialize-oracle-blank-predicate-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/serialize-oracle-blank-predicate-ci-e9b3/
  evidence:
    name: Independently verify eight original and candidate attempts
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: serialize-oracle-blank-predicate-*
          path: wait-artifacts
      - name: Verify exact original cases, routes and provenance
        env:
          WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/serialize-oracle-blank-predicate/collect-results.py wait-artifacts .github/benchmark/serialize-oracle-blank-predicate/payload serialize-oracle-blank-predicate-result.json
      - name: Preserve evidence even when qualification rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serialize-oracle-blank-predicate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            serialize-oracle-blank-predicate-result.json
            checkpoint-comparisons/
