name: Manual Windows two-contract native diagnostic
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed fd67 source; temporary definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-windows-pty-two-contracts-fd67-strict-receipts
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      PTY_DIAGNOSTIC_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Preserve named source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          persist-native-cache: 'false'
      - name: Bind original installed owners and common real fixtures
        run: node .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/materialize.mjs prepare
      - name: First full before command
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:ORCA_IMPORT_REUSE_DETAILS = 'notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/before-details.json'
          $started = [DateTime]::UtcNow.ToString('o')
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $arguments = @('exec', 'vitest', 'run', '--config', 'config/vitest.config.ts', '--maxWorkers=4', 'src/main/windows/windows-pty-job.win32.test.ts', '--reporter=default', '--reporter=json', '--reporter=./notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/report-details-reporter.mjs', '--outputFile=notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/before-report.json')
          & pnpm @arguments 2>&1 | Tee-Object -FilePath notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/before-command.log
          $code = $LASTEXITCODE
          $clock.Stop()
          node .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/materialize.mjs record before "$code" "$started" "$($clock.Elapsed.TotalMilliseconds)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/collect-results.py notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci before
          exit $LASTEXITCODE
      - name: Switch only installed JavaScript and TypeScript owners
        run: node .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/materialize.mjs switch
      - name: First full after command
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:ORCA_IMPORT_REUSE_DETAILS = 'notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/after-details.json'
          $started = [DateTime]::UtcNow.ToString('o')
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $arguments = @('exec', 'vitest', 'run', '--config', 'config/vitest.config.ts', '--maxWorkers=4', 'src/main/windows/windows-pty-job.win32.test.ts', 'config/scripts/node-pty-windows-pty-teardown-patch.test.mjs', '--reporter=default', '--reporter=json', '--reporter=./notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/report-details-reporter.mjs', '--outputFile=notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/after-report.json')
          & pnpm @arguments 2>&1 | Tee-Object -FilePath notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/after-command.log
          $code = $LASTEXITCODE
          $clock.Stop()
          node .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/materialize.mjs record after "$code" "$started" "$($clock.Elapsed.TotalMilliseconds)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $code
      - name: Retain fail-closed complete diagnostic disposition
        if: always()
        run: python .benchmark-definition/.github/benchmark/windows-pty-two-contracts-fd67-strict-receipts/collect-results.py notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci final
      - name: Preserve both first attempts and native bytes even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-pty-two-contracts-fd67-strict-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/windows-pty-two-contracts-fd67-strict-receipts-ci/
