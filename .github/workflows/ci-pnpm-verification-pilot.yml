name: Manual corrected shared Vite transform server qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed907cb6e source; diagnostic definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-corrected-shared-vite-transform-server-qualification
  cancel-in-progress: false
jobs:
  qualify:
    name: One held ARM4, eight shared-server correctness commands
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      SHARED_SERVER_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize source-bound stock qualifier and separate diagnostics
        run: node .benchmark-definition/.github/benchmark/shared-vite-server/materialize.mjs
      - name: Preserve before bun seed 104729, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before bun notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/bun-104729/before 104729
      - name: Preserve before bun seed 130363, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before bun notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/bun-130363/before 130363
      - name: Preserve before node seed 104729, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before node notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/node-104729/before 104729
      - name: Preserve before node seed 130363, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before node notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/node-130363/before 130363
      - name: Require original source and lifecycle boundaries, then apply candidate
        run: |
          python3 - <<'PYGUARD'
          import hashlib, json
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/shared-vite-server-corrected-ci-907')
          plan = json.loads((directory / 'shipping-launch-plan.json').read_text())
          for runtime in ['bun', 'node']:
              for seed in plan['shuffleSeeds']:
                  prefix = directory / 'runs' / (runtime + '-' + str(seed)) / 'before'
                  proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
                  assert proof['normalClose'] and proof['result'] in [0, 1] and proof['sourceUnchanged']
                  assert proof['before'] == proof['after'] and not proof['samplingErrors']
                  assert not proof['externalObserved'] and not proof['postCloseCoordinators']
                  assert proof['before']['untrackedSources'] == sorted(plan['probeSourceHashes'])
          assert hashlib.sha256(Path('config/vitest.config.ts').read_bytes()).hexdigest() == plan['patchTargets']['config/vitest.config.ts']['beforeSha256']
          PYGUARD
          git apply --check notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping.patch
          git apply notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping.patch
          node notes/bun-migration/performance/shared-vite-server-corrected-ci-907/apply-framework-correction.mjs
      - name: Preserve after bun seed 104729, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after bun notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/bun-104729/after 104729
      - name: Preserve after bun seed 130363, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after bun notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/bun-130363/after 130363
      - name: Preserve after node seed 104729, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after node notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/node-104729/after 104729
      - name: Preserve after node seed 130363, no retries
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after node notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shipping-launch-plan.json shared-vite-server-corrected-ci-907/runs/node-130363/after 130363
      - name: Independently validate every source/configuration/case/process boundary
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/shared-vite-server/payload/collect-results.py notes/bun-migration/performance .benchmark-definition/.github/benchmark/shared-vite-server/payload notes/bun-migration/performance/shared-vite-server-corrected-ci-907/shared-vite-server-result.json
      - name: Preserve all reports and partial failures without reruns
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-vite-server-eight
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/shared-vite-server-corrected-ci-907/
