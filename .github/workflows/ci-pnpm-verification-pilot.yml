name: Manual isolated replay CPU sampling
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed31a source; temporary definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-serialize-grid-cpu-explicit-worker-argv
  cancel-in-progress: false
jobs:
  capture:
    name: Unchanged112-case replay CPU observation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      BENCH_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize one unchanged file and fresh owned profile directory
        run: node .benchmark-definition/.github/benchmark/serialize-grid-cpu-explicit-worker-argv/materialize.mjs
      - name: Capture stock replay command once without retry
        run: node notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-diagnostic/benchmark-matched-shard.mjs four 0 1
      - name: Verify raw workload and actual target CPU frames
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/serialize-grid-cpu-explicit-worker-argv/collect-results.py notes/bun-migration/performance .benchmark-definition/.github/benchmark/serialize-grid-cpu-explicit-worker-argv/payload serialize-grid-cpu-explicit-worker-argv-observation.json
      - name: Preserve every raw profile, workload report and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serialize-grid-cpu-explicit-worker-argv-observation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            serialize-grid-cpu-explicit-worker-argv-observation.json
            notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-shard-*
            notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-benchmark-freeze.json
            notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-diagnostic/*.json
            notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-diagnostic/*.mjs
            notes/bun-migration/performance/serialize-grid-cpu-explicit-worker-argv-diagnostic/owned-cpu-profiles/**
