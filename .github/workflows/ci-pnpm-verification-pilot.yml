name: Manual PTY cleanup polling held timing
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed31a5 source only; temporary definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-pty-io-cleanup-poll-held-timing
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WAIT_TIMING_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize source and actual8 correctness admission
        run: node .benchmark-definition/.github/benchmark/pty-io-cleanup-poll-held-timing/materialize.mjs
      - name: Count all six whole commands without warmup or retry
        run: |
          driver=notes/bun-migration/performance/benchmark-persistence-import-reuse.mjs
          plan=notes/bun-migration/performance/pty-io-cleanup-poll-held-timing-ci-31a5/measurement-plan.json
          patch=notes/bun-migration/performance/pty-io-cleanup-poll-held-timing-ci-31a5/shipping.patch
          node "$driver" before 0 "$plan"
          git apply --check "$patch"
          git apply "$patch"
          node "$driver" after 0 "$plan"
          node "$driver" after 1 "$plan"
          git apply --reverse --check "$patch"
          git apply --reverse "$patch"
          git diff --exit-code HEAD
          node "$driver" before 1 "$plan"
          node "$driver" before 2 "$plan"
          git apply --check "$patch"
          git apply "$patch"
          node "$driver" after 2 "$plan"
      - name: Independently verify all six retained commands
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/pty-io-cleanup-poll-held-timing/collect-results.py notes/bun-migration/performance .benchmark-definition/.github/benchmark/pty-io-cleanup-poll-held-timing/payload pty-io-cleanup-poll-held-timing-result.json
      - name: Preserve every attempted sample and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pty-io-cleanup-poll-held-timing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/pty-io-cleanup-poll-held-timing-ci-31a5/
            notes/bun-migration/performance/pty-io-cleanup-poll-held-31a5-*
            pty-io-cleanup-poll-held-timing-result.json
