name: TUI teardown qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: TUI teardown node 24
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout benchmark support
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unpack frozen inputs outside source checkout
        run: |
          mkdir -p "$RUNNER_TEMP/tui-teardown-bundle" "$RUNNER_TEMP/tui-teardown-results"
          tar -xzf config/ci-capacity-benchmark/tui-teardown.tar.gz -C "$RUNNER_TEMP/tui-teardown-bundle"
          test -f "$RUNNER_TEMP/tui-teardown-bundle/manifest.json"
      - name: Checkout exact qualified source
        uses: actions/checkout@v6
        with:
          ref: 5cce5f56775d3d66eb3abe2fbc80900c4eff5c05
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24.21.0'
          cache-electron-package: 'true'
      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs
      - name: Qualify teardown and separately qualify terminal parity
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: python3 "$RUNNER_TEMP/tui-teardown-bundle/run-hosted.py" --out "$RUNNER_TEMP/tui-teardown-results"
      - name: Archive every report and provenance receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-teardown-node-24-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tui-teardown-results
          retention-days: 14
          if-no-files-found: error
