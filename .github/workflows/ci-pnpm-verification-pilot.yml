name: Manual headless host-chain passive phases
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed31a5 source; temporary definition must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-headless-host-chain-phases
  cancel-in-progress: false
jobs:
  qualify:
    name: Passive phases ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runtime: [node]
        seed: [104729]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
      WAIT_RUNTIME: ${{ matrix.runtime }}
      WAIT_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize unchanged stock controller and passive marker proposal
        run: node .benchmark-definition/.github/benchmark/headless-host-chain-phases/materialize.mjs
      - name: Apply passive markers on exact original
        run: |
          git apply --check notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/original.patch
          git apply notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/original.patch
      - name: Preserve original plus passive-marker attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WAIT_RUNTIME" notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/original-launch-plan.json "headless-host-chain-phases-ci-31a5/runs/$WAIT_RUNTIME-$WAIT_SEED/original" "$WAIT_SEED"
      - name: Require original-marker source and process boundaries before shipping patch
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/headless-host-chain-phases-ci-31a5')
          prefix = directory / 'runs' / (os.environ['WAIT_RUNTIME'] + '-' + os.environ['WAIT_SEED']) / 'original'
          proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
          assert proof['normalClose'] and proof['result'] in [0, 1] and proof['sourceUnchanged']
          assert proof['before'] == proof['after'] and not proof['samplingErrors']
          assert not proof['externalObserved'] and not proof['postCloseCoordinators']
          plan = json.loads((directory / 'original-launch-plan.json').read_text())
          for target, versions in plan['patchTargets'].items():
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest() == versions['afterSha256']
          PY
          git apply --reverse --check notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/original.patch
          git apply --reverse notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/original.patch
          git diff --exit-code HEAD
          git apply --check notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/shipping.patch
          git apply notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/shipping.patch
      - name: Preserve shipping attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WAIT_RUNTIME" notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/shipping-launch-plan.json "headless-host-chain-phases-ci-31a5/runs/$WAIT_RUNTIME-$WAIT_SEED/shipping" "$WAIT_SEED"
      - name: Preserve every raw attempt and runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-host-chain-phases-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/headless-host-chain-phases-ci-31a5/
  evidence:
    name: Observe two original and shipping phase attempts
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: headless-host-chain-phases-*
          path: wait-artifacts
      - name: Verify raw case coverage, phase observations and provenance
        env:
          WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/headless-host-chain-phases/collect-results.py wait-artifacts .github/benchmark/headless-host-chain-phases/payload headless-host-chain-phases-result.json
      - name: Preserve diagnostic evidence on success or rejection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headless-host-chain-phases-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: headless-host-chain-phases-result.json
