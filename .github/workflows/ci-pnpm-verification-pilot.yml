name: pnpm verification cache pilot

on:
  pull_request:
    paths: ['.github/workflows/ci-pnpm-verification-pilot.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot to run
        type: choice
        required: true
        default: verification-cache
        options: [verification-cache, mac-native-floor]

permissions:
  contents: read

concurrency:
  group: pnpm-verification-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  seed:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
      # PR caches are scoped to the PR merge ref; main never restores them.
      - uses: actions/cache/save@v5
        if: steps.deps.outputs.verification-cache-hit != 'true'
        with:
          path: ${{ steps.deps.outputs.verification-cache-path }}
          key: ${{ steps.deps.outputs.verification-cache-key }}

  measure:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    needs: seed
    name: measure ${{ matrix.runner }} sample ${{ matrix.sample }} cache ${{ matrix.cache }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        sample: [1, 2, 3]
        cache: ['false', 'true']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          cache-pnpm-verification: ${{ matrix.cache }}
      - name: Validate treatment and frozen install
        env:
          CACHE_ENABLED: ${{ matrix.cache }}
          CACHE_HIT: ${{ steps.deps.outputs.verification-cache-hit }}
        run: |
          if [ "$CACHE_ENABLED" = true ]; then test "$CACHE_HIT" = true; fi
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          node -e "require.resolve('vitest'); require.resolve('electron')"

  mac-native-floor:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mac-native-floor'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: none
      - uses: ./.github/actions/prepare-orcad-prebuilds
      - run: pnpm build:orcad
      - name: Inspect macOS deployment floors and exact native payloads
        if: always() && steps.deps.outcome == 'success'
        run: pnpm exec node config/scripts/ci-mac-native-floor-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-native-floor-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/orca-mac-native-floor
            out/orcad-prebuilds/manifest.json
            out/orcad-prebuilds/darwin-arm64/pty.node
            out/orcad-prebuilds/darwin-arm64/spawn-helper
            out/orcad/node_modules/@parcel/watcher/watcher.node
