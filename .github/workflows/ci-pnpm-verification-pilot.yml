name: Manual matched full Node and Bun pipeline
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA matching the benchmark plan.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-matched-full-node-bun-pipeline
  cancel-in-progress: false
jobs:
  paired_shard:
    name: Matched complete shard ${{ matrix.shard }}/5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout benchmark definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize reviewed full workload and stock shard map
        env:
          BENCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .benchmark-definition/.github/benchmark/matched-full-pipeline/materialize.mjs
      - name: Pair0 Node cold
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs node 0 ${{ matrix.shard }}
      - name: Pair0 Bun cold
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs bun 0 ${{ matrix.shard }}
      - name: Pair1 Bun warm
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs bun 1 ${{ matrix.shard }}
      - name: Pair1 Node warm
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs node 1 ${{ matrix.shard }}
      - name: Pair2 Node warm
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs node 2 ${{ matrix.shard }}
      - name: Pair2 Bun warm
        run: node notes/bun-migration/performance/whole-suite-matched-pipeline/benchmark-matched-shard.mjs bun 2 ${{ matrix.shard }}
      - name: Preserve raw status and every counted sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matched-pipeline-shard-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/matched-node-bun-pipeline-*
            notes/bun-migration/performance/whole-suite-matched-pipeline/*.json
            notes/bun-migration/performance/whole-suite-matched-pipeline/*.mjs
  evidence:
    name: Verify full matched workload and compare critical paths
    if: always()
    needs: paired_shard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: matched-pipeline-shard-*
          path: matched-artifacts
      - name: Require all five shards and all three exact pairs
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_DEFINITION_SHA: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/benchmark/matched-full-pipeline/collect-results.mjs matched-artifacts
      - name: Preserve aggregate evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matched-pipeline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: matched-pipeline-result.json
