name: Sequential heavy preflight safety qualification
on:
  workflow_dispatch: {}
concurrency:
  group: sequential-heavy-safety-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_SHARD_SOURCE_SHA: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
jobs:
  code_paths:
    name: Native no-op joins and explicit selector fixtures
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      static_analysis: ${{ steps.routing.outputs.static_analysis }}
      typecheck: ${{ steps.routing.outputs.typecheck }}
      git_compatibility: ${{ steps.routing.outputs.git_compatibility }}
      codex_index_heal_contract: ${{ steps.routing.outputs.codex_index_heal_contract }}
      xterm_patch_sync: ${{ steps.routing.outputs.xterm_patch_sync }}
      shell_contracts: ${{ steps.routing.outputs.shell_contracts }}
      test: ${{ steps.routing.outputs.test }}
      orcad_browser: ${{ steps.routing.outputs.orcad_browser }}
      mobile_web_app: ${{ steps.routing.outputs.mobile_web_app }}
      cross-version-wire: ${{ steps.routing.outputs.cross-version-wire }}
      managed_hook_node18: ${{ steps.routing.outputs.managed_hook_node18 }}
      package: ${{ steps.routing.outputs.package }}
      package_windows: ${{ steps.routing.outputs.package_windows }}
      should_run: ${{ steps.routing.outputs.should_run }}
      mobile_dependencies: ${{ steps.routing.outputs.mobile_dependencies }}
    steps:
      - &a1
        name: Hold the frozen safety driver outside source checkout
        run: |-
          mkdir -p "$RUNNER_TEMP/orca-heavy-safety"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/orca-heavy-safety/safety.mjs"
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/orca-heavy-safety/context.json"
      - id: selectors
        run: |-
          echo "tc_only_static=false" >> "$GITHUB_OUTPUT"
          echo "static_only_type=false" >> "$GITHUB_OUTPUT"
      - name: 'tc-only: Lint'
        id: tc-only-root-lint
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm exec oxlint --format github
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.tc_only_static }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - wait: tc-only-root-lint
      - name: 'tc-only: Enforce focused code-quality plugins'
        id: tc-only-native-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run audit:code-quality:native
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.tc_only_static }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - wait: tc-only-native-code-quality
      - name: 'tc-only: Enforce changed-code quality'
        id: tc-only-changed-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run check:code-quality:changed -- "${{ github.event.pull_request.base.sha }}"
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.tc_only_static }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - wait: tc-only-changed-code-quality
      - name: 'tc-only: Verify localization extraction'
        id: tc-only-localization-extraction
        background: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.tc_only_static }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          # Detection failures run the full check; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/localization-changes" &&
            scope="$(node config/scripts/localization-extraction-change-scope.mjs "$RUNNER_TEMP/localization-changes")" && [ "$scope" = false ]; then
            echo "Localization extraction inputs are unchanged."
          else
            pnpm run verify:localization-extraction
          fi
        if: '!cancelled()'
      - name: 'tc-only: Verify localization catalogs'
        id: tc-only-localization-catalogs
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run verify:localization-catalogs
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.tc_only_static }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - wait:
          - tc-only-localization-catalogs
          - tc-only-localization-extraction
      - name: 'static-only: Plan unit selection'
        id: static-only-unit-plan
        background: true
        env:
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ steps.selectors.outputs.static_only_type }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          node config/scripts/ci-unit-plan.mjs
        if: '!cancelled()'
      - wait: static-only-unit-plan
      - name: Require registered no-op bodies and publish labelled routing fixtures
        id: routing
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |-
          node "$RUNNER_TEMP/orca-heavy-safety/safety.mjs" noops
          echo "static_analysis=true" >> "$GITHUB_OUTPUT"
          echo "typecheck=true" >> "$GITHUB_OUTPUT"
          echo "git_compatibility=true" >> "$GITHUB_OUTPUT"
          echo "codex_index_heal_contract=true" >> "$GITHUB_OUTPUT"
          echo "xterm_patch_sync=true" >> "$GITHUB_OUTPUT"
          echo "shell_contracts=true" >> "$GITHUB_OUTPUT"
          echo "test=true" >> "$GITHUB_OUTPUT"
          echo "orcad_browser=true" >> "$GITHUB_OUTPUT"
          echo "mobile_web_app=true" >> "$GITHUB_OUTPUT"
          echo "cross-version-wire=true" >> "$GITHUB_OUTPUT"
          echo "managed_hook_node18=true" >> "$GITHUB_OUTPUT"
          echo "package=true" >> "$GITHUB_OUTPUT"
          echo "package_windows=true" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "mobile_dependencies=false" >> "$GITHUB_OUTPUT"
      - if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: heavy-safety-noops-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-heavy-safety/noops.json
          if-no-files-found: error
          retention-days: 14
  compiler_failure:
    name: Controlled compiler failure
    needs:
      - code_paths
    if: (needs.code_paths.outputs.static_analysis == 'true') || (needs.code_paths.outputs.typecheck == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - *a1
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies != 'true')
        with:
          native-runtime: node
          node-version: '24'
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
        with:
          native-runtime: node
          node-version: '24'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.typecheck == 'true') && !(needs.code_paths.outputs.static_analysis == 'true')
      - name: Lint
        id: root-lint
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm exec oxlint --format github
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Reject low-evidence patterns
        run: pnpm run audit:anti-slop
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: root-lint
      - name: Enforce focused code-quality plugins
        id: native-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run audit:code-quality:native
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce type-aware code-quality baseline
        run: pnpm run audit:code-quality:type-aware
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: native-code-quality
      - uses: ./.github/actions/install-mobile-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
      - name: Enforce changed-code quality
        id: changed-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run check:code-quality:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce React Doctor on changed lines
        run: pnpm run check:react-doctor:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: changed-code-quality
      - name: Check Zustand selector fan-out budget
        run: pnpm run check:zustand-selector-fanout
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check reliability gate manifest
        run: pnpm run check:reliability-gates
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce dead design-system classes
        run: pnpm run check:dead-classes
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check VM runtime rollback compatibility
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --quiet "$DIFF_BASE" HEAD -- \
            src/shared/ephemeral-vm-runtime-store.ts \
            src/shared/ephemeral-vm-runtime-feature-store.ts \
            src/shared/ephemeral-vm-runtime-rollback-projection.ts \
            src/shared/ephemeral-vm-runtimes.ts \
            src/shared/ephemeral-vm-recipes.ts \
            src/shared/orca-yaml-hook-types.ts \
            src/main/ephemeral-vm-runtime-service.ts \
            src/main/ephemeral-vm-runtime-provisioning-persistence.ts \
            src/main/ephemeral-vm-failed-start-cleanup.ts; then
            echo "VM runtime persistence is unchanged."
            exit 0
          fi
          node config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs \
            config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce max-lines ratchet
        run: pnpm run check:max-lines-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce ts-nocheck ratchet
        run: pnpm run check:ts-nocheck-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce runtime Electron-import ratchet
        run: pnpm run check:runtime-electron-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check Node runtime pin
        run: pnpm run check:node-runtime-pin
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization extraction
        id: localization-extraction
        background: true
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          # Detection failures run the full check; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/localization-changes" &&
            scope="$(node config/scripts/localization-extraction-change-scope.mjs "$RUNNER_TEMP/localization-changes")" && [ "$scope" = false ]; then
            echo "Localization extraction inputs are unchanged."
          else
            pnpm run verify:localization-extraction
          fi
        if: '!cancelled()'
      - name: Boot orcad and round-trip a terminal
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          # Detection failures run the smoke; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/orcad-smoke-changes" &&
            scope="$(node config/scripts/orcad-terminal-smoke-change-scope.mjs "$RUNNER_TEMP/orcad-smoke-changes")" && [ "$scope" = false ]; then
            echo "Orcad terminal smoke inputs are unchanged."
          else
            pnpm run smoke:orcad-terminal
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify the generated RPC params catalog
        run: pnpm run verify:rpc-params-catalog
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify bundled skill guides
        run: pnpm run verify:bundled-skill-guides
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify skill freshness manifest
        run: pnpm run verify:skill-bundle-manifest
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization catalogs
        id: localization-catalogs
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run verify:localization-catalogs
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Verify localization coverage
        run: pnpm run verify:localization-coverage
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait:
          - localization-catalogs
          - localization-extraction
      - name: Guard against project-owned .d.ts in preload/shared
        run: |
          matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under src/preload or src/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts."
            echo "Found:"
            echo "$matches"
            exit 1
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check feature wall asset budget
        run: pnpm check:feature-wall-assets
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Require the selected static checks to pass
        id: static-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
      - name: Add one owned included source only after static success
        run: |-
          test ! -e src/main/ci-preflight-compiler-fault.ts
          printf "%s\n" "export const ciQualificationCompilerFault: string = 42" > src/main/ci-preflight-compiler-fault.ts
      - name: Restore the compiler and planner Node version
        id: typecheck-node
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.typecheck == 'true')
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Cache TypeScript incremental state
        uses: actions/cache@v5
        with:
          path: config/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-
        if: needs.code_paths.outputs.typecheck == 'true'
      - name: Plan unit selection
        id: unit-plan
        background: true
        env:
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          node config/scripts/ci-unit-plan.mjs
        if: '!cancelled()'
      - run: |-
          set +e
          pnpm run typecheck > "$RUNNER_TEMP/orca-heavy-safety/compiler.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/orca-heavy-safety/compiler.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        if: needs.code_paths.outputs.typecheck == 'true'
        id: compiler-command
        name: Run the unchanged compiler command and retain its real status
      - wait: unit-plan
      - uses: actions/upload-artifact@v7
        with:
          name: unit-selection-compiler_failure-attempt-${{ github.run_attempt }}
          path: ci-shards/unit-selection.json
          retention-days: 14
        if: needs.code_paths.outputs.typecheck == 'true'
        id: selection-upload
      - name: Require the selected compiler and joined plan to pass
        id: typecheck-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the exact foreground fault prerequisites
        id: foreground-evidence
        if: '!cancelled()'
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node "$RUNNER_TEMP/orca-heavy-safety/safety.mjs" foreground compiler_failure
      - if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: heavy-safety-compiler_failure-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-heavy-safety/compiler_failure.json
          if-no-files-found: error
          retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 25
    outputs:
      static_result: ${{ steps.static-complete.outputs.result || 'blocked' }}
      typecheck_result: ${{ steps.typecheck-complete.outputs.result || 'blocked' }}
      shards: ${{ steps.unit-plan.outputs.shards }}
      foreground_qualified: ${{ steps.foreground-evidence.outputs.qualified }}
  compiler_failure_unit:
    name: 'compiler_failure: good unit gate must skip'
    needs:
      - code_paths
      - compiler_failure
    if: |-
      needs.code_paths.result == 'success' &&
      !cancelled() && needs.code_paths.outputs.test == 'true' && needs.compiler_failure.result == 'success' && needs.compiler_failure.outputs.typecheck_result == 'success'
      && needs.compiler_failure.outputs.static_result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |-
          echo "::error::A good downstream gate admitted a failed preflight"
          exit 1
  compiler_failure_package:
    name: 'compiler_failure: good package gate must skip'
    needs:
      - code_paths
      - compiler_failure
    if: needs.code_paths.outputs.package == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |-
          echo "::error::A good downstream gate admitted a failed preflight"
          exit 1
  post_failure:
    name: Controlled post failure
    needs:
      - code_paths
    if: (needs.code_paths.outputs.static_analysis == 'true') || (needs.code_paths.outputs.typecheck == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - *a1
      - name: Materialize the private post fault before dependency actions register posts
        run: |-
          mkdir -p .tmp/ci-preflight-post-fault
          printf '%s' 'bmFtZTogQ29udHJvbGxlZCBsYXRlIHByZWZsaWdodCBmYWlsdXJlCmRlc2NyaXB0aW9uOiBUZW1wb3JhcnkgcXVhbGlmaWNhdGlvbiBhY3Rpb247IGl0cyBtYWluIHN1Y2NlZWRzIGFuZCBpdHMgcmVhbCBwb3N0IGRlbGliZXJhdGVseSBmYWlscy4KcnVuczoKICB1c2luZzogbm9kZTI0CiAgbWFpbjogbWFpbi5tanMKICBwb3N0OiBwb3N0Lm1qcwogIHBvc3QtaWY6IGFsd2F5cygpCg==' | base64 --decode > .tmp/ci-preflight-post-fault/action.yml
          printf '%s' '' | base64 --decode > .tmp/ci-preflight-post-fault/main.mjs
          printf '%s' '' | base64 --decode > .tmp/ci-preflight-post-fault/post.mjs
      - name: Register deliberate late post failure
        id: post-fault
        uses: ./.tmp/ci-preflight-post-fault
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies != 'true')
        with:
          native-runtime: node
          node-version: '24'
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
        with:
          native-runtime: node
          node-version: '24'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.typecheck == 'true') && !(needs.code_paths.outputs.static_analysis == 'true')
      - name: Lint
        id: root-lint
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm exec oxlint --format github
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Reject low-evidence patterns
        run: pnpm run audit:anti-slop
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: root-lint
      - name: Enforce focused code-quality plugins
        id: native-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run audit:code-quality:native
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce type-aware code-quality baseline
        run: pnpm run audit:code-quality:type-aware
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: native-code-quality
      - uses: ./.github/actions/install-mobile-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
      - name: Enforce changed-code quality
        id: changed-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run check:code-quality:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce React Doctor on changed lines
        run: pnpm run check:react-doctor:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: changed-code-quality
      - name: Check Zustand selector fan-out budget
        run: pnpm run check:zustand-selector-fanout
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check reliability gate manifest
        run: pnpm run check:reliability-gates
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce dead design-system classes
        run: pnpm run check:dead-classes
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check VM runtime rollback compatibility
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --quiet "$DIFF_BASE" HEAD -- \
            src/shared/ephemeral-vm-runtime-store.ts \
            src/shared/ephemeral-vm-runtime-feature-store.ts \
            src/shared/ephemeral-vm-runtime-rollback-projection.ts \
            src/shared/ephemeral-vm-runtimes.ts \
            src/shared/ephemeral-vm-recipes.ts \
            src/shared/orca-yaml-hook-types.ts \
            src/main/ephemeral-vm-runtime-service.ts \
            src/main/ephemeral-vm-runtime-provisioning-persistence.ts \
            src/main/ephemeral-vm-failed-start-cleanup.ts; then
            echo "VM runtime persistence is unchanged."
            exit 0
          fi
          node config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs \
            config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce max-lines ratchet
        run: pnpm run check:max-lines-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce ts-nocheck ratchet
        run: pnpm run check:ts-nocheck-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce runtime Electron-import ratchet
        run: pnpm run check:runtime-electron-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check Node runtime pin
        run: pnpm run check:node-runtime-pin
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization extraction
        id: localization-extraction
        background: true
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          # Detection failures run the full check; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/localization-changes" &&
            scope="$(node config/scripts/localization-extraction-change-scope.mjs "$RUNNER_TEMP/localization-changes")" && [ "$scope" = false ]; then
            echo "Localization extraction inputs are unchanged."
          else
            pnpm run verify:localization-extraction
          fi
        if: '!cancelled()'
      - name: Boot orcad and round-trip a terminal
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_BACKGROUND_LAUNCH: '1'
        run: |
          # Detection failures run the smoke; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/orcad-smoke-changes" &&
            scope="$(node config/scripts/orcad-terminal-smoke-change-scope.mjs "$RUNNER_TEMP/orcad-smoke-changes")" && [ "$scope" = false ]; then
            echo "Orcad terminal smoke inputs are unchanged."
          else
            pnpm run smoke:orcad-terminal
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify the generated RPC params catalog
        run: pnpm run verify:rpc-params-catalog
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify bundled skill guides
        run: pnpm run verify:bundled-skill-guides
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify skill freshness manifest
        run: pnpm run verify:skill-bundle-manifest
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization catalogs
        id: localization-catalogs
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run verify:localization-catalogs
        if: '!cancelled()'
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Verify localization coverage
        run: pnpm run verify:localization-coverage
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait:
          - localization-catalogs
          - localization-extraction
      - name: Guard against project-owned .d.ts in preload/shared
        run: |
          matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under src/preload or src/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts."
            echo "Found:"
            echo "$matches"
            exit 1
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check feature wall asset budget
        run: pnpm check:feature-wall-assets
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Require the selected static checks to pass
        id: static-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the compiler and planner Node version
        id: typecheck-node
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.typecheck == 'true')
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Cache TypeScript incremental state
        uses: actions/cache@v5
        with:
          path: config/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-
        if: needs.code_paths.outputs.typecheck == 'true'
      - name: Plan unit selection
        id: unit-plan
        background: true
        env:
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          node config/scripts/ci-unit-plan.mjs
        if: '!cancelled()'
      - run: |-
          set +e
          pnpm run typecheck > "$RUNNER_TEMP/orca-heavy-safety/compiler.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/orca-heavy-safety/compiler.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        if: needs.code_paths.outputs.typecheck == 'true'
        id: compiler-command
        name: Run the unchanged compiler command and retain its real status
      - wait: unit-plan
      - uses: actions/upload-artifact@v7
        with:
          name: unit-selection-post_failure-attempt-${{ github.run_attempt }}
          path: ci-shards/unit-selection.json
          retention-days: 14
        if: needs.code_paths.outputs.typecheck == 'true'
        id: selection-upload
      - name: Require the selected compiler and joined plan to pass
        id: typecheck-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
      - name: Require the exact foreground fault prerequisites
        id: foreground-evidence
        if: '!cancelled()'
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: node "$RUNNER_TEMP/orca-heavy-safety/safety.mjs" foreground post_failure
      - if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: heavy-safety-post_failure-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-heavy-safety/post_failure.json
          if-no-files-found: error
          retention-days: 14
    permissions:
      contents: read
    timeout-minutes: 25
    outputs:
      static_result: ${{ steps.static-complete.outputs.result || 'blocked' }}
      typecheck_result: ${{ steps.typecheck-complete.outputs.result || 'blocked' }}
      shards: ${{ steps.unit-plan.outputs.shards }}
      foreground_qualified: ${{ steps.foreground-evidence.outputs.qualified }}
  post_failure_unit:
    name: 'post_failure: good unit gate must skip'
    needs:
      - code_paths
      - post_failure
    if: |-
      needs.code_paths.result == 'success' &&
      !cancelled() && needs.code_paths.outputs.test == 'true' && needs.post_failure.result == 'success' && needs.post_failure.outputs.typecheck_result == 'success'
      && needs.post_failure.outputs.static_result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |-
          echo "::error::A good downstream gate admitted a failed preflight"
          exit 1
  post_failure_package:
    name: 'post_failure: good package gate must skip'
    needs:
      - code_paths
      - post_failure
    if: needs.code_paths.outputs.package == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - run: |-
          echo "::error::A good downstream gate admitted a failed preflight"
          exit 1
  unsafe_unit_canary_and_audit:
    name: Weakened gate canary and exact observed failure audit
    needs:
      - code_paths
      - compiler_failure
      - compiler_failure_unit
      - compiler_failure_package
      - post_failure
      - post_failure_unit
      - post_failure_package
    if: |-
      needs.code_paths.result == 'success' &&
      !cancelled() && needs.code_paths.outputs.test == 'true' && needs.post_failure.outputs.typecheck_result == 'success'
      && needs.post_failure.outputs.static_result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
      - *a1
      - name: Download only this attempt’s real foreground and no-op receipts
        uses: actions/download-artifact@v8
        with:
          pattern: heavy-safety-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-heavy-safety/artifacts
          merge-multiple: true
      - name: Require failed physical jobs, skipped good admissions and unchanged aggregate rejection
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node "$RUNNER_TEMP/orca-heavy-safety/safety.mjs" audit
      - if: '!cancelled()'
        uses: actions/upload-artifact@v7
        with:
          name: heavy-safety-audit-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-heavy-safety/audit.json
          if-no-files-found: error
          retention-days: 14
