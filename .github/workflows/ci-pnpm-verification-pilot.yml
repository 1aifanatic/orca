name: CI import and native deadline qualification
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact source commit SHA shared by every checkout
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-next-measurements-${{ github.ref }}
  cancel-in-progress: false
env:
  ORCA_BACKGROUND_LAUNCH: "1"
jobs:
  focused-unit-comparisons:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: "24"
          native-runtime: node
          cache-electron-package: "true"
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Record source and runner toolchain
        run: |-
          node -e 'const fs=require("node:fs"),os=require("node:os");fs.writeFileSync(process.env.RUNNER_TEMP+"/ci-qualification-toolchain.json",JSON.stringify({node:process.version,versions:process.versions,platform:process.platform,arch:process.arch,cpus:os.cpus().length,memoryBytes:os.totalmem(),workflowSha:process.env.GITHUB_SHA},null,2))'
          pnpm --version > "$RUNNER_TEMP/ci-qualification-pnpm.txt"
      - name: Compare independent native deadline cases
        shell: bash
        run: |
          set -euo pipefail
          pilot="$RUNNER_TEMP/incumbent-pilot"
          mkdir -p "$pilot"
          tar -xzf config/ci-next-measurements/incumbent.tar.gz -C "$pilot"
          python3 "$pilot/qualify.py" benchmark --out "$pilot/benchmark-receipts"
          python3 "$pilot/qualify.py" controls --out "$pilot/controls-receipts"
      - name: Compare commentable-line imports
        shell: bash
        run: |
          set -euo pipefail
          pilot="$RUNNER_TEMP/commentable-pilot"
          mkdir -p "$pilot"
          tar -xzf config/ci-next-measurements/commentable.tar.gz -C "$pilot"
          python3 "$pilot/run-benchmark.py" --out "$pilot/benchmark-receipts"
          python3 "$pilot/run-controls.py" --out "$pilot/controls-receipts"
      - name: Qualify manual diagnostic outside ordinary unit CI
        shell: bash
        run: |
          set -euo pipefail
          pilot="$RUNNER_TEMP/agent-status-benchmark-pilot"
          mkdir -p "$pilot"
          tar -xzf config/ci-next-measurements/agent-status-benchmark.tar.gz -C "$pilot"
          python3 "$pilot/verify-discovery.py" --out "$pilot/receipts/discovery"
          python3 "$pilot/run-manual.py" --out "$pilot/receipts/manual"
          python3 "$pilot/run-benchmark-cohort.py" --out "$pilot/receipts/cohort"
          python3 "$pilot/run-benchmark-controls.py" --out "$pilot/receipts/controls"
      - name: Keep complete comparison receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-next-focused-unit-comparisons
          path: |
            ${{ runner.temp }}/incumbent-pilot/benchmark-receipts
            ${{ runner.temp }}/incumbent-pilot/controls-receipts
            ${{ runner.temp }}/commentable-pilot/benchmark-receipts
            ${{ runner.temp }}/commentable-pilot/controls-receipts
            ${{ runner.temp }}/agent-status-benchmark-pilot/receipts
            ${{ runner.temp }}/ci-qualification-toolchain.json
            ${{ runner.temp }}/ci-qualification-pnpm.txt
          if-no-files-found: error
          retention-days: 7
  windows-checkout-comparisons:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
      SOURCE_REF: ${{ inputs.source-ref }}
    steps:
      - name: Initialize isolated checkout receipts
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        shell: pwsh
        run: |
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'Pin an exact 40-character source SHA' }
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-inputs.b64'), @'
          
          '@)
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-proof.cjs'), @'
          const fs = require('node:fs')
          const path = require('node:path')
          const assert = require('node:assert/strict')
          const crypto = require('node:crypto')
          const zlib = require('node:zlib')
          const directory = process.env.RUNNER_TEMP
          const qualification = JSON.parse(zlib.gunzipSync(Buffer.from(fs.readFileSync(path.join(directory, 'ssh-checkout-inputs.b64'), 'utf8').trim(), 'base64')))
          const inventory = JSON.parse(fs.readFileSync(path.join(directory, 'ssh-checkout-inventories.json'), 'utf8'))
          const times = fs.readFileSync(path.join(directory, 'ssh-checkout-timings.jsonl'), 'utf8').trim().split(/\r?\n/).map(line => JSON.parse(line))
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          const nulRows = name => fs.readFileSync(path.join(directory, name), 'utf8').split('\0').filter(Boolean)
          const index = checkout => nulRows(checkout.indexFile).map(row => {
            const match = /^(\d+) ([0-9a-f]+) (\d+)\t([\s\S]+)$/.exec(row)
            assert(match, `Invalid Git index record: ${row}`)
            return { mode: match[1], blob: match[2], stage: match[3], file: match[4] }
          }).sort((a,b) => a.file < b.file ? -1 : a.file > b.file ? 1 : 0)
          const isRequiredConeFile = file => !file.includes('/') || (file.startsWith('src/') && !file.slice(4).includes('/')) || qualification.directories.some(directory => file.startsWith(directory + '/'))
          const sourceShas = new Set(inventory.map(item => item.sha))
          const expectedSha = (process.env.SOURCE_REF ?? '').toLowerCase()
          assert(/^[0-9a-f]{40}$/.test(expectedSha), 'Pin an exact source SHA')
          assert.equal(sourceShas.size, 1, 'Every checkout must use the same pinned source SHA')
          assert.equal([...sourceShas][0], expectedSha, 'Every checkout HEAD must equal validated SOURCE_REF')
          const evidence = []
          for (let pair = 1; pair <= 3; pair++) {
            const full = inventory.find(item => item.pair === pair && item.arm === 'full')
            const sparse = inventory.find(item => item.pair === pair && item.arm === 'sparse')
            assert(full && sparse)
            const fullIndex = index(full)
            assert.deepEqual(index(sparse), fullIndex, 'Complete tracked content and Git index modes must match')
            const actual = nulRows(sparse.materializedFile).filter(row => !row.startsWith('S ')).map(row => row.slice(2)).sort()
            const expected = fullIndex.map(row => row.file).filter(isRequiredConeFile).sort()
            assert.deepEqual(actual, expected, 'Actual Git cone materialization must retain root/src files and complete selected trees')
            const materialized = new Set(actual)
            for (const input of qualification.requiredInputs) assert(materialized.has(input), `Required actual build/test input missing: ${input}`)
            const fullRoot = path.join(process.env.GITHUB_WORKSPACE, full.path)
            const sparseRoot = path.join(process.env.GITHUB_WORKSPACE, sparse.path)
            for (const file of actual) {
              const fullFile = path.join(fullRoot, file)
              const sparseFile = path.join(sparseRoot, file)
              const a = fs.lstatSync(fullFile)
              const b = fs.lstatSync(sparseFile)
              assert.equal(b.mode & 0o777, a.mode & 0o777, `Windows Node file mode parity: ${file}`)
              assert.equal(b.isSymbolicLink(), a.isSymbolicLink(), `Link-kind parity: ${file}`)
              if (a.isSymbolicLink()) assert.equal(fs.readlinkSync(sparseFile), fs.readlinkSync(fullFile), file)
              else assert.equal(digest(sparseFile), digest(fullFile), `Actual file content parity: ${file}`)
            }
            const a = times.find(item => item.pair === pair && item.arm === 'full')
            const b = times.find(item => item.pair === pair && item.arm === 'sparse')
            assert(a && b && a.elapsedBracketMs > 0 && b.elapsedBracketMs > 0)
            evidence.push({ pair, fullMs: a.elapsedBracketMs, sparseMs: b.elapsedBracketMs, savedMs: a.elapsedBracketMs - b.elapsedBracketMs, trackedFiles: fullIndex.length, materializedSparseFiles: actual.length })
          }
          const median = values => values.sort((a,b) => a-b)[Math.floor(values.length/2)]
          const receipt = { sourceSha: [...sourceShas][0], inputManifestBasisSha: qualification.sourceSha, inputManifestSha256: digest(path.join(directory, 'ssh-checkout-inputs.b64')), runner: process.env.RUNNER_OS + '/' + process.env.RUNNER_ARCH, pairs: evidence, medianFullMs: median(evidence.map(row=>row.fullMs)), medianSparseMs: median(evidence.map(row=>row.sparseMs)), medianPairedSavedMs: median(evidence.map(row=>row.savedMs)), requiredBuildAndTestInputs: qualification.requiredInputs.length, timingScope: 'Wall brackets around actual actions/checkout@v6 including action execution, shell observation and runner step boundaries; fresh private checkout paths; alternating three pairs. Excludes validation and later setup/native/provisioning. Three pairs are alternating, not perfectly order-balanced.', materializationProof: 'Actual Git cone file census, required-input census, content hashes, Git index modes, and Windows Node file modes match for every retained file.', limits: 'No Windows native/provisioning coverage or end-to-end job/setup improvement claim; final unchanged production workflow must qualify those.' }
          fs.writeFileSync(path.join(directory, 'ssh-checkout-qualification.json'), JSON.stringify(receipt, null, 2))
          console.log(JSON.stringify(receipt, null, 2))

          '@)
      - name: Start full-1 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-1.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout full-1
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-full-1
          persist-credentials: false
      - name: Finish full-1 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-1.txt')))
          $receipt = @{ pair = 1; arm = 'full'; path = 'checkout-full-1'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Start sparse-1 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-1.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout sparse-1
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-sparse-1
          persist-credentials: false
          sparse-checkout: |
            .github
            config
            native
            resources
            tests
            src/main
            src/shared
            src/relay
            src/types
      - name: Finish sparse-1 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-1.txt')))
          $receipt = @{ pair = 1; arm = 'sparse'; path = 'checkout-sparse-1'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Start sparse-2 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-2.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout sparse-2
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-sparse-2
          persist-credentials: false
          sparse-checkout: |
            .github
            config
            native
            resources
            tests
            src/main
            src/shared
            src/relay
            src/types
      - name: Finish sparse-2 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-2.txt')))
          $receipt = @{ pair = 2; arm = 'sparse'; path = 'checkout-sparse-2'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Start full-2 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-2.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout full-2
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-full-2
          persist-credentials: false
      - name: Finish full-2 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-2.txt')))
          $receipt = @{ pair = 2; arm = 'full'; path = 'checkout-full-2'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Start full-3 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-3.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout full-3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-full-3
          persist-credentials: false
      - name: Finish full-3 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-full-3.txt')))
          $receipt = @{ pair = 3; arm = 'full'; path = 'checkout-full-3'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Start sparse-3 checkout bracket
        shell: pwsh
        run: |
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-3.txt'), [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString())
      - name: Checkout sparse-3
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          path: checkout-sparse-3
          persist-credentials: false
          sparse-checkout: |
            .github
            config
            native
            resources
            tests
            src/main
            src/shared
            src/relay
            src/types
      - name: Finish sparse-3 checkout bracket
        shell: pwsh
        run: |
          $end = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $start = [long]([IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'ssh-checkout-start-sparse-3.txt')))
          $receipt = @{ pair = 3; arm = 'sparse'; path = 'checkout-sparse-3'; startedUnixMs = $start; finishedUnixMs = $end; elapsedBracketMs = $end - $start }
          Add-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-timings.jsonl') -Value ($receipt | ConvertTo-Json -Compress) -Encoding utf8
      - name: Verify actual checkout content and modes
        shell: pwsh
        run: |
          function Write-GitBytes([string]$CheckoutRoot, [string[]]$GitArguments, [string]$Destination) {
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = (Get-Command git.exe -ErrorAction Stop).Source
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in @('-C', $CheckoutRoot, '-c', 'core.quotepath=false') + $GitArguments) { $startInfo.ArgumentList.Add($argument) }
            $child = [Diagnostics.Process]::new()
            $child.StartInfo = $startInfo
            $output = [IO.File]::Create($Destination)
            try {
              if (-not $child.Start()) { throw 'Git census did not start' }
              $stderr = $child.StandardError.ReadToEndAsync()
              $copy = $child.StandardOutput.BaseStream.CopyToAsync($output)
              $child.WaitForExit()
              $copy.GetAwaiter().GetResult()
              $detail = $stderr.GetAwaiter().GetResult()
              if ($child.ExitCode -ne 0) { throw "Git census failed: $detail" }
            } finally { $output.Dispose(); $child.Dispose() }
          }
          $inventories = @()
          foreach ($pair in 1..3) {
            foreach ($arm in @('full', 'sparse')) {
              $relative = "checkout-$arm-$pair"
              $location = Join-Path $env:GITHUB_WORKSPACE $relative
              $sourceSha = (& git -C $location rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0) { throw 'Could not read pinned source SHA' }
              $indexFile = "ssh-checkout-index-$arm-$pair.bin"
              $materializedFile = "ssh-checkout-materialized-$arm-$pair.bin"
              Write-GitBytes -CheckoutRoot $location -GitArguments @('ls-files', '-s', '-z') -Destination (Join-Path $env:RUNNER_TEMP $indexFile)
              Write-GitBytes -CheckoutRoot $location -GitArguments @('ls-files', '-v', '-z') -Destination (Join-Path $env:RUNNER_TEMP $materializedFile)
              $inventories += @{ pair = $pair; arm = $arm; path = $relative; sha = $sourceSha; indexFile = $indexFile; materializedFile = $materializedFile }
            }
          }
          $inventories | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'ssh-checkout-inventories.json') -Encoding utf8
          & node (Join-Path $env:RUNNER_TEMP 'ssh-checkout-proof.cjs')
          if ($LASTEXITCODE -ne 0) { throw 'Actual checkout qualification failed' }
      - name: Upload checkout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-checkout-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/ssh-checkout-*.json
            ${{ runner.temp }}/ssh-checkout-*.jsonl
            ${{ runner.temp }}/ssh-checkout-*.bin
            ${{ runner.temp }}/ssh-checkout-inputs.b64
          if-no-files-found: error
