name: Manual terminal interactive-wait clock qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed29ad source; temporary definition must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-terminal-interactive-wait-clock
  cancel-in-progress: false
jobs:
  qualify:
    name: Policy clock ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
      WAIT_RUNTIME: ${{ matrix.runtime }}
      WAIT_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize unchanged stock controller and source-bound proposal
        run: node .benchmark-definition/.github/benchmark/terminal-wait-probe-clocks/materialize.mjs
      - name: Preserve original attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before "$WAIT_RUNTIME" notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping-launch-plan.json "terminal-wait-probe-clock-ci-29ad/runs/$WAIT_RUNTIME-$WAIT_SEED/before" "$WAIT_SEED"
      - name: Require source and process boundaries before shipping patch
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad')
          prefix = directory / 'runs' / (os.environ['WAIT_RUNTIME'] + '-' + os.environ['WAIT_SEED']) / 'before'
          proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
          assert proof['normalClose'] and proof['result'] in [0, 1] and proof['sourceUnchanged']
          assert proof['before'] == proof['after'] and not proof['samplingErrors']
          assert not proof['externalObserved'] and not proof['postCloseCoordinators']
          plan = json.loads((directory / 'shipping-launch-plan.json').read_text())
          for target, versions in plan['patchTargets'].items():
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest() == versions['beforeSha256']
          PY
          git apply --check notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping.patch
          git apply notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping.patch
      - name: Preserve shipping attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WAIT_RUNTIME" notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping-launch-plan.json "terminal-wait-probe-clock-ci-29ad/runs/$WAIT_RUNTIME-$WAIT_SEED/shipping" "$WAIT_SEED"
      - name: Require shipping boundaries and apply audit from exact original
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          directory = Path('notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad')
          prefix = directory / 'runs' / (os.environ['WAIT_RUNTIME'] + '-' + os.environ['WAIT_SEED']) / 'shipping'
          proof = json.loads(Path(str(prefix) + '-source-proof.json').read_text())
          assert proof['normalClose'] and proof['result'] in [0, 1] and proof['sourceUnchanged']
          assert proof['before'] == proof['after'] and not proof['samplingErrors']
          assert not proof['externalObserved'] and not proof['postCloseCoordinators']
          plan = json.loads((directory / 'shipping-launch-plan.json').read_text())
          for target, versions in plan['patchTargets'].items():
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest() == versions['afterSha256']
          PY
          git apply --reverse --check notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping.patch
          git apply --reverse notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/shipping.patch
          git diff --exit-code HEAD
          git apply --check notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/audit.patch
          git apply notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/audit.patch
      - name: Preserve inline-audit attempt without retry
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WAIT_RUNTIME" notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/audit-launch-plan.json "terminal-wait-probe-clock-ci-29ad/runs/$WAIT_RUNTIME-$WAIT_SEED/audit" "$WAIT_SEED"
      - name: Preserve every raw attempt and runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-wait-probe-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/terminal-wait-probe-clock-ci-29ad/
  evidence:
    name: Independently verify twelve original, shipping and audit attempts
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: terminal-wait-probe-*
          path: wait-artifacts
      - name: Verify exact original cases, routes and provenance
        env:
          WAIT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/terminal-wait-probe-clocks/collect-results.py wait-artifacts .github/benchmark/terminal-wait-probe-clocks/payload terminal-wait-probe-result.json
      - name: Preserve evidence even when qualification rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-wait-probe-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: terminal-wait-probe-result.json
