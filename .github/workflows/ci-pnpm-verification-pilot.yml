name: pnpm verification cache pilot

on:
  pull_request:
    paths: ['.github/workflows/ci-pnpm-verification-pilot.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Comparison to run
        type: choice
        required: true
        default: verification-cache
        options: [verification-cache, codex-close]

permissions:
  contents: read

concurrency:
  group: pnpm-verification-pilot-${{ inputs.mode == 'codex-close' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ inputs.mode != 'codex-close' }}

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  seed:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
      # PR caches are scoped to the PR merge ref; main never restores them.
      - uses: actions/cache/save@v5
        if: steps.deps.outputs.verification-cache-hit != 'true'
        with:
          path: ${{ steps.deps.outputs.verification-cache-path }}
          key: ${{ steps.deps.outputs.verification-cache-key }}

  measure:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    needs: seed
    name: measure ${{ matrix.runner }} sample ${{ matrix.sample }} cache ${{ matrix.cache }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        sample: [1, 2, 3]
        cache: ['false', 'true']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          cache-pnpm-verification: ${{ matrix.cache }}
      - name: Validate treatment and frozen install
        env:
          CACHE_ENABLED: ${{ matrix.cache }}
          CACHE_HIT: ${{ steps.deps.outputs.verification-cache-hit }}
        run: |
          if [ "$CACHE_ENABLED" = true ]; then test "$CACHE_HIT" = true; fi
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          node -e "require.resolve('vitest'); require.resolve('electron')"

  codex-close:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'codex-close'
    name: Codex close clocks on ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: dependencies
        with:
          native-runtime: node
      - name: Capture the installed host and unchanged tracked source
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          {
            echo "PILOT_HOST_NODE_VERSION=$(node --version)"
            echo "PILOT_PNPM_VERSION=$(pnpm --version)"
            echo "PILOT_CPU=$(getconf _NPROCESSORS_ONLN)"
            echo "PILOT_KERNEL=$(uname -srmo)"
          } >> "$GITHUB_ENV"
      - name: Compare all 32 original cases in AB and BA order
        shell: bash
        run: pnpm exec node config/scripts/ci-codex-close-pilot.mjs
      - name: Keep tracked source unchanged after the comparison
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
      - name: Upload every comparison result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-close-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-codex-close-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          if-no-files-found: error
          retention-days: 7
