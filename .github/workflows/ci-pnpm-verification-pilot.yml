name: pnpm verification cache pilot

on:
  pull_request:
    paths: ['.github/workflows/ci-pnpm-verification-pilot.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Comparison to run
        type: choice
        required: true
        default: verification-cache
        options: [verification-cache, coordinator-observation]

permissions:
  contents: read

concurrency:
  group: pnpm-verification-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  seed:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
      # PR caches are scoped to the PR merge ref; main never restores them.
      - uses: actions/cache/save@v5
        if: steps.deps.outputs.verification-cache-hit != 'true'
        with:
          path: ${{ steps.deps.outputs.verification-cache-path }}
          key: ${{ steps.deps.outputs.verification-cache-key }}

  measure:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    needs: seed
    name: measure ${{ matrix.runner }} sample ${{ matrix.sample }} cache ${{ matrix.cache }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        sample: [1, 2, 3]
        cache: ['false', 'true']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          cache-pnpm-verification: ${{ matrix.cache }}
      - name: Validate treatment and frozen install
        env:
          CACHE_ENABLED: ${{ matrix.cache }}
          CACHE_HIT: ${{ steps.deps.outputs.verification-cache-hit }}
        run: |
          if [ "$CACHE_ENABLED" = true ]; then test "$CACHE_HIT" = true; fi
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          node -e "require.resolve('vitest'); require.resolve('electron')"

  coordinator-observation:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'coordinator-observation'
    name: Coordinator observations on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
      - name: Compare the same 23 cases in both orders
        run: pnpm exec node config/scripts/ci-coordinator-observation-pilot.mjs
      - name: Upload every comparison result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coordinator-observation-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-coordinator-observation
          if-no-files-found: error
