name: Manual native filesystem watcher Node qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source7f43; definition-only branch must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-native-filesystem-watcher-node
  cancel-in-progress: false
jobs:
  qualify:
    name: Native filesystem contract ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      WATCHER_SOURCE_SHA: ${{ inputs.source_sha }}
      WATCHER_RUNTIME: ${{ matrix.runtime }}
      WATCHER_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize unchanged controller and source-bound proposal
        id: materialize
        run: node .benchmark-definition/.github/benchmark/native-filesystem-watcher/materialize.mjs
      - name: Apply reviewed one-line native runtime registry patch
        run: |
          git apply --check notes/bun-migration/performance/watcher-native-node-ci-7f43/candidate.patch
          git apply notes/bun-migration/performance/watcher-native-node-ci-7f43/candidate.patch
      - name: Qualify all original cases under the intended runtime
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$WATCHER_RUNTIME" notes/bun-migration/performance/watcher-native-node-ci-7f43/launch-plan.json watcher-native-node-ci-7f43/after "$WATCHER_SEED"
      - name: Preserve every attempt and its runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watcher-native-node-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/watcher-native-node-ci-7f43/
  evidence:
    name: Verify four raw AFTER attempts without promoting failures
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: watcher-native-node-*
          path: watcher-artifacts
      - name: Verify names, raw outcomes, configs and provenance
        env:
          WATCHER_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/native-filesystem-watcher/collect-results.py watcher-artifacts
      - name: Preserve evidence even when qualification rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watcher-native-node-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: watcher-native-node-result.json
