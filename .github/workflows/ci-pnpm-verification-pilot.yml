name: Mobile typecheck overlap qualification
on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Exact source SHA used by actual compiler stages
        required: true
        type: string
      mobile-mode:
        description: Run healthy pairs/failures, or a separate external cancellation control
        required: true
        default: qualify
        type: choice
        options:
          - qualify
          - cancel
permissions:
  contents: read
jobs:
  mobile_typecheck_pairs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
      SOURCE_REF: ${{ inputs.source-ref }}
      SCENARIO: healthy
    defaults:
      run:
        shell: bash
        working-directory: mobile
    if: inputs.mobile-mode == 'qualify'
    steps:
      - name: Checkout pilot qualification files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-mobile-pilot-source
          persist-credentials: false
          sparse-checkout: config/ci-pressure-pilot/mobile-typecheck
      - name: Stage isolated qualification tools
        working-directory: .
        run: |-
          mkdir -p "$RUNNER_TEMP/ci-mobile-typecheck-pilot"
          cp .ci-mobile-pilot-source/config/ci-pressure-pilot/mobile-typecheck/* "$RUNNER_TEMP/ci-mobile-typecheck-pilot/"
          printf "ORCA_TYPECHECK_PILOT_HOME=%s\n" "$RUNNER_TEMP/ci-mobile-typecheck-pilot" >> "$GITHUB_ENV"
      - name: Checkout pinned source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable compiler configs and prepare control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" init
      - name: Observe typecheck memory
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/monitor.mjs"
        id: typecheck_memory
        background: true
        continue-on-error: true
      - name: Start complete stage pair-1-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-1-serial
      - name: Production types pair-1-serial
        id: production_pair_1_serial
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-1-serial
        run: node node_modules/typescript/bin/tsc --noEmit
      - wait: production_pair_1_serial
      - name: Test typecheck ratchet pair-1-serial
        id: ratchet_pair_1_serial
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-1-serial
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - name: Test would start pair-1-serial
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-1-serial/Test-started.txt"
      - name: Seal native gate pair-1-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-1-serial
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_1_serial.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_1_serial.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Start complete stage pair-1-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-1-overlap
      - name: Production types pair-1-overlap
        id: production_pair_1_overlap
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-1-overlap
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test typecheck ratchet pair-1-overlap
        id: ratchet_pair_1_overlap
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-1-overlap
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - wait: production_pair_1_overlap
      - name: Test would start pair-1-overlap
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-1-overlap/Test-started.txt"
      - name: Seal native gate pair-1-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-1-overlap
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_1_overlap.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_1_overlap.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Start complete stage pair-2-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-2-overlap
      - name: Production types pair-2-overlap
        id: production_pair_2_overlap
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-2-overlap
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test typecheck ratchet pair-2-overlap
        id: ratchet_pair_2_overlap
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-2-overlap
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - wait: production_pair_2_overlap
      - name: Test would start pair-2-overlap
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-2-overlap/Test-started.txt"
      - name: Seal native gate pair-2-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-2-overlap
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_2_overlap.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_2_overlap.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Start complete stage pair-2-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-2-serial
      - name: Production types pair-2-serial
        id: production_pair_2_serial
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-2-serial
        run: node node_modules/typescript/bin/tsc --noEmit
      - wait: production_pair_2_serial
      - name: Test typecheck ratchet pair-2-serial
        id: ratchet_pair_2_serial
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-2-serial
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - name: Test would start pair-2-serial
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-2-serial/Test-started.txt"
      - name: Seal native gate pair-2-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-2-serial
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_2_serial.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_2_serial.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Start complete stage pair-3-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-3-serial
      - name: Production types pair-3-serial
        id: production_pair_3_serial
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-3-serial
        run: node node_modules/typescript/bin/tsc --noEmit
      - wait: production_pair_3_serial
      - name: Test typecheck ratchet pair-3-serial
        id: ratchet_pair_3_serial
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-3-serial
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - name: Test would start pair-3-serial
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-3-serial/Test-started.txt"
      - name: Seal native gate pair-3-serial
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-3-serial
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_3_serial.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_3_serial.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Start complete stage pair-3-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start pair-3-overlap
      - name: Production types pair-3-overlap
        id: production_pair_3_overlap
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-3-overlap
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test typecheck ratchet pair-3-overlap
        id: ratchet_pair_3_overlap
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/pair-3-overlap
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - wait: production_pair_3_overlap
      - name: Test would start pair-3-overlap
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/pair-3-overlap/Test-started.txt"
      - name: Seal native gate pair-3-overlap
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal pair-3-overlap
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_pair_3_overlap.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_pair_3_overlap.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Finish bounded observation and validate receipts
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" finish
        if: always()
      - wait: typecheck_memory
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-typecheck-pairs
          path: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/
          if-no-files-found: error
  mobile_typecheck_faults:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
      SOURCE_REF: ${{ inputs.source-ref }}
      SCENARIO: ${{ matrix.scenario }}
    defaults:
      run:
        shell: bash
        working-directory: mobile
    if: inputs.mobile-mode == 'qualify'
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario:
          - production
          - ratchet
    steps:
      - name: Checkout pilot qualification files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-mobile-pilot-source
          persist-credentials: false
          sparse-checkout: config/ci-pressure-pilot/mobile-typecheck
      - name: Stage isolated qualification tools
        working-directory: .
        run: |-
          mkdir -p "$RUNNER_TEMP/ci-mobile-typecheck-pilot"
          cp .ci-mobile-pilot-source/config/ci-pressure-pilot/mobile-typecheck/* "$RUNNER_TEMP/ci-mobile-typecheck-pilot/"
          printf "ORCA_TYPECHECK_PILOT_HOME=%s\n" "$RUNNER_TEMP/ci-mobile-typecheck-pilot" >> "$GITHUB_ENV"
      - name: Checkout pinned source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable compiler configs and prepare control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" init
      - name: Observe typecheck memory
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/monitor.mjs"
        id: typecheck_memory
        background: true
        continue-on-error: true
      - name: Start complete stage control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start control
      - name: Production types control
        id: production_control
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/control
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test typecheck ratchet control
        id: ratchet_control
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/control
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - wait: production_control
      - name: Test would start control
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/control/Test-started.txt"
      - name: Seal native gate control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal control
        if: always()
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_control.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_control.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Finish bounded observation and validate receipts
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" finish
        if: always()
      - wait: typecheck_memory
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-typecheck-fault-${{ matrix.scenario }}
          path: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/
          if-no-files-found: error
  mobile_typecheck_cancel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      ORCA_BACKGROUND_LAUNCH: "1"
      SOURCE_REF: ${{ inputs.source-ref }}
      SCENARIO: cancel
    defaults:
      run:
        shell: bash
        working-directory: mobile
    if: inputs.mobile-mode == 'cancel'
    steps:
      - name: Checkout pilot qualification files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .ci-mobile-pilot-source
          persist-credentials: false
          sparse-checkout: config/ci-pressure-pilot/mobile-typecheck
      - name: Stage isolated qualification tools
        working-directory: .
        run: |-
          mkdir -p "$RUNNER_TEMP/ci-mobile-typecheck-pilot"
          cp .ci-mobile-pilot-source/config/ci-pressure-pilot/mobile-typecheck/* "$RUNNER_TEMP/ci-mobile-typecheck-pilot/"
          printf "ORCA_TYPECHECK_PILOT_HOME=%s\n" "$RUNNER_TEMP/ci-mobile-typecheck-pilot" >> "$GITHUB_ENV"
      - name: Checkout pinned source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify immutable compiler configs and prepare control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" init
      - name: Observe typecheck memory
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/monitor.mjs"
        id: typecheck_memory
        background: true
        continue-on-error: true
      - name: Start complete stage control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" start control
      - name: Production types control
        id: production_control
        background: true
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/control
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Test typecheck ratchet control
        id: ratchet_control
        env:
          NODE_OPTIONS: --require="${{ env.ORCA_TYPECHECK_PILOT_HOME }}/guard.cjs"
          ORCA_TYPECHECK_GUARD_RECEIPTS: ${{ env.ORCA_TYPECHECK_PILOT_HOME }}/reports/control
        run: node scripts/check-tests-typecheck-ratchet.mjs
      - wait: production_control
      - name: Test would start control
        run: printf "Both required typechecks passed\n" > "$ORCA_TYPECHECK_PILOT_HOME/reports/control/Test-started.txt"
      - name: Seal native gate control
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" seal control
        if: always()
        env:
          PRODUCTION_OUTCOME: ${{ steps.production_control.outcome }}
          RATCHET_OUTCOME: ${{ steps.ratchet_control.outcome }}
          CANCELLED: ${{ job.status == 'cancelled' }}
      - name: Finish bounded observation and validate receipts
        working-directory: .
        run: node "$ORCA_TYPECHECK_PILOT_HOME/proof.mjs" finish
        if: always()
