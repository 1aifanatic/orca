        id: typecheck-node
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.typecheck == 'true')
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Cache TypeScript incremental state
        uses: actions/cache@v5
        with:
          path: config/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-
        if: needs.code_paths.outputs.typecheck == 'true'
      - name: Plan unit selection
        id: unit-plan
        background: true
        env:
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          node config/scripts/ci-unit-plan.mjs
        if: "!cancelled()"
      - run: pnpm run typecheck
        if: needs.code_paths.outputs.typecheck == 'true'
      - wait: unit-plan
      - uses: actions/upload-artifact@v7
        with:
          name: unit-selection-attempt-${{ github.run_attempt }}
          path: ci-shards/unit-selection.json
          retention-days: 14
        if: needs.code_paths.outputs.typecheck == 'true'
      - name: Require the selected compiler and joined plan to pass
        id: typecheck-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
    permissions:
      contents: read
    timeout-minutes: 360
    outputs:
      static_result: ${{ steps.static-complete.outputs.result || 'blocked' }}
      typecheck_result: ${{ steps.typecheck-complete.outputs.result || 'blocked' }}
      shards: ${{ steps.unit-plan.outputs.shards }}
