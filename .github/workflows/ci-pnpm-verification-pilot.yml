name: Sequential heavy preflight comparison
run-name: Heavy comparison ${{ inputs.sample }} ${{ inputs.arm }} | fixed cc73 source
on:
  workflow_dispatch:
    inputs:
      arm:
        description: Frozen paired arm
        required: true
        type: choice
        options:
          - original
          - combined
        default: original
      sample:
        description: Frozen schedule position (1 original, 2 combined, 3 combined, 4 original)
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "1"
concurrency:
  group: sequential-heavy-comparison-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: "1"
  ORCA_SHARD_SOURCE_SHA: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
jobs:
  code_paths:
    name: detect changes and check repository guards
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reused_run_id: ${{ steps.readiness.outputs.run_id }}
      mobile_dependencies: ${{ steps.filter.outputs.mobile_dependencies }}
      mobile_web_app: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.mobile_web_app }}
      static_analysis: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.static_analysis }}
      typecheck: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.typecheck }}
      git_compatibility: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.git_compatibility }}
      codex_index_heal_contract: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.codex_index_heal_contract }}
      xterm_patch_sync: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.xterm_patch_sync }}
      shell_contracts: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.shell_contracts }}
      test: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.test }}
      orcad_browser: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.orcad_browser }}
      cross-version-wire: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.cross-version-wire }}
      managed_hook_node18: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.managed_hook_node18 }}
      package: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.package }}
      package_windows: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.package_windows }}
      e2e_should_run: ${{ steps.e2e_filter.outputs.should_run }}
      test_files: ${{ steps.e2e_filter.outputs.test_files }}
      e2e_run_changed: ${{ steps.e2e_filter.outputs.e2e_run_changed }}
      e2e_needs_build: ${{ steps.e2e_filter.outputs.e2e_needs_build }}
      ssh_source_changed: ${{ steps.e2e_filter.outputs.ssh_source_changed }}
      native_ime_source_changed: ${{ steps.e2e_filter.outputs.native_ime_source_changed }}
      wsl_source_changed: ${{ steps.e2e_filter.outputs.wsl_source_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            /config/scripts/git-pull-request-diff-base.mjs
            /package.json
            /README.md
            /docs/readme/
            /.github/scripts/check-root-directory-entries.mjs
            /config/scripts/check-readme-local-links.mjs
            /config/scripts/pr-code-change-scope.mjs
            /config/scripts/pr-e2e-source-routing.mjs
            /config/scripts/ci-e2e-job-selection.mjs
            /config/scripts/pr-ready-check-reuse.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - name: Reject new root-level files and folders
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          node .github/scripts/check-root-directory-entries.mjs "$DIFF_BASE" HEAD
      - name: Check README local links
        run: node config/scripts/check-readme-local-links.mjs
      - name: Find identical successful required checks
        id: readiness
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CHECK_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node config/scripts/pr-ready-check-reuse.mjs
      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          set -euo pipefail
          # Why HEAD^1 and not --merge-base: HEAD is the pull request merge commit, so its first
          # parent is the base side already. Computing a merge base instead would require the
          # payload base SHA to be in the graph, which is what forced a full-history checkout.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          # Why --no-renames: name-only rename detection can report only the destination.
          # A code file moved under docs/ must still expose its code-side deletion.
          CHANGED="$(git diff --name-only --no-renames --diff-filter=ACDMR "$DIFF_BASE" HEAD)"
          echo "Changed paths:"
          printf '%s\n' "$CHANGED"
          printf '%s\n' "$CHANGED" | node config/scripts/pr-code-change-scope.mjs | tee -a "$GITHUB_OUTPUT"
      - name: Filter changed E2E specs
        id: e2e_filter
        if: github.event.pull_request.draft != true && steps.filter.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          BASE="b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE")"
          CHANGED="$(git diff --name-only --diff-filter=AMCR "$DIFF_BASE" HEAD)"
          # Source routes are executable contracts so a test can prove exact
          # authorities, exclusions, and sentinels without evaluating workflow shell.
          TEST_FILES_JSON="$(printf '%s\n' "$CHANGED" | node config/scripts/pr-e2e-source-routing.mjs)"
          echo "test_files=$TEST_FILES_JSON" >> "$GITHUB_OUTPUT"
          # Why a separate signal: the Docker-SSH lane must trigger on SSH source, not on a
          # spec name surviving in a route's list. Same routes, so the two cannot drift.
          SSH_SOURCE_CHANGED="$(printf '%s\n' "$CHANGED" | node config/scripts/pr-e2e-source-routing.mjs --ssh-source)"
          echo "ssh_source_changed=$SSH_SOURCE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "SSH source changed: $SSH_SOURCE_CHANGED"
          printf '%s\n' "$TEST_FILES_JSON" | E2E_SSH_SOURCE_CHANGED="$SSH_SOURCE_CHANGED" node config/scripts/ci-e2e-job-selection.mjs --job-outputs >> "$GITHUB_OUTPUT"
          # Why its own signal: the real-IME lane is a whole ibus session, not a spec, so it must
          # trigger on IME source rather than on a spec name in some route's list.
          NATIVE_IME_SOURCE_CHANGED="$(printf '%s\n' "$CHANGED" | node config/scripts/pr-e2e-source-routing.mjs --native-ime-source)"
          echo "native_ime_source_changed=$NATIVE_IME_SOURCE_CHANGED" >> "$GITHUB_OUTPUT"
          WSL_CHANGED="$(git diff --name-only --no-renames --diff-filter=ACDMR "$DIFF_BASE" HEAD)"
          WSL_SOURCE_CHANGED="$(printf '%s\n' "$WSL_CHANGED" | node config/scripts/pr-e2e-source-routing.mjs --wsl-source)"
          echo "wsl_source_changed=$WSL_SOURCE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "Native IME source changed: $NATIVE_IME_SOURCE_CHANGED"
          SHOULD_RUN="$(printf '%s\n' "$CHANGED" | node config/scripts/pr-e2e-source-routing.mjs --reusable-workflow)"
          if [ "$SHOULD_RUN" = true ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Changed E2E specs: $TEST_FILES_JSON"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No specs requiring the reusable E2E workflow"
          fi
      - name: Require the fixed heavy-check cohort and counterbalanced sample
        env:
          ARM: ${{ inputs.arm }}
          SAMPLE: ${{ inputs.sample }}
          STATIC_SELECTED: ${{ steps.filter.outputs.static_analysis }}
          TYPE_SELECTED: ${{ steps.filter.outputs.typecheck }}
          UNIT_SELECTED: ${{ steps.filter.outputs.test }}
          PACKAGE_SELECTED: ${{ steps.filter.outputs.package }}
          WINDOWS_PACKAGE_SELECTED: ${{ steps.filter.outputs.package_windows }}
        run: |-
          case "$SAMPLE:$ARM" in
            1:original|2:combined|3:combined|4:original) ;;
            *) echo "::error::Use the frozen original/combined/combined/original schedule"; exit 2 ;;
          esac
          test "$STATIC_SELECTED" = true
          test "$TYPE_SELECTED" = true
          test "$UNIT_SELECTED" = true
          test "$PACKAGE_SELECTED" = true
          test "$WINDOWS_PACKAGE_SELECTED" = true
  static_analysis:
    name: static analysis
    needs:
      - code_paths
    if: inputs.arm == 'original' && (needs.code_paths.outputs.static_analysis == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - uses: ./.github/actions/install-node-dependencies
        if: needs.code_paths.outputs.mobile_dependencies != 'true'
        with:
          native-runtime: node
          node-version: "24"
      - uses: ./.github/actions/install-node-dependencies
        if: needs.code_paths.outputs.mobile_dependencies == 'true'
        with:
          native-runtime: node
          node-version: "24"
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - name: Lint
        id: root-lint
        background: true
        run: pnpm exec oxlint --format github
      - name: Reject low-evidence patterns
        run: pnpm run audit:anti-slop
      - wait: root-lint
      - name: Enforce focused code-quality plugins
        id: native-code-quality
        background: true
        run: pnpm run audit:code-quality:native
      - name: Enforce type-aware code-quality baseline
        run: pnpm run audit:code-quality:type-aware
      - wait: native-code-quality
      - uses: ./.github/actions/install-mobile-dependencies
        if: needs.code_paths.outputs.mobile_dependencies == 'true'
      - name: Enforce changed-code quality
        id: changed-code-quality
        background: true
        run: pnpm run check:code-quality:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
      - name: Enforce React Doctor on changed lines
        run: pnpm run check:react-doctor:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
      - wait: changed-code-quality
      - name: Check Zustand selector fan-out budget
        run: pnpm run check:zustand-selector-fanout
      - name: Check reliability gate manifest
        run: pnpm run check:reliability-gates
      - name: Enforce dead design-system classes
        run: pnpm run check:dead-classes
      - name: Check VM runtime rollback compatibility
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --quiet "$DIFF_BASE" HEAD -- \
            src/shared/ephemeral-vm-runtime-store.ts \
            src/shared/ephemeral-vm-runtime-feature-store.ts \
            src/shared/ephemeral-vm-runtime-rollback-projection.ts \
            src/shared/ephemeral-vm-runtimes.ts \
            src/shared/ephemeral-vm-recipes.ts \
            src/shared/orca-yaml-hook-types.ts \
            src/main/ephemeral-vm-runtime-service.ts \
            src/main/ephemeral-vm-runtime-provisioning-persistence.ts \
            src/main/ephemeral-vm-failed-start-cleanup.ts; then
            echo "VM runtime persistence is unchanged."
            exit 0
          fi
          node config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs \
            config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts
      - name: Enforce max-lines ratchet
        run: pnpm run check:max-lines-ratchet
      - name: Enforce ts-nocheck ratchet
        run: pnpm run check:ts-nocheck-ratchet
      - name: Enforce runtime Electron-import ratchet
        run: pnpm run check:runtime-electron-ratchet
      - name: Check Node runtime pin
        run: pnpm run check:node-runtime-pin
      - name: Verify localization extraction
        id: localization-extraction
        background: true
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          # Detection failures run the full check; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/localization-changes" &&
            scope="$(node config/scripts/localization-extraction-change-scope.mjs "$RUNNER_TEMP/localization-changes")" && [ "$scope" = false ]; then
            echo "Localization extraction inputs are unchanged."
          else
            pnpm run verify:localization-extraction
          fi
      - name: Boot orcad and round-trip a terminal
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_BACKGROUND_LAUNCH: "1"
        run: |
          # Detection failures run the smoke; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/orcad-smoke-changes" &&
            scope="$(node config/scripts/orcad-terminal-smoke-change-scope.mjs "$RUNNER_TEMP/orcad-smoke-changes")" && [ "$scope" = false ]; then
            echo "Orcad terminal smoke inputs are unchanged."
          else
            pnpm run smoke:orcad-terminal
          fi
      - name: Verify the generated RPC params catalog
        run: pnpm run verify:rpc-params-catalog
      - name: Verify bundled skill guides
        run: pnpm run verify:bundled-skill-guides
      - name: Verify skill freshness manifest
        run: pnpm run verify:skill-bundle-manifest
      - name: Verify localization catalogs
        id: localization-catalogs
        background: true
        run: pnpm run verify:localization-catalogs
      - name: Verify localization coverage
        run: pnpm run verify:localization-coverage
      - wait:
          - localization-catalogs
          - localization-extraction
      - name: Guard against project-owned .d.ts in preload/shared
        run: |
          matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under src/preload or src/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts."
            echo "Found:"
            echo "$matches"
            exit 1
          fi
      - name: Check feature wall asset budget
        run: pnpm check:feature-wall-assets
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements
  typecheck:
    needs:
      - code_paths
    if: inputs.arm == 'original' && (needs.code_paths.outputs.typecheck == 'true')
    runs-on: ubuntu-24.04-arm
    outputs:
      shards: ${{ steps.unit-plan.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - uses: ./.github/actions/install-node-dependencies
      - name: Cache TypeScript incremental state
        uses: actions/cache@v5
        with:
          path: config/*.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'config/tsconfig*.json') }}-
      - name: Plan unit selection
        id: unit-plan
        background: true
        env:
          ORCA_UNIT_SELECTION_MODE: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}
        run: node config/scripts/ci-unit-plan.mjs
      - run: pnpm run typecheck
      - wait: unit-plan
      - uses: actions/upload-artifact@v7
        with:
          name: unit-selection-attempt-${{ github.run_attempt }}
          path: ci-shards/unit-selection.json
          retention-days: 14
  shared_checks:
    name: static analysis and typecheck
    needs:
      - code_paths
    if: inputs.arm == 'combined' && ((needs.code_paths.outputs.static_analysis == 'true') || (needs.code_paths.outputs.typecheck == 'true'))
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 50
          persist-credentials: false
          ref: cc73c8e1a72b0e9ee9c29e57458ce307f5f019c2
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies != 'true')
        with:
          native-runtime: node
          node-version: "24"
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
        with:
          native-runtime: node
          node-version: "24"
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-node-dependencies
        if: (needs.code_paths.outputs.typecheck == 'true') && !(needs.code_paths.outputs.static_analysis == 'true')
      - name: Lint
        id: root-lint
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm exec oxlint --format github
        if: "!cancelled()"
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Reject low-evidence patterns
        run: pnpm run audit:anti-slop
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: root-lint
      - name: Enforce focused code-quality plugins
        id: native-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run audit:code-quality:native
        if: "!cancelled()"
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce type-aware code-quality baseline
        run: pnpm run audit:code-quality:type-aware
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: native-code-quality
      - uses: ./.github/actions/install-mobile-dependencies
        if: (needs.code_paths.outputs.static_analysis == 'true') && (needs.code_paths.outputs.mobile_dependencies == 'true')
      - name: Enforce changed-code quality
        id: changed-code-quality
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run check:code-quality:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: "!cancelled()"
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Enforce React Doctor on changed lines
        run: pnpm run check:react-doctor:changed -- "b94c75c4bd6b1e7454e614b489c0ffd591970ec0"
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait: changed-code-quality
      - name: Check Zustand selector fan-out budget
        run: pnpm run check:zustand-selector-fanout
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check reliability gate manifest
        run: pnpm run check:reliability-gates
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce dead design-system classes
        run: pnpm run check:dead-classes
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check VM runtime rollback compatibility
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --quiet "$DIFF_BASE" HEAD -- \
            src/shared/ephemeral-vm-runtime-store.ts \
            src/shared/ephemeral-vm-runtime-feature-store.ts \
            src/shared/ephemeral-vm-runtime-rollback-projection.ts \
            src/shared/ephemeral-vm-runtimes.ts \
            src/shared/ephemeral-vm-recipes.ts \
            src/shared/orca-yaml-hook-types.ts \
            src/main/ephemeral-vm-runtime-service.ts \
            src/main/ephemeral-vm-runtime-provisioning-persistence.ts \
            src/main/ephemeral-vm-failed-start-cleanup.ts; then
            echo "VM runtime persistence is unchanged."
            exit 0
          fi
          node config/scripts/run-ephemeral-vm-runtime-store-rollback-repro.mjs \
            config/scripts/ephemeral-vm-runtime-store-cross-version.test.ts
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce max-lines ratchet
        run: pnpm run check:max-lines-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce ts-nocheck ratchet
        run: pnpm run check:ts-nocheck-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Enforce runtime Electron-import ratchet
        run: pnpm run check:runtime-electron-ratchet
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check Node runtime pin
        run: pnpm run check:node-runtime-pin
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization extraction
        id: localization-extraction
        background: true
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          # Detection failures run the full check; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/localization-changes" &&
            scope="$(node config/scripts/localization-extraction-change-scope.mjs "$RUNNER_TEMP/localization-changes")" && [ "$scope" = false ]; then
            echo "Localization extraction inputs are unchanged."
          else
            pnpm run verify:localization-extraction
          fi
        if: "!cancelled()"
      - name: Boot orcad and round-trip a terminal
        env:
          BASE_SHA: b94c75c4bd6b1e7454e614b489c0ffd591970ec0
          ORCA_BACKGROUND_LAUNCH: "1"
        run: |
          # Detection failures run the smoke; renames retain the removed input path.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          if git diff --name-only --no-renames -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/orcad-smoke-changes" &&
            scope="$(node config/scripts/orcad-terminal-smoke-change-scope.mjs "$RUNNER_TEMP/orcad-smoke-changes")" && [ "$scope" = false ]; then
            echo "Orcad terminal smoke inputs are unchanged."
          else
            pnpm run smoke:orcad-terminal
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify the generated RPC params catalog
        run: pnpm run verify:rpc-params-catalog
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify bundled skill guides
        run: pnpm run verify:bundled-skill-guides
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify skill freshness manifest
        run: pnpm run verify:skill-bundle-manifest
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify localization catalogs
        id: localization-catalogs
        background: true
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" != true ] || [ "$ORCA_PREFLIGHT_PRIOR_SUCCESS" != true ]; then
            echo "Logical preflight phase is unselected or blocked; no work started."
            exit 0
          fi
          pnpm run verify:localization-catalogs
        if: "!cancelled()"
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          ORCA_PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
      - name: Verify localization coverage
        run: pnpm run verify:localization-coverage
        if: needs.code_paths.outputs.static_analysis == 'true'
      - wait:
          - localization-catalogs
          - localization-extraction
      - name: Guard against project-owned .d.ts in preload/shared
        run: |
          matches=$(find src/preload src/shared -name '*.d.ts' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Project-owned .d.ts files are not allowed under src/preload or src/shared."
            echo "Move type declarations into a .ts file so skipLibCheck does not hide errors."
            echo "See .github/CONTRIBUTING.md#type-declarations-prefer-ts-over-dts."
            echo "Found:"
            echo "$matches"
            exit 1
          fi
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Check feature wall asset budget
        run: pnpm check:feature-wall-assets
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Verify macOS entitlements
        run: pnpm verify:macos-entitlements
        if: needs.code_paths.outputs.static_analysis == 'true'
      - name: Require the selected static checks to pass
        id: static-complete
        env:
          ORCA_PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
        run: |-
          if [ "$ORCA_PREFLIGHT_PHASE_SELECTED" = true ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi
