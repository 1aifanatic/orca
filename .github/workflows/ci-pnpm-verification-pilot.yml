name: Manual verify runner readiness observation
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source; infrastructure diagnostic never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-verify-runner-readiness-observation
  cancel-in-progress: false
jobs:
  anchor:
    name: Readiness anchor
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Admit the reviewed source label
        env:
          READINESS_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$READINESS_SOURCE_SHA" = '0bd619df290c01cd66eae3a868e645e5b6391c90'

  pair_1_slim:
    name: Runner readiness pair 1 slim
    needs: [anchor]
    if: ${{ !cancelled() && needs.anchor.result == 'success' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CODE_PATHS: 'success'
          SHOULD_RUN: 'true'
          PREFLIGHT: 'success'
          PREFLIGHT_SHOULD_RUN: 'true'
          GIT_COMPATIBILITY: 'skipped'
          GIT_COMPATIBILITY_SHOULD_RUN: 'false'
          CODEX_INDEX_HEAL_CONTRACT: 'skipped'
          CODEX_INDEX_HEAL_CONTRACT_SHOULD_RUN: 'false'
          XTERM_PATCH_SYNC: 'skipped'
          XTERM_PATCH_SYNC_SHOULD_RUN: 'false'
          SHELL_CONTRACTS: 'skipped'
          SHELL_CONTRACTS_SHOULD_RUN: 'false'
          TEST: 'success'
          TEST_SHOULD_RUN: 'true'
          ORCAD_BROWSER: 'skipped'
          ORCAD_BROWSER_SHOULD_RUN: 'false'
          MOBILE_WEB_APP: 'skipped'
          MOBILE_WEB_APP_SHOULD_RUN: 'false'
          CROSS_VERSION_WIRE: 'skipped'
          CROSS_VERSION_WIRE_SHOULD_RUN: 'false'
          MANAGED_HOOK_NODE18: 'skipped'
          MANAGED_HOOK_NODE18_SHOULD_RUN: 'false'
          PACKAGE: 'success'
          PACKAGE_SHOULD_RUN: 'true'
          PACKAGE_WINDOWS: 'success'
          PACKAGE_WINDOWS_SHOULD_RUN: 'true'
        run: |
          if [ "$CODE_PATHS" != "success" ]; then
            exit 1
          fi
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Docs-only change; expensive PR checks skipped."
          fi
          failed=0
          check_job() {
            local name="$1" result="$2" should="$3"
            if [ "$should" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "$name: expected success, got $result"
                failed=1
              fi
            else
              if [ "$result" != "skipped" ]; then
                echo "$name: expected skipped, got $result"
                failed=1
              fi
            fi
          }
          # Require success when the PR has code-relevant changes
          check_job preflight "$PREFLIGHT" "$PREFLIGHT_SHOULD_RUN"
          check_job git_compatibility "$GIT_COMPATIBILITY" "$GIT_COMPATIBILITY_SHOULD_RUN"
          check_job codex_index_heal_contract "$CODEX_INDEX_HEAL_CONTRACT" "$CODEX_INDEX_HEAL_CONTRACT_SHOULD_RUN"
          check_job xterm_patch_sync "$XTERM_PATCH_SYNC" "$XTERM_PATCH_SYNC_SHOULD_RUN"
          check_job shell_contracts "$SHELL_CONTRACTS" "$SHELL_CONTRACTS_SHOULD_RUN"
          check_job test "$TEST" "$TEST_SHOULD_RUN"
          check_job orcad_browser "$ORCAD_BROWSER" "$ORCAD_BROWSER_SHOULD_RUN"
          check_job mobile_web_app "$MOBILE_WEB_APP" "$MOBILE_WEB_APP_SHOULD_RUN"
          check_job cross-version-wire "$CROSS_VERSION_WIRE" "$CROSS_VERSION_WIRE_SHOULD_RUN"
          check_job managed_hook_node18 "$MANAGED_HOOK_NODE18" "$MANAGED_HOOK_NODE18_SHOULD_RUN"
          check_job package "$PACKAGE" "$PACKAGE_SHOULD_RUN"
          check_job package_windows "$PACKAGE_WINDOWS" "$PACKAGE_WINDOWS_SHOULD_RUN"
          exit "$failed"

