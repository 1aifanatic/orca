name: Localization gate paired qualification
run-name: Localization gate paired qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: Localization gate paired node24 ARM4
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      LOCALIZATION_BUNDLE_SHA256: edd9fc1ecee65f19f3ff1e391f012fd93ccbcaa2136168fbb7e758e736a4c7d1
      LOCALIZATION_MANIFEST_SHA256: 184e135c229e0291f6b630b8b1e47485c3567c9c5aac4224d3d2d662e3da2733
    steps:
      - name: Checkout benchmark support
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Extract frozen inputs and record bootstrap outside checkout
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          bundle = pathlib.Path(os.environ['RUNNER_TEMP'], 'localization-pair-bundle')
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'localization-pair-results')
          bundle.mkdir(exist_ok=False)
          output.mkdir(exist_ok=False)
          archive = pathlib.Path('config/ci-capacity-benchmark/localization-paired-20261005.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          receipt = {'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'bootstrapSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'bootstrapTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'eventSha': os.environ['GITHUB_SHA'], 'workflowRef': os.environ['GITHUB_WORKFLOW_REF'],
                     'archiveSha256': digest, 'expectedArchiveSha256': os.environ['LOCALIZATION_BUNDLE_SHA256'],
                     'expectedManifestSha256': os.environ['LOCALIZATION_MANIFEST_SHA256']}
          (output / 'bootstrap.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert len(os.environ['LOCALIZATION_BUNDLE_SHA256']) == 64
          assert digest == os.environ['LOCALIZATION_BUNDLE_SHA256']
          with tarfile.open(archive, 'r:gz') as stream:
              members = stream.getmembers()
              assert len(members) <= 32
              assert len({member.name for member in members}) == len(members)
              assert sum(member.size for member in members) <= 32 * 1024 * 1024
              for member in members:
                  assert member.isfile() and pathlib.PurePosixPath(member.name).name == member.name
                  assert member.name not in ['', '.', '..']
                  payload = stream.extractfile(member).read()
                  assert len(payload) == member.size
                  (bundle / member.name).write_bytes(payload)
          manifest_bytes = (bundle / 'manifest.json').read_bytes()
          assert hashlib.sha256(manifest_bytes).hexdigest() == os.environ['LOCALIZATION_MANIFEST_SHA256']
          manifest = json.loads(manifest_bytes)
          assert set(manifest['bundleFiles']) == {path.name for path in bundle.iterdir()} - {'manifest.json'}
          for name, expected in manifest['bundleFiles'].items():
              assert pathlib.PurePosixPath(name).name == name
              assert hashlib.sha256((bundle / name).read_bytes()).hexdigest() == expected
          (output / 'manifest.json').write_bytes(manifest_bytes)
          evidence_bundle = output / 'portable-inputs'
          evidence_bundle.mkdir()
          for source in bundle.iterdir():
              (evidence_bundle / source.name).write_bytes(source.read_bytes())
          PY
      - name: Checkout fixed source
        uses: actions/checkout@v6
        with:
          ref: 761d63a4e52ff7915d4432c004df13182db63010
          persist-credentials: false
      - name: Record source and dependency setup start
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'localization-pair-results')
          source = {'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'sourceStatus': subprocess.check_output(['git', 'status', '--porcelain'], text=True),
                    'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT']}
          (output / 'checkout.json').write_text(json.dumps(source, indent=2) + '\n')
          assert source['sourceSha'] == '761d63a4e52ff7915d4432c004df13182db63010'
          assert source['sourceStatus'] == ''
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('LOCALIZATION_PAIR_SETUP_STARTED_AT=' + str(time.monotonic()) + '\n')
          PY
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          node-version: '24.21.0'
      - name: Record shared setup outside samples
        env:
          LOCALIZATION_PAIR_DEPENDENCY_OUTPUTS: ${{ toJSON(steps.deps.outputs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, subprocess, time
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'localization-pair-results')
          receipt = {'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'sourceTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                     'dependencySetupSeconds': time.monotonic() - float(os.environ['LOCALIZATION_PAIR_SETUP_STARTED_AT']),
                     'node': subprocess.check_output(['node', '--version'], text=True).strip(),
                     'pnpm': subprocess.check_output(['pnpm', '--version'], text=True).strip(),
                     'platformSystem': platform.system(), 'platformMachine': platform.machine(),
                     'dependencyOutputs': json.loads(os.environ['LOCALIZATION_PAIR_DEPENDENCY_OUTPUTS'])}
          (output / 'shared-setup.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Run full audits, conditional extraction, cases and real controls
        run: python3 "$RUNNER_TEMP/localization-pair-bundle/run-paired-localization.py" --out "$RUNNER_TEMP/localization-pair-results" --execute
      - name: Upload all bootstrap, source, case and timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localization-paired-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localization-pair-results
          retention-days: 14
          if-no-files-found: error
