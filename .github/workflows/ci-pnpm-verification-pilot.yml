name: Manual mobile HTML preview navigation qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed tested merge; temporary definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-mobile-html-preview-navigation-3b24
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      MOBILE_NAVIGATION_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Preserve exact LF source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Install the original WebKit owner
        run: pnpm exec playwright install --with-deps webkit
      - name: Require the failed Chromium version
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome"
          version="$("$chrome" --version)"
          test "${version##* }" = '154.0.8037.57'
          echo "ORCA_MOBILE_WEB_RENDER_BROWSER=$chrome" >> "$GITHUB_ENV"
      - name: Preserve first original attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/materialize.py before original
          export ORCA_IMPORT_REUSE_DETAILS='notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/original/report-details.json'
          set +e
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/mobile-web-app-html-preview-render.test.mjs --testNamePattern='paints\ the\ artifact\ under\ the\ policy\ the\ shell\ already\ ships|asks\ to\ navigate\ the\ top\ frame\ to\ the\ shell\ itself,\ which\ the\ shell\ must\ refuse|renders\ an\ artifact\ link\ as\ text\ against\ a\ shell\ that\ cannot\ open\ one|taps\ a\ fragment\ link,\ which\ navigates\ this\ frame\ rather\ than\ scrolling\ it|hands\ a\ user'"'"'s\ tap\ on\ a\ link\ to\ the\ top\ frame,\ exactly\ once|hands\ up\ nothing\ without\ a\ tap,\ and\ nothing\ for\ a\ form\ or\ a\ new\ window' --reporter=default --reporter=json --reporter=./notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/persistence-import-reuse-benchmark-reporter.mjs --outputFile=notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/original/report.json 2>&1 | tee 'notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/original/command.log'
          code=${PIPESTATUS[0]}
          set -e
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/materialize.py after original "$code"
          exit "$code"
      - name: Preserve first candidate attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/materialize.py before candidate
          export ORCA_IMPORT_REUSE_DETAILS='notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/candidate/report-details.json'
          set +e
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/mobile-web-app-html-preview-render.test.mjs --testNamePattern='paints\ the\ artifact\ under\ the\ policy\ the\ shell\ already\ ships|asks\ to\ navigate\ the\ top\ frame\ to\ the\ shell\ itself,\ which\ the\ shell\ must\ refuse|renders\ an\ artifact\ link\ as\ text\ against\ a\ shell\ that\ cannot\ open\ one|taps\ a\ fragment\ link,\ which\ navigates\ this\ frame\ rather\ than\ scrolling\ it|hands\ a\ user'"'"'s\ tap\ on\ a\ link\ to\ the\ top\ frame,\ exactly\ once|hands\ up\ nothing\ without\ a\ tap,\ and\ nothing\ for\ a\ form\ or\ a\ new\ window' --reporter=default --reporter=json --reporter=./notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/persistence-import-reuse-benchmark-reporter.mjs --outputFile=notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/candidate/report.json 2>&1 | tee 'notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/candidate/command.log'
          code=${PIPESTATUS[0]}
          set -e
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/materialize.py after candidate "$code"
          exit "$code"
      - name: Validate every original case and passive observation
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/collect-results.py notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24 .benchmark-definition/.github/benchmark/mobile-html-preview-navigation-3b24/payload navigation-qualification-result.json
      - name: Preserve all first attempts, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-html-preview-navigation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/mobile-html-preview-navigation-ci-3b24/
            navigation-qualification-result.json
