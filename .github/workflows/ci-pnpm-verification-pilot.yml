name: Manual isolated module import attribution
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source matching the reviewed diagnostic plan.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-module-import-attribution
  cancel-in-progress: false
jobs:
  attribution:
    name: Three unchanged import-heavy suites
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout diagnostic definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize source-bound three-file selection
        env:
          BENCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .benchmark-definition/.github/benchmark/matched-full-pipeline/materialize.mjs
      - name: Capture stock import attribution once
        run: node notes/bun-migration/performance/module-import-attribution-diagnostic/benchmark-matched-shard.mjs four 0 1
      - name: Retain observation and failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-import-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/module-import-attribution-shard-*
            notes/bun-migration/performance/module-import-attribution-benchmark-freeze.json
            notes/bun-migration/performance/module-import-attribution-diagnostic/*.json
            notes/bun-migration/performance/module-import-attribution-diagnostic/*.mjs
