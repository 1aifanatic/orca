name: TypeScript checker-count capacity diagnostic
on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: typescript-checkers-two-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 19
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      TRIAL_DEFINITION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve owned definition payload
        env:
          SOURCE_INPUT: ${{ inputs.source_sha }}
        run: |
          test "$SOURCE_INPUT" = b46a2eb9beec05b1a4ff3527c7a75a3dd77004b9
          test "$(git rev-parse HEAD)" = "$TRIAL_DEFINITION_SHA"
          mkdir "$RUNNER_TEMP/checker-count-payload"
          cp .github/benchmark/typescript-checkers-two/* "$RUNNER_TEMP/checker-count-payload/"
      - uses: actions/checkout@v6
        with:
          ref: b46a2eb9beec05b1a4ff3527c7a75a3dd77004b9
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Six counted wrappers then negative incremental parity
        run: python3 "$RUNNER_TEMP/checker-count-payload/trial.py" "$RUNNER_TEMP/checker-count-payload" "$RUNNER_TEMP/checker-count-evidence"
      - name: Retain every attempt and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-checkers-two-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checker-count-evidence
            ${{ runner.temp }}/checker-count-payload
          if-no-files-found: error
          retention-days: 14
