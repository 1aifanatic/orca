              "The normal compiler planner is a full reference under workflow_dispatch; PR modes require the separate census.",
              "Only actual heavy checks and dependency eligibility run here; no full unit/package/platform matrix.",
              "Sentinel runner admission is separate from dependency eligibility; external job timestamps measure both."
            ]
          }
          const shards = JSON.parse(process.env.SHARDS)
          assert.deepEqual(shards, Array.from({ length: 5 }, (_, index) => ({ index: index + 1, count: 5 })))
          assert.equal(process.env.ROUTER_RESULT, 'success')
          assert.equal(process.env.STATIC_RESULT, 'success')
          assert.equal(process.env.TYPE_RESULT, 'success')
          assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch')
          for (const key of ['STATIC_SELECTED', 'TYPE_SELECTED', 'UNIT_SELECTED', 'PACKAGE_SELECTED', 'WINDOWS_PACKAGE_SELECTED']) assert.equal(process.env[key], 'true')
          if (receipt.arm === 'original') {
            assert.equal(process.env.STATIC_PHYSICAL, 'success')
            assert.equal(process.env.TYPE_PHYSICAL, 'success')
          } else {
            assert.equal(process.env.SHARED_PHYSICAL, 'success')
          }
          receipt.sample = Number(process.env.SAMPLE)
          receipt.workflowContext = { sourceSha: process.env.GITHUB_SHA, workflowSha: process.env.GITHUB_WORKFLOW_SHA, event: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT }
          receipt.physicalResults = { router: process.env.ROUTER_RESULT, static: process.env.STATIC_PHYSICAL, type: process.env.TYPE_PHYSICAL, shared: process.env.SHARED_PHYSICAL }
          receipt.logicalResults = { static: process.env.STATIC_RESULT, type: process.env.TYPE_RESULT }
          receipt.selectors = { static: process.env.STATIC_SELECTED, type: process.env.TYPE_SELECTED, test: process.env.UNIT_SELECTED, package: process.env.PACKAGE_SELECTED, package_windows: process.env.WINDOWS_PACKAGE_SELECTED, mobileDependencies: process.env.MOBILE_DEPENDENCIES }
          receipt.shards = shards
          fs.writeFileSync(process.env.RUNNER_TEMP + '/heavy-eligibility.json', JSON.stringify(receipt, null, 2) + '\n')
          ORCA_ELIGIBILITY_RECEIPT
      - uses: actions/upload-artifact@v7
        with:
          name: heavy-eligibility-combined-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heavy-eligibility.json
          retention-days: 14
          if-no-files-found: error
