name: Manual Claude wake-up HTTP transport qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source76d; definition-only branch must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-claude-wakeup-http-transport
  cancel-in-progress: false
jobs:
  qualify:
    name: Real HTTP ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      HTTP_SOURCE_SHA: ${{ inputs.source_sha }}
      HTTP_RUNTIME: ${{ matrix.runtime }}
      HTTP_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Checkout reviewed definition separately
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize unchanged controller and source-bound proposal
        id: materialize
        run: node .benchmark-definition/.github/benchmark/claude-wakeup-http/materialize.mjs
      - name: Preserve original before attempt without retry
        id: before
        continue-on-error: true
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py before "$HTTP_RUNTIME" notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d/launch-plan.json claude-wakeup-http-transport-ci-76d/before "$HTTP_SEED"
      - name: Require source and process boundaries before applying candidate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d')
          s=json.loads((p/'before-source-proof.json').read_text())
          assert s['result'] in [0,1] and s['normalClose'] and s['sourceUnchanged']
          assert s['before']==s['after'] and not s['samplingErrors']
          assert not s['externalObserved'] and not s['postCloseCoordinators']
          r=json.loads((p/'before.json').read_text())
          assert r['numTotalTests']==51 and len(r['testResults'])==1
          PY
          git apply --check notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d/candidate.patch
          git apply notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d/candidate.patch
      - name: Qualify one-header candidate without retry
        id: after
        run: python3 notes/bun-migration/performance/qualify-fixture-reuse.py after "$HTTP_RUNTIME" notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d/launch-plan.json claude-wakeup-http-transport-ci-76d/after "$HTTP_SEED"
      - name: Preserve every attempt and its runtime context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-wakeup-http-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/claude-wakeup-http-transport-ci-76d/
  evidence:
    name: Verify eight raw attempts without promoting failures
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: claude-wakeup-http-*
          path: http-artifacts
      - name: Verify names, raw outcomes, configs and provenance
        env:
          HTTP_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/claude-wakeup-http/collect-results.py http-artifacts
      - name: Preserve evidence even when qualification rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-wakeup-http-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: http-transport-result.json
