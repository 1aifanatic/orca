name: Shard rebalance holdout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    name: rebalance unit node 24 shard ${{ matrix.shard }}/5
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout benchmark support
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unpack frozen trial inputs outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/rebalance-bundle" "$RUNNER_TEMP/rebalance-unit"
          tar -xzf config/ci-capacity-benchmark/shard-rebalance.tar.gz -C "$RUNNER_TEMP/rebalance-bundle"
          test -f "$RUNNER_TEMP/rebalance-bundle/holdout-manifest.json"
      - name: Checkout fixed final source
        uses: actions/checkout@v6
        with:
          ref: 5cce5f56775d3d66eb3abe2fbc80900c4eff5c05
          persist-credentials: false
      - name: Mark dependency setup start
        run: python3 -c 'import os,time; open(os.environ["GITHUB_ENV"],"a").write("PAIR_SETUP_STARTED_AT="+str(time.monotonic())+"\n")'
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          node-version: '24.21.0'
          cache-electron-package: 'true'
      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs
      - name: Record common setup
        env:
          PAIR_DEPENDENCY_OUTPUTS: ${{ toJSON(steps.deps.outputs) }}
          PAIR_SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          record = {'shard': int(os.environ['PAIR_SHARD']),
                    'dependencySetupSeconds': time.monotonic() - float(os.environ['PAIR_SETUP_STARTED_AT']),
                    'sourceSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'dependencyOutputs': json.loads(os.environ['PAIR_DEPENDENCY_OUTPUTS'])}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'rebalance-unit', 'shared-setup.json').write_text(json.dumps(record, indent=2))
          PY
      - name: Run counterbalanced assignment arms
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: python3 "$RUNNER_TEMP/rebalance-bundle/run-paired-shard.py" --shard ${{ matrix.shard }} --out "$RUNNER_TEMP/rebalance-unit" --execute
      - name: Upload all source, case and timing evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: rebalance-unit-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebalance-unit
          retention-days: 14
          if-no-files-found: warn
