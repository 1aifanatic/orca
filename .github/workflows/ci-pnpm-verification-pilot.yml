name: Manual isolated Zod optimizer compatibility
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 30bc fixture-fix source; definition branch must never merge.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-zod-optimizer-compatibility
  cancel-in-progress: false
jobs:
  qualify:
    name: Zod compatibility ${{ matrix.runtime }} seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runtime: [bun, node]
        seed: [104729, 130363]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ZOD_SOURCE_SHA: ${{ inputs.source_sha }}
      ZOD_RUNTIME: ${{ matrix.runtime }}
      ZOD_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Materialize reviewed existing configuration-only qualifier
        run: node .benchmark-definition/.github/benchmark/zod-optimizer/materialize.mjs
      - name: Qualify optimizer-off without retry
        run: |
          export ORCA_ZOD_OPTIMIZER_CACHE="$PWD/notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/runs/$ZOD_RUNTIME-$ZOD_SEED/before-cache"
          test ! -e "$ORCA_ZOD_OPTIMIZER_CACHE"
          python3 notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/controller-config-only-census-after.py before "$ZOD_RUNTIME" notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/broad-ci-launch-plan.json "zod-dependency-optimizer-proposal/30bc964e/runs/$ZOD_RUNTIME-$ZOD_SEED/before" "$ZOD_SEED"
      - name: Qualify optimizer-on from a distinct fresh cache without retry
        run: |
          export ORCA_ZOD_OPTIMIZER_CACHE="$PWD/notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/runs/$ZOD_RUNTIME-$ZOD_SEED/after-cache"
          test ! -e "$ORCA_ZOD_OPTIMIZER_CACHE"
          python3 notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/controller-config-only-census-after.py after "$ZOD_RUNTIME" notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/broad-ci-launch-plan.json "zod-dependency-optimizer-proposal/30bc964e/runs/$ZOD_RUNTIME-$ZOD_SEED/after" "$ZOD_SEED"
      - name: Preserve every raw report and owned optimizer output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zod-broad-${{ matrix.runtime }}-${{ matrix.seed }}
          retention-days: 14
          if-no-files-found: warn
          path: notes/bun-migration/performance/zod-dependency-optimizer-proposal/30bc964e/
  evidence:
    name: Verify all eight original compatibility outcomes
    if: always()
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: zod-broad-*
          path: zod-artifacts
      - name: Compare every original case and guarded runtime setting
        env:
          ZOD_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/benchmark/zod-optimizer/collect-results.py zod-artifacts
      - name: Preserve collector evidence on success or rejection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zod-broad-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: zod-broad-result.json
