name: Manual mobile HTML preview loaded-frame full qualification
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed tested merge; temporary definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-mobile-html-preview-loaded-frame-full-thirty-launch-guards-a211
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      MOBILE_NAVIGATION_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Preserve exact LF source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Install the original WebKit owner
        run: pnpm exec playwright install --with-deps webkit
      - name: Require the exact Chromium version
        run: |
          set -euo pipefail
          python3 - <<'PY_VERSION'
          import base64
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          chrome = shutil.which('google-chrome') or shutil.which('google-chrome-stable')
          receipt = {'sourceSha': os.environ['MOBILE_NAVIGATION_SOURCE_SHA'],
                     'definitionSha': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                     'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'expectedVersion': '154.0.8037.57',
                     'executable': chrome, 'argv': [chrome, '--version'] if chrome else None,
                     'exitCode': None, 'stdoutBase64': '', 'stderrBase64': '',
                     'stdout': '', 'stderr': '', 'parsedVersion': None,
                     'accepted': False, 'error': None}
          try:
              if chrome is None:
                  raise RuntimeError('No Google Chrome executable is available')
              r = subprocess.run([chrome, '--version'], capture_output=True, timeout=20)
              receipt.update(exitCode=r.returncode, stdoutBase64=base64.b64encode(r.stdout).decode(),
                             stderrBase64=base64.b64encode(r.stderr).decode(),
                             stdout=r.stdout.decode('utf-8', errors='replace'),
                             stderr=r.stderr.decode('utf-8', errors='replace'))
              if r.returncode != 0:
                  raise RuntimeError('Chrome --version returned nonzero')
              tokens = receipt['stdout'].strip().split()
              receipt['parsedVersion'] = tokens[-1] if tokens else None
              if receipt['parsedVersion'] != receipt['expectedVersion']:
                  raise RuntimeError('The exact failed Chrome version is unavailable')
              receipt['accepted'] = True
          except subprocess.TimeoutExpired as e:
              receipt.update(error='Chrome --version timed out',
                             stdoutBase64=base64.b64encode(e.stdout or b'').decode(),
                             stderrBase64=base64.b64encode(e.stderr or b'').decode(),
                             stdout=(e.stdout or b'').decode('utf-8', errors='replace'),
                             stderr=(e.stderr or b'').decode('utf-8', errors='replace'))
          except Exception as e:
              receipt['error'] = str(e)
          with Path('mobile-loaded-frame-browser-selection.json').open('x') as f:
              json.dump(receipt, f, indent=2)
              f.write('\n')
          if not receipt['accepted']:
              print(json.dumps(receipt), file=sys.stderr)
              sys.exit(1)
          assert Path(chrome).is_absolute()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ORCA_MOBILE_WEB_RENDER_BROWSER=' + chrome + '\n')
          PY_VERSION
      - name: Require and close the exact WebKit setup browser
        run: |
          set -euo pipefail
          set +e
          pnpm exec node --input-type=module <<'JS_WEBKIT' 2>&1 | tee mobile-loaded-frame-webkit-probe.log
          import { writeFileSync, readFileSync } from 'node:fs'
          import { webkit } from 'playwright-core'
          const started = process.hrtime.bigint()
          const startedAt = new Date().toISOString()
          const manifest = JSON.parse(readFileSync('.benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/payload/definition-manifest.json', 'utf8'))
          const owner = JSON.parse(readFileSync('node_modules/playwright-core/browsers.json', 'utf8')).browsers.find(b => b.name === 'webkit')
          const receipt = {sourceSha: process.env.MOBILE_NAVIGATION_SOURCE_SHA, definitionSha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, engine: 'webkit',
            expectedVersion: '26.6', revision: owner?.revision ?? null, executable: webkit.executablePath(),
            browserVersion: null, closed: false, accepted: false, error: null, startedAt, completedAt: null, wallSeconds: null,
            argv: ['exec', 'node', '--input-type=module'], environmentKeysAbsent: []}
          let browser
          try {
            const chromeSelection = JSON.parse(readFileSync('mobile-loaded-frame-browser-selection.json', 'utf8'))
            if (!chromeSelection.accepted || process.env[manifest.allowedChromeExecutableEnvironmentKey] !== chromeSelection.executable) throw new Error('Chrome executable override differs from the accepted raw receipt')
            for (const key of manifest.forbiddenBrowserEnvironmentKeys) {
              if (Object.hasOwn(process.env, key)) throw new Error('Unexpected browser selection/debug environment key: ' + key)
              receipt.environmentKeysAbsent.push(key)
            }
            if (Object.keys(process.env).some(k => manifest.forbiddenBrowserEnvironmentPrefixes.some(p => k.startsWith(p)))) throw new Error('Unexpected browser test environment prefix')
            if (owner?.browserVersion !== '26.6' || owner.revision !== '2359') throw new Error('Unexpected installed WebKit owner')
            browser = await webkit.launch({headless: true, timeout: 20000})
            receipt.browserVersion = browser.version()
            if (receipt.browserVersion !== receipt.expectedVersion) throw new Error('The exact WebKit version is unavailable')
          } catch (error) { receipt.error = String(error) }
          finally {
            if (browser) {
              try { await browser.close(); receipt.closed = true }
              catch (error) { receipt.error = String(error) }
            }
            receipt.completedAt = new Date().toISOString()
            receipt.wallSeconds = Number(process.hrtime.bigint() - started) / 1e9
            receipt.accepted = receipt.error === null && receipt.closed && receipt.browserVersion === receipt.expectedVersion
            writeFileSync('mobile-loaded-frame-webkit-selection.json', JSON.stringify(receipt, null, 2) + '\n', {flag: 'wx'})
          }
          if (!receipt.accepted) { console.error(JSON.stringify(receipt)); process.exitCode = 1 }
          JS_WEBKIT
          code=${PIPESTATUS[0]}
          set -e
          exit "$code"
      - name: Preserve first original attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/materialize.py before original
          export ORCA_IMPORT_REUSE_DETAILS='notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/original/report-details.json'
          set +e
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/mobile-web-app-html-preview-render.test.mjs --reporter=default --reporter=json --reporter=./notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/persistence-import-reuse-benchmark-reporter.mjs --outputFile=notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/original/report.json 2>&1 | tee 'notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/original/command.log'
          code=${PIPESTATUS[0]}
          set -e
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/materialize.py after original "$code"
          exit "$code"
      - name: Preserve first candidate attempt
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/materialize.py before candidate
          export ORCA_IMPORT_REUSE_DETAILS='notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/candidate/report-details.json'
          set +e
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/mobile-web-app-html-preview-render.test.mjs --reporter=default --reporter=json --reporter=./notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/persistence-import-reuse-benchmark-reporter.mjs --outputFile=notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/candidate/report.json 2>&1 | tee 'notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/candidate/command.log'
          code=${PIPESTATUS[0]}
          set -e
          python3 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/materialize.py after candidate "$code"
          exit "$code"
      - name: Validate every full original case and completion receipt
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/collect-results.py notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211 .benchmark-definition/.github/benchmark/mobile-html-preview-loaded-frame-launch-guards-a211/payload loaded-frame-full-qualification-result.json
      - name: Preserve all first attempts, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-html-preview-loaded-frame-full-thirty-launch-guards-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/mobile-html-preview-loaded-frame-launch-guards-ci-a211/
            loaded-frame-full-qualification-result.json
            mobile-loaded-frame-browser-selection.json
            mobile-loaded-frame-webkit-selection.json
            mobile-loaded-frame-webkit-probe.log
