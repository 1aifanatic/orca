name: Manual full1187 shared transform server six counted commands
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact907 source; diagnostic definition never merges.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-shared-transform-full-shard-held-907
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      SHARED_SERVER_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .benchmark-definition
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.21.0'
          native-runtime: node
          cache-electron-package: 'true'
      - name: Install Electron package binary
        run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
      - name: Materialize exact full workload and eight-command admission
        run: node .benchmark-definition/.github/benchmark/shared-vite-server-full-shard-held-timing/materialize.mjs
      - name: Count six whole commands ABBAAB; stop after failure, no retries
        run: |
          driver=notes/bun-migration/performance/benchmark-persistence-import-reuse.mjs
          plan=notes/bun-migration/performance/shared-transform-full-shard-held-907-ci/measurement-plan.json
          patch=notes/bun-migration/performance/shared-transform-full-shard-held-907-ci/shipping.patch
          switch=notes/bun-migration/performance/shared-transform-full-shard-held-907-ci/switch-framework-phase.mjs
          node "$driver" before 0 "$plan"
          git apply --check "$patch"
          git apply "$patch"
          node "$switch" after after-0
          node "$driver" after 0 "$plan"
          node "$driver" after 1 "$plan"
          node "$switch" before before-1
          git apply --reverse --check "$patch"
          git apply --reverse "$patch"
          git diff --exit-code HEAD
          node "$driver" before 1 "$plan"
          node "$driver" before 2 "$plan"
          git apply --check "$patch"
          git apply "$patch"
          node "$switch" after after-2
          node "$driver" after 2 "$plan"
      - name: Independently replay all six maps and counted whole walls
        if: always()
        run: python3 .benchmark-definition/.github/benchmark/shared-vite-server-full-shard-held-timing/collect-results.py notes/bun-migration/performance .benchmark-definition/.github/benchmark/shared-vite-server-full-shard-held-timing/payload shared-transform-full-shard-held-907-result.json
      - name: Preserve every attempted sample and unlaunched round
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shared-transform-full-shard-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            notes/bun-migration/performance/shared-transform-full-shard-held-907-ci/
            notes/bun-migration/performance/shared-transform-full-shard-held-907-*
            shared-transform-full-shard-held-907-result.json
