name: pnpm verification cache pilot

on:
  pull_request:
    paths: ['.github/workflows/ci-pnpm-verification-pilot.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Existing Linux verification pilot or temporary Mac Intel root-store comparison
        type: choice
        default: verification-cache
        options: [verification-cache, mac-intel-root-store]
      headless-proof:
        description: Qualify each Mac install with the existing headless server and Node 18 handoff
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pnpm-verification-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  seed:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
      # PR caches are scoped to the PR merge ref; main never restores them.
      - uses: actions/cache/save@v5
        if: steps.deps.outputs.verification-cache-hit != 'true'
        with:
          path: ${{ steps.deps.outputs.verification-cache-path }}
          key: ${{ steps.deps.outputs.verification-cache-key }}

  measure:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'verification-cache'
    needs: seed
    name: measure ${{ matrix.runner }} sample ${{ matrix.sample }} cache ${{ matrix.cache }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        sample: [1, 2, 3]
        cache: ['false', 'true']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          cache-pnpm-verification: ${{ matrix.cache }}
      - name: Validate treatment and frozen install
        env:
          CACHE_ENABLED: ${{ matrix.cache }}
          CACHE_HIT: ${{ steps.deps.outputs.verification-cache-hit }}
        run: |
          if [ "$CACHE_ENABLED" = true ]; then test "$CACHE_HIT" = true; fi
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          node -e "require.resolve('vitest'); require.resolve('electron')"

  mac-store-seed:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mac-intel-root-store'
    runs-on: macos-15-intel
    timeout-minutes: 15
    outputs:
      verification-key: ${{ steps.identity.outputs.verification-key }}
      verification-sha: ${{ steps.identity.outputs.verification-sha }}
      manifest-sha: ${{ steps.identity.outputs.manifest-sha }}
      source-sha: ${{ steps.identity.outputs.source-sha }}
      package-sha: ${{ steps.identity.outputs.package-sha }}
      native-package-sha: ${{ steps.identity.outputs.native-package-sha }}
      installed-lockfile-sha: ${{ steps.identity.outputs.installed-lockfile-sha }}
      image-version: ${{ steps.identity.outputs.image-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          node-version: '24.21.0'
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'true'
      - name: Record the common verification and package identities
        id: identity
        shell: bash
        env:
          ORCA_CI_PNPM_STORE_PILOT_RECEIPT: ${{ runner.temp }}/pnpm-root-store-seed.json
          PILOT_VERIFICATION_POLICY_KEY: ${{ steps.deps.outputs.verification-cache-key }}
          PILOT_VERIFICATION_KEY: ${{ steps.deps.outputs.verification-cache-key }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          PILOT_VERIFICATION_PATH: ${{ steps.deps.outputs.verification-cache-path }}
        run: |
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml
          PILOT_SOURCE_SHA="$(git rev-parse HEAD)" PILOT_PNPM_VERSION="$(pnpm --version)" \
            node config/scripts/ci-pnpm-root-store-pilot.mjs seed
      # Snapshot this run's verified bytes; policy keys may already own older immutable records.
      - uses: actions/cache/save@v5
        with:
          path: ${{ steps.deps.outputs.verification-cache-path }}
          key: ${{ steps.identity.outputs.verification-key }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-intel-root-store-seed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pnpm-root-store-seed.json
          if-no-files-found: error
          retention-days: 7

  mac-store-measure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'mac-intel-root-store'
    needs: mac-store-seed
    name: Mac Intel root store sample ${{ matrix.sample }} cache ${{ matrix.store }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
        store: [restore-only, 'false']
    env:
      ORCA_CI_PNPM_STORE_PILOT_ARM: ${{ matrix.store }}
      ORCA_CI_PNPM_STORE_PILOT_SAMPLE: ${{ matrix.sample }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_VERIFICATION_KEY: ${{ needs.mac-store-seed.outputs.verification-key }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_VERIFICATION_SHA: ${{ needs.mac-store-seed.outputs.verification-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_MANIFEST_SHA: ${{ needs.mac-store-seed.outputs.manifest-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_SOURCE_SHA: ${{ needs.mac-store-seed.outputs.source-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_PACKAGE_SHA: ${{ needs.mac-store-seed.outputs.package-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_NATIVE_PACKAGE_SHA: ${{ needs.mac-store-seed.outputs.native-package-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_INSTALLED_LOCKFILE_SHA: ${{ needs.mac-store-seed.outputs.installed-lockfile-sha }}
      ORCA_CI_PNPM_STORE_PILOT_EXPECTED_IMAGE_VERSION: ${{ needs.mac-store-seed.outputs.image-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Measure the actual dependency action
        uses: ./.github/actions/install-node-dependencies
        env:
          ORCA_CI_PNPM_STORE_PILOT_RECEIPT: ${{ runner.temp }}/pnpm-root-store-sample.json
        with:
          node-version: '24.21.0'
          cache-pnpm-store: ${{ matrix.store }}
          cache-pnpm-verification: 'true'
          pilot-verification-cache-key: ${{ needs.mac-store-seed.outputs.verification-key }}
      - name: Build and smoke this runner's node-pty prebuild slot under the pinned Node
        if: inputs.headless-proof
        shell: bash
        run: |
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
      - run: pnpm build:orcad
        if: inputs.headless-proof
      - run: pnpm test:node-server --artifact
        if: inputs.headless-proof
      - uses: actions/setup-node@v6
        if: inputs.headless-proof
        with:
          node-version: '18'
          package-manager-cache: false
      - name: Verify Node 18 loads and hands off to the pinned Node
        if: inputs.headless-proof
        shell: bash
        run: |
          node out/orcad/orcad.js --orcad-smoke-load-check
          node out/orcad/orcad.js --orcad-profile-state-preflight 00000000-0000-4000-8000-000000000018 | tee "$RUNNER_TEMP/preflight.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(r.runtime!=='node'||r.runtimeVersion!=='24.21.0')process.exit(1)" "$RUNNER_TEMP/preflight.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-intel-root-store-${{ matrix.sample }}-${{ matrix.store }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pnpm-root-store-sample.json
            ${{ runner.temp }}/preflight.json
          if-no-files-found: error
          retention-days: 7
