name: CI fixture setup comparison (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fixture-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          cache-electron-package: 'true'
      - name: Install the pinned Electron package binary
        run: pnpm exec node config/scripts/install-electron-package-binary.mjs
      - name: Compare the full WebRTC egress probe under an isolated display
        run: xvfb-run --auto-servernum pnpm exec node config/scripts/ci-webrtc-egress-pilot.mjs --output "$RUNNER_TEMP/webrtc-egress-pilot"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webrtc-egress-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/webrtc-egress-pilot
          retention-days: 7
          compression-level: 0
