name: i18next extraction comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
      - name: Prepare patched 1.74.2 baseline
        run: |
          mkdir -p node_modules/.orca-i18next-before
          curl -fsSL https://registry.npmjs.org/i18next-cli/-/i18next-cli-1.74.2.tgz -o "$RUNNER_TEMP/i18next-before.tgz"
          tar -xzf "$RUNNER_TEMP/i18next-before.tgz" --strip-components=1 -C node_modules/.orca-i18next-before
          patch -p1 -d node_modules/.orca-i18next-before < config/patches/i18next-cli@1.74.4.patch
      - name: Verify localization contracts
        run: pnpm test config/scripts/localization-extraction-call-syntax.test.mjs config/scripts/verify-localization-extraction.test.mjs config/scripts/localization-package-contract.test.mjs config/scripts/localization-extraction-change-scope.test.mjs
      - name: Compare extraction on the static-analysis runner
        run: node config/scripts/ci-i18next-extraction-benchmark.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: i18next-extraction-comparison
          path: i18next-extraction-comparison.json
