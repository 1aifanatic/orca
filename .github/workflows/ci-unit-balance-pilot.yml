name: Unit balance fixed-source comparison

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ci-unit-balance-pilot.yml']

permissions:
  contents: read

concurrency:
  group: unit-balance-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  ORCA_BALANCE_UNIT_SHARDS: '1'
  NODE_DISABLE_COMPILE_CACHE: '1'

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Capture original weights
        run: |
          git fetch --depth=1 origin 1de3aa405f71ea693b7138c40dac62e76883a10f
          git show 1de3aa405f71ea693b7138c40dac62e76883a10f:config/scripts/ci-shard-timings.json > "$RUNNER_TEMP/original-weights.json"
          cp config/scripts/ci-shard-timings.json "$RUNNER_TEMP/candidate-weights.json"
      - name: Compare complete shard with both weight sets
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          export ORCA_SHARD_SOURCE_SHA
          mkdir -p ci-balance
          status=0
          for arm in original candidate; do
            cp "$RUNNER_TEMP/$arm-weights.json" config/scripts/ci-shard-timings.json
            export ORCA_SHARD_MANIFEST="ci-balance/$arm-assignment.json"
            export ORCA_UNIT_TIMING_REPORT="ci-balance/$arm-unit-timings.json"
            started="$(node -p 'performance.timeOrigin + performance.now()')"
            arm_status=0
            pnpm exec vitest run --config config/vitest.config.ts \
              --shard="$SHARD/5" --maxWorkers=4 --no-cache \
              --experimental.fsModuleCache=false \
              --reporter=default --reporter=./config/scripts/ci-unit-timing-reporter.mjs \
              --reporter=json --outputFile.json="ci-balance/$arm-results.json" \
              > "ci-balance/$arm.log" 2>&1 || arm_status=$?
            finished="$(node -p 'performance.timeOrigin + performance.now()')"
            ARM="$arm" STARTED="$started" FINISHED="$finished" ARM_STATUS="$arm_status" \
              node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const { ARM, STARTED, FINISHED, ARM_STATUS, ORCA_SHARD_SOURCE_SHA } = process.env
          writeFileSync(`ci-balance/${ARM}-elapsed.json`, JSON.stringify({
            elapsedMs: Number(FINISHED) - Number(STARTED),
            exitCode: Number(ARM_STATUS),
            sourceSha: ORCA_SHARD_SOURCE_SHA,
            nodeVersion: process.versions.node
          }))
          JS
            tail -n 12 "ci-balance/$arm.log"
            if [ "$arm_status" != 0 ]; then status=1; fi
          done
          cp "$RUNNER_TEMP/candidate-weights.json" config/scripts/ci-shard-timings.json
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-balance-shard-${{ matrix.shard }}
          path: ci-balance/
          retention-days: 14
