name: NSIS policy negative control
on:
  push:
    branches:
      - ci/nsis-probe-investigation
permissions:
  contents: read
jobs:
  investigate:
    name: Reject unchecked policy fallthrough
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache electron-builder downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Record runner resources
        shell: pwsh
        run: node -e
          "console.log(JSON.stringify({cpus:require('node:os').availableParallelism(),memory:require('node:os').totalmem(),node:process.version,arch:process.arch,image:process.env.ImageVersion}))"
      - name: Restore unchecked validator and require its rejection
        shell: pwsh
        run: |
          node config/scripts/nsis-policy-negative-control.mjs prepare config/scripts/nsis-process-check.test.mjs nsis-policy-negative-control.original.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/vitest/vitest.mjs run --config config/vitest.config.ts config/scripts/nsis-process-check.test.mjs --reporter=default --reporter=json --outputFile.json=nsis-policy-negative-control.json 2>&1 | Tee-Object -FilePath nsis-policy-negative-control.log
          $testExitCode = $LASTEXITCODE
          node config/scripts/nsis-policy-negative-control.mjs verify nsis-policy-negative-control.json "$testExitCode"
          exit $LASTEXITCODE
      - name: Save negative-control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nsis-policy-negative-control
          path: |
            nsis-policy-negative-control.original.txt
            config/scripts/nsis-process-check.test.mjs
            nsis-policy-negative-control.json
            nsis-policy-negative-control.log
          retention-days: 7
          if-no-files-found: warn
