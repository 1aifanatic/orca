name: NSIS process probe investigation
on:
  push:
    branches:
      - ci/nsis-probe-investigation
permissions:
  contents: read
jobs:
  investigate:
    name: PowerShell policy (${{ matrix.module_path }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module_path:
          - inherited
          - default
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_NSIS_PROBE_DIAGNOSTICS: '1'
      ORCA_NSIS_CLEAR_MODULE_PATH: ${{ matrix.module_path == 'default' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache electron-builder downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Record runner resources
        shell: pwsh
        run: node -e
          "console.log(JSON.stringify({cpus:require('node:os').availableParallelism(),memory:require('node:os').totalmem(),node:process.version,arch:process.arch,image:process.env.ImageVersion}))"
      - name: Verify policy before running the NSIS query
        run: pnpm exec vitest run --config config/vitest.config.ts config/scripts/nsis-process-check.test.mjs
