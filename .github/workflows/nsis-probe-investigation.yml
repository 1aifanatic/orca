name: NSIS process probe investigation
on:
  push:
    branches:
      - ci/nsis-probe-investigation
permissions:
  contents: read
jobs:
  investigate:
    name: PowerShell phases (${{ matrix.mode }})
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode:
          - full
          - isolated
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_NSIS_PROBE_DIAGNOSTICS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Cache electron-builder downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-
      - uses: ./.github/actions/install-node-dependencies
        id: deps
        with:
          native-runtime: node
          persist-native-cache: 'false'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml
      - uses: ./.github/actions/install-mobile-dependencies
      - name: Record runner resources
        shell: pwsh
        run: node -e
          "console.log(JSON.stringify({cpus:require('node:os').availableParallelism(),memory:require('node:os').totalmem(),node:process.version,arch:process.arch,image:process.env.ImageVersion}))"
      - name: Run the original full boundary group
        if: matrix.mode == 'full'
        run:
          pnpm exec vitest run --config config/vitest.config.ts config/scripts/rebuild-native-deps.test.mjs
          config/scripts/rebuild-native-deps-windows-process-tree.test.mjs
          config/scripts/rebuild-native-deps-node-pty.test.mjs config/scripts/nsis-process-check.test.mjs
          config/scripts/ensure-native-runtime-job-ownership.test.mjs
          config/scripts/verify-packaged-node-pty-job-ownership.test.mjs
          config/scripts/windows-pe-machine.test.mjs config/scripts/script-module-dependencies.test.mjs
          src/main/windows-registry-addon.test.ts config/scripts/windows-process-tree-gyp-path.test.mjs
          config/scripts/windows-process-tree-gyp-rebuild.test.mjs
          config/scripts/package-electron-runtime-contract.test.mjs
          config/scripts/electron-builder-runtime-resources.test.mjs
          src/main/browser/browser-client-page-renderer-lifecycle.electron.test.ts
          src/main/browser/browser-route-tcp-egress.electron.test.ts
          src/main/browser/browser-route-webrtc-egress.electron.test.ts
          src/main/browser/browser-route-h3-egress.electron.test.ts
          src/main/browser/browser-route-dns-prefetch.electron.test.ts
          src/main/providers/windows-conpty-wide-char-duplication.node-pty.test.ts
          src/main/providers/pty-repaint-wide-char-buffer.node-pty.test.ts
          src/shared/child-process/windows-command-line.win32.test.ts
          src/shared/child-process/windows-cmd-shim-resolution.test.ts
          src/shared/child-process/windows-cmd-shim-resolution.win32.test.ts
          src/main/agent-hooks/windows-hook-payload-delivery.test.ts
          src/main/agent-hooks/windows-direct-cmd-hook-command.test.ts
          src/main/codex/windows-hook-command.test.ts src/main/codex/windows-hook-upgrade.test.ts
          src/main/windows/windows-pty-job.win32.test.ts src/main/windows/windows-msys-job.win32.test.ts
          src/main/providers/agent-foreground-process-git-bash.win32.test.ts
          src/main/windows/windows-host-job.win32.test.ts
          src/main/windows/windows-process-tree-command-line-patch.test.ts
          src/main/windows/windows-process-table-native-addon.win32.test.ts
          src/main/persistence/profile-state/profile-state-access-windows-native.win32.test.ts
          src/main/windows-live-tree-kill.win32.test.ts src/main/wsl/wsl-runner.test.ts
          src/main/wsl/wsl-guest-environment.test.ts src/main/wsl/wsl-invocation-boundary.test.ts
          src/main/wsl/wsl-executable-path.win32.test.ts src/main/wsl/wsl-w1-w3-contract.test.ts
          src/shared/source-scan/source-tree-scan.test.ts src/main/cli/wsl-cli-powershell-boundary.test.ts
          src/main/computer/desktop-script-runtime-host.win32.test.ts src/main/cursor/hook-service.test.ts
          src/main/orca-profiles/profile-index-store.test.ts
          src/main/startup/windows-install-dir-acl-repair.win32.test.ts
          src/main/runtime/repo-worktree-admin-fingerprint.test.ts
          src/main/runtime/worktree-scan-admin-fingerprint-gate.test.ts
          src/shared/secure-file-fsync-flags.test.ts src/shared/secure-path-windows-acl.win32.test.ts
          src/main/runtime/unreadable-secret-store-preservation.win32.test.ts
          src/main/ipc/pty-codex-account-attribution.test.ts
          src/main/ipc/pty-spawn-env-codex-resume-provenance.test.ts src/relay/windows-port-scan.win32.test.ts
      - name: Run only the unchanged NSIS assertions
        if: matrix.mode == 'isolated'
        run: pnpm exec vitest run --config config/vitest.config.ts config/scripts/nsis-process-check.test.mjs
