name: Vitest upgrade pilot
on:
  push:
    branches: [nwparker/ci-next-optimizations]
    paths:
      - '.github/workflows/ci-vitest-upgrade-pilot.yml'
      - 'config/scripts/ci-vitest-upgrade-pilot.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vitest-upgrade-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [2, 4]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Compare Vitest versions on the same runner
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
          SHARD: ${{ matrix.shard }}
        run: node config/scripts/ci-vitest-upgrade-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-upgrade-${{ matrix.shard }}
          path: ci-shards/
          retention-days: 7
