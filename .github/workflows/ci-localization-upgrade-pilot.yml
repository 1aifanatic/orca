name: Localization CLI upgrade pilot
on:
  push:
    branches: [nwparker/ci-next-optimizations]
    paths:
      - '.github/workflows/ci-localization-upgrade-pilot.yml'
      - 'config/scripts/ci-localization-upgrade-pilot.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: localization-upgrade-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Compare localization CLI versions and extracted catalogs
        env:
          LOCALIZATION_PILOT_OUTPUT: ${{ runner.temp }}/localization-pilot
        run: node config/scripts/ci-localization-upgrade-pilot.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: localization-pilot
          path: |
            ${{ runner.temp }}/localization-pilot/results.json
            ${{ runner.temp }}/localization-pilot/catalog-comparison.json
            ${{ runner.temp }}/localization-pilot/*/en.json
            ${{ runner.temp }}/localization-pilot/*/run.log
          retention-days: 7
