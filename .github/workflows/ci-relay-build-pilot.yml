name: Relay build reuse pilot
on:
  push:
    branches: [nwparker/ci-next-optimizations]
    paths: ['.github/workflows/ci-relay-build-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relay-build-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
      - name: Prepare baseline build script
        run: |
          set -euo pipefail
          git show 7a83042a74a9acc9ba27d59da2ad1557c1f9ccbf:config/scripts/build-relay.mjs > config/scripts/build-relay-pilot-baseline.mjs
      - name: Compare three clean build pairs
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import stat
          import subprocess
          import time

          evidence = Path(os.environ['RUNNER_TEMP']) / 'relay-build-evidence'
          evidence.mkdir()
          outputs = Path(os.environ['RUNNER_TEMP']) / 'relay-build-outputs'
          measurements = []
          comparisons = []

          def inventory(directory):
              return {
                  str(path.relative_to(directory)): {
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                      'mode': stat.S_IMODE(path.stat().st_mode),
                  }
                  for path in sorted(directory.rglob('*')) if path.is_file()
              }

          for pair, order in enumerate([['baseline', 'reuse'], ['reuse', 'baseline'], ['baseline', 'reuse']], start=1):
              artifacts = {}
              for mode in order:
                  script = 'build-relay-pilot-baseline.mjs' if mode == 'baseline' else 'build-relay.mjs'
                  output = outputs / f'{pair}-{mode}'
                  assert not output.exists(), output
                  env = dict(os.environ, ORCA_RELAY_OUT_ROOT=str(output))
                  start = time.monotonic()
                  with (evidence / f'{pair}-{mode}.log').open('w') as log:
                      result = subprocess.run(
                          ['node', '--disable-warning=MODULE_TYPELESS_PACKAGE_JSON', f'config/scripts/{script}'],
                          env=env, stdout=log, stderr=subprocess.STDOUT,
                      )
                  measurement = {'pair': pair, 'mode': mode, 'seconds': time.monotonic() - start, 'exit': result.returncode}
                  measurements.append(measurement)
                  print(json.dumps(measurement), flush=True)
                  (evidence / 'measurements.json').write_text(json.dumps(measurements, indent=2))
                  result.check_returncode()
                  artifacts[mode] = inventory(output)
              comparison = {'pair': pair, 'files': len(artifacts['baseline']), 'equal': artifacts['baseline'] == artifacts['reuse']}
              comparisons.append(comparison)
              (evidence / 'equivalence.json').write_text(json.dumps(comparisons, indent=2))
              assert comparison['files'] > 0 and comparison['equal'], comparison
              print(json.dumps(comparison), flush=True)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relay-build-evidence
          path: ${{ runner.temp }}/relay-build-evidence/
          retention-days: 7
