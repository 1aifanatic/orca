name: Private Linux terminal package-layout Ubuntu20 floor qualification
on:
  push:
    branches: [OrcaWin/np-bun-conpty-build-proof]
permissions:
  contents: read
concurrency:
  group: bun-conpty-build-proof
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            bunArch: x64
            zipSha: 36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913
            binarySha: a83d263767d839e4d2649ca8e35d07159c7afc99afdc96d731ced29e056dda0c
          - os: ubuntu-24.04-arm
            arch: arm64
            bunArch: aarch64
            zipSha: 54328bbc2d9c8e0c9f892c544d66c57a83b84139e34909e5ee81758f1ac8fda7
            binarySha: 616f267a34278ff5ac282df37ffdfba1d7141f4f6926bca99af2cd6ef3ad32b1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    defaults:
      run:
        working-directory: config/bun-conpty-build/linux-floor
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: config/bun-conpty-build/linux-floor
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare pinned private package layout
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          tar -xzf fixture-dependencies.tar.gz
          bash prepare-package.sh '${{ matrix.arch }}' '${{ matrix.bunArch }}' '${{ matrix.zipSha }}' '${{ matrix.binarySha }}'
      - name: Run unchanged production floor runner
        run: |
          set -o pipefail
          node config/scripts/run-linux-packaged-terminal-floor-smoke.mjs --app-dir private-package 2>&1 | tee receipts/qualification.log
      - name: Record remaining diagnostic containers
        if: always()
        run: docker ps -a --filter name=orca-terminal-floor- --format '{{json .}}' > receipts/remaining-containers.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-terminal-floor-${{ matrix.arch }}
          retention-days: 7
          path: config/bun-conpty-build/linux-floor/receipts
