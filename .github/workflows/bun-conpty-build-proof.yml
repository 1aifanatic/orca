name: Bundled ConPTY Bun build proof
on:
  push:
    branches: [OrcaWin/np-bun-conpty-build-proof]
permissions:
  contents: read
concurrency:
  group: bun-conpty-build-proof
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      BUN_CONPTY_BUILD_ROOT: ${{ runner.temp }}/bun-conpty-build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Free unused SDK space on disposable runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          free -h
      - name: Compile isolated Windows runtime candidates
        run: bash config/bun-conpty-build/build-disposable.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-conpty-candidate
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/bun-conpty-build/bun/build/conpty-*/bun.exe
            ${{ runner.temp }}/bun-conpty-build/bun/build/conpty-*/build.ninja
