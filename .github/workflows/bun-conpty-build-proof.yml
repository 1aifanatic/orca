name: Bundled ConPTY native Windows runtime retention qualification
on:
  push:
    branches: [OrcaWin/np-bun-conpty-build-proof]
permissions:
  contents: read
  actions: read
concurrency:
  group: bun-conpty-build-proof
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            sourceRun: 36379211508
            candidateDir: conpty-x64
            providerDir: conpty-x64
            sha256: e1704a213d9e1634920d5b7d97b9d97f637b232059fb152a0f0bd48930ad463e
          - os: windows-11-arm
            arch: arm64
            sourceRun: 36380797727
            candidateDir: conpty-aarch64
            providerDir: conpty
            sha256: 9ca4184dd4e4dc7f9575075ab4ce6b00fb1feac59110d68c660177c5447ad526
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: config/bun-conpty-build
      - uses: actions/download-artifact@v4
        with:
          name: bun-conpty-candidate
          run-id: ${{ matrix.sourceRun }}
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: bun-conpty-${{ matrix.arch }}-qualification
          run-id: 36391706570
          github-token: ${{ github.token }}
          path: qualified-package
      - name: Exercise actual runtime retention with qualified native artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force receipts | Out-Null
          $runtime = (Resolve-Path 'candidate/${{ matrix.candidateDir }}/bun.exe').Path
          if ((Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ matrix.sha256 }}') { throw 'Candidate runtime hash mismatch' }
          $qualified = (Resolve-Path qualified-package).Path
          $addon = Join-Path $qualified 'config/bun-conpty-build/full-preflight/project/.build/windows-process-tree/${{ matrix.arch }}/windows-process-tree.node'
          $manifest = Get-Content (Join-Path $qualified 'receipts/full-artifact-manifest.json') -Raw | ConvertFrom-Json
          $addonHash = (Get-FileHash $addon -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($addonHash -ne $manifest.manifest.'windows-process-tree.node') { throw 'Qualified addon hash mismatch' }
          $fixture = (Resolve-Path 'config/bun-conpty-build/runtime-retention').Path
          Copy-Item $addon (Join-Path $fixture 'windows-process-tree.node')
          $env:BUN_CONPTY_LIBRARY = (Resolve-Path 'config/bun-conpty-build/arm64-qualification/${{ matrix.providerDir }}/conpty.dll').Path
          @{ runtimeSha256 = '${{ matrix.sha256 }}'; addonSha256 = $addonHash; addonRun = 36391706570; arch = '${{ matrix.arch }}' } | ConvertTo-Json | Set-Content receipts/retention-inputs.json
          & $runtime test (Join-Path $fixture 'retention-native.test.mjs') --timeout 60000 2>&1 | Tee-Object -FilePath receipts/retention.log
          if ($LASTEXITCODE -ne 0) { throw 'Native retention qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-retention-${{ matrix.arch }}
          retention-days: 7
          path: receipts
