name: Mobile Shell Fingerprint

# Informative, never failing: does this change need a mobile store release, or does OTA deliver it?
# See docs/reference/mobile-shell-fingerprint.md.
#
# Why these paths: every module in the four shell bundles comes from mobile/ or src/shared/, and
# no mobile source outside tests and scripts imports any other part of the repo. The root lockfile
# and config/patches never reach the shell: mobile is its own pnpm project, and no bundle module
# resolves from the root node_modules. Goldens, tests and docs never enter a bundle.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths: &shell-paths
      - 'mobile/**'
      - 'src/shared/**'
      - '.github/workflows/mobile-shell-fingerprint.yml'
      - '!mobile/rpc-foundation/**'
      - '!mobile/**/*.test.*'
      - '!src/shared/**/*.test.*'
      - '!mobile/**/*.md'
  push:
    branches:
      - main
    paths: *shell-paths

concurrency:
  group: mobile-shell-fingerprint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-fingerprint:
    name: Mobile shell fingerprint
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # A PR checks out its merge commit; HEAD^1 is the base it merges into.
          fetch-depth: 2

      - uses: ./.github/actions/install-node-dependencies
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Fingerprint this commit
        id: head
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node mobile/scripts/mobile-shell-fingerprint.mjs compute --out "$RUNNER_TEMP/shell-head.json"

      # Why HEAD^1 and not pull_request.base.sha: the event's base can lag the merge commit, which
      # would blame commits already on main on this PR. On main the base is the newest
      # mobile-android-v* tag by version: that is the tag the Android release workflow cuts when it
      # publishes an APK, and it lives on a side branch, so ancestry cannot find it.
      - name: Resolve comparison base
        id: base
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(git ls-remote --tags --refs origin 'refs/tags/mobile-android-v*' \
            | sed 's#.*refs/tags/##' | sort -V | tail -n 1)"
          test -n "$tag"
          git fetch --no-tags --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "refs/tags/$tag^{commit}")" >> "$GITHUB_OUTPUT"

      # The base gets its own frozen install: reusing this commit's node_modules would fingerprint
      # the base with the head's dependencies, and dependency bumps are what most need a verdict.
      - name: Fingerprint the base
        id: base-fingerprint
        if: steps.base.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/shell-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/shell-base/mobile" && pnpm install --frozen-lockfile)
          node mobile/scripts/mobile-shell-fingerprint.mjs compute \
            --project "$RUNNER_TEMP/shell-base/mobile" --out "$RUNNER_TEMP/shell-base.json"

      - name: Report the verdict
        id: verdict
        if: always()
        shell: bash
        env:
          SINCE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          script=mobile/scripts/mobile-shell-fingerprint.mjs
          since=()
          if [ -n "$SINCE_TAG" ]; then since=(--since "$SINCE_TAG"); fi
          node "$script" compare "$RUNNER_TEMP/shell-base.json" "$RUNNER_TEMP/shell-head.json" \
            "${since[@]}" >> "$GITHUB_STEP_SUMMARY"
          changed="$(node "$script" compare "$RUNNER_TEMP/shell-base.json" \
            "$RUNNER_TEMP/shell-head.json" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).changed')"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Forks get a read-only token; an unknown verdict leaves the label as it was.
      - name: Label the pull request
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (steps.verdict.outputs.changed == 'true' || steps.verdict.outputs.changed == 'false')
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.verdict.outputs.changed }}
          PR_LABELS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels
        run: |
          set -euo pipefail
          if [ "$CHANGED" = true ]; then
            gh api -X POST "$PR_LABELS_URL" -f 'labels[]=needs-mobile-release' > /dev/null
          elif ! gh api -X DELETE "$PR_LABELS_URL/needs-mobile-release" > /dev/null 2>&1; then
            echo 'needs-mobile-release not removed: absent or not permitted'
          fi
