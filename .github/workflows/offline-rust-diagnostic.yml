name: Diagnostic offline Rust installation
on:
  push:
    branches: [OrcaWin/np-offline-rust-diagnostic]
    paths: ['.github/workflows/offline-rust-diagnostic.yml', 'config/ci/offline-rust-probe/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-offline-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare bounded verified inputs
        run: python3 config/ci/offline-rust-probe/prepare.py "$RUNNER_TEMP/orca-rust-context"
      - name: Install retained toolchain without network
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orca-rust-receipts"
          cp "$RUNNER_TEMP/orca-rust-context/inputs.json" "$RUNNER_TEMP/orca-rust-receipts/inputs.json"
          cp "$RUNNER_TEMP/orca-rust-context/channel-rust-nightly.toml" "$RUNNER_TEMP/orca-rust-receipts/"
          docker build --platform linux/amd64 --progress plain --tag orca-offline-rust:diagnostic "$RUNNER_TEMP/orca-rust-context" 2>&1 | tee "$RUNNER_TEMP/orca-rust-receipts/build.log"
          docker image inspect orca-offline-rust:diagnostic > "$RUNNER_TEMP/orca-rust-receipts/image.json"
          docker run --rm --network none --cpus 2 --memory 3g --pids-limit 128 --volume "$RUNNER_TEMP/orca-rust-receipts:/receipts" orca-offline-rust:diagnostic
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-rust-installation-diagnostic
          path: ${{ runner.temp }}/orca-rust-receipts/
          retention-days: 7
