name: Mobile RPC Recording Replay

# Why its own workflow: the mobile RPC recordings import ~500 modules under src/shared, and the
# host params check reads the RPC contract there, so a desktop-only change can move a golden.
# Adding these paths to Mobile Checks would run its whole `verify` job (Ruby, typechecks, lint) on
# every shared-module edit; this replays only the suites that read the goldens, so the desktop
# author re-records in their own pull request instead of turning main red.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'src/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mobile-recording-replay.yml'

concurrency:
  group: mobile-recording-replay-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay mobile RPC recordings
    runs-on: ubuntu-24.04-arm

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      # A pull request that touches mobile/ already runs the full suite in Mobile Checks.
      # No `| grep -q`: under the runner's pipefail, grep exiting early SIGPIPEs a long diff and
      # the condition reads false. A git error also reads false, so the replay still runs.
      - name: Detect a mobile change
        id: scope
        shell: bash
        working-directory: .
        run: |
          if mobile_changes=$(git diff --name-only --no-renames HEAD^1 HEAD -- mobile/) && [ -n "$mobile_changes" ]; then
            echo 'covered=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/install-node-dependencies
        if: steps.scope.outputs.covered != 'true'
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.scope.outputs.covered != 'true'
        run: pnpm install --frozen-lockfile

      - name: Replay the recordings
        if: steps.scope.outputs.covered != 'true'
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
        run: pnpm test src/test-support/rpc-recording src/test-support/bridged-parity
