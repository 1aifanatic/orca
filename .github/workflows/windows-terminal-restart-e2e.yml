name: Linux issue 21489 series verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to check out
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-terminal-restart-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-terminal-restart:
    name: Linux editor, PTY ownership, and host retirement
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_BACKGROUND_LAUNCH: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Why: pnpm must exist before setup-node resolves its dependency cache.
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron app for Linux E2E
        run: pnpm exec electron-vite build --mode e2e

      - name: Build CLI for separate host removal
        run: pnpm run build:cli

      - name: Run Linux combined ownership regressions
        env:
          SKIP_BUILD: '1'
          ORCA_E2E_FORWARD_APP_LOGS: '1'
        # Why: pnpm forwards a literal `--` to Playwright, which makes the
        # grep and worker flags positional filters instead of CLI options.
        run: >-
          xvfb-run -a pnpm run test:e2e
          tests/e2e/golden-file-open-edit-save.spec.ts
          tests/e2e/live-background-terminal-mount-authority.spec.ts
          tests/e2e/removed-runtime-session-archive.spec.ts
          --project electron-headless
          --workers=1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-terminal-restart-playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
