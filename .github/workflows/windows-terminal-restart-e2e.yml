name: Issue 21489 shard 2 diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    name: Shard 2 ${{ matrix.label }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            revision: 3fb72d135de28d61c0bbbda7bb3a40be363a7cae
          - label: candidate
            revision: ${{ github.sha }}
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_BALANCE_UNIT_SHARDS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      - run: node config/scripts/install-electron-package-binary.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/bun-version
      - name: Record resources and run exact shard
        shell: bash
        run: |
          mkdir -p ci-shards
          (
            while true; do
              date -u
              free -m
              ps -eo pid,ppid,rss,comm --sort=-rss | head -n 12
              for item in memory.current memory.max memory.events; do
                if [ -r "/sys/fs/cgroup/$item" ]; then cat "/sys/fs/cgroup/$item"; fi
              done
              sleep 10
            done
          ) > >(tee ci-shards/resources.log) 2>&1 &
          resource_monitor=$!
          trap 'kill "$resource_monitor" 2>/dev/null || true' EXIT
          export ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          node config/scripts/run-vitest.mjs run --config config/vitest.config.ts --shard=2/5 --maxWorkers=4
      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shard2-${{ matrix.label }}
          path: ci-shards/
          retention-days: 7
