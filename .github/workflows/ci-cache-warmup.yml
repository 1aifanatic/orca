name: Cache lookup access comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
  CACHE_KEY: ci-lookup-access-trial-${{ github.run_id }}
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write a private marker
        run: printf '%s\n' "$CACHE_KEY" > "$RUNNER_TEMP/cache-lookup-marker"
      - uses: actions/cache/save@v5
        with:
          key: ${{ env.CACHE_KEY }}
          path: ${{ runner.temp }}/cache-lookup-marker
  lookup:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read access metadata before lookup
        run: node config/scripts/ci-cache-lookup-access-trial.mjs before
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache@v5
        id: cache
        with:
          key: ${{ env.CACHE_KEY }}
          path: ${{ runner.temp }}/cache-lookup-marker
          lookup-only: true
      - name: Verify lookup refreshed access without restoring bytes
        run: node config/scripts/ci-cache-lookup-access-trial.mjs after
        env:
          LOOKUP_HIT: ${{ steps.cache.outputs.cache-hit }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cache-lookup-access
          path: ${{ runner.temp }}/cache-lookup-access/
          if-no-files-found: error
  cold-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache@v5
        id: cache
        with:
          key: ${{ env.CACHE_KEY }}-cold
          path: ${{ runner.temp }}/cache-lookup-marker
          lookup-only: true
      - name: Populate a missing cache after lookup
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != true
          printf '%s\n' "$CACHE_KEY-cold" > "$RUNNER_TEMP/cache-lookup-marker"
  cold-reader:
    needs: cold-writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/cache/restore@v5
        id: cache
        with:
          key: ${{ env.CACHE_KEY }}-cold
          path: ${{ runner.temp }}/cache-lookup-marker
      - name: Verify the lookup writer saved its new cache after the job
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat "$RUNNER_TEMP/cache-lookup-marker")" = "$CACHE_KEY-cold"
