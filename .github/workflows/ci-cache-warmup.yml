name: Terminal preparation comparison
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: ./.github/actions/install-node-dependencies
      with:
        cache-pnpm-store: 'false'
        cache-pnpm-verification: 'false'
    - name: Compile the process wrapper before deleting dependencies
      shell: bash
      run: 'node --input-type=module <<''NODE''

        import {build} from ''esbuild'';

        import {join} from ''node:path'';

        await build({entryPoints:[''src/shared/child-process/run-process.ts''],outfile:join(process.env.RUNNER_TEMP,''producer-trial-process.mjs''),bundle:true,platform:''node'',format:''esm''});

        NODE'
    - name: Reset inputs 1
      id: reset1
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs reset
    - name: Start legacy
      id: start1
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs start
    - uses: pnpm/setup@v2
      with:
        install: false
    - id: install1
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm
        package-manager-cache: false
    - name: Use the original external gyp and raw lifecycle install
      shell: bash
      run: 'npm install -g node-gyp@11.5.0

        npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"

        export npm_config_node_gyp

        pnpm install --frozen-lockfile'
    - name: Finish and validate legacy
      shell: bash
      env:
        STARTED: ${{ steps.start1.outputs.started }}
        TREATMENT: legacy
        CACHE_HIT: ${{ steps.install1.outputs.cache-hit }}
        NATIVE_HIT: not-applicable
      run: node config/scripts/ci-terminal-preparation-trial.mjs finish
    - name: Reset inputs 2
      id: reset2
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs reset
    - name: Start shared
      id: start2
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs start
    - id: install2
      uses: ./.github/actions/install-node-dependencies
      with:
        native-runtime: electron
        cache-electron-package: 'true'
    - name: Finish and validate shared
      shell: bash
      env:
        STARTED: ${{ steps.start2.outputs.started }}
        TREATMENT: shared
        CACHE_HIT: ${{ steps.install2.outputs.pnpm-store-cache-hit }}
        NATIVE_HIT: ${{ steps.install2.outputs.native-cache-hit }}
      run: node config/scripts/ci-terminal-preparation-trial.mjs finish
    - name: Compile the same Electron application
      shell: bash
      run: pnpm exec electron-vite build --mode e2e
    - uses: actions/upload-artifact@v7
      with:
        name: terminal-preparation-legacy
        path: ${{ runner.temp }}/terminal-preparation-comparison
        retention-days: 7
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: ./.github/actions/install-node-dependencies
      with:
        cache-pnpm-store: 'false'
        cache-pnpm-verification: 'false'
    - name: Compile the process wrapper before deleting dependencies
      shell: bash
      run: 'node --input-type=module <<''NODE''

        import {build} from ''esbuild'';

        import {join} from ''node:path'';

        await build({entryPoints:[''src/shared/child-process/run-process.ts''],outfile:join(process.env.RUNNER_TEMP,''producer-trial-process.mjs''),bundle:true,platform:''node'',format:''esm''});

        NODE'
    - name: Reset inputs 1
      id: reset1
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs reset
    - name: Start shared
      id: start1
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs start
    - id: install1
      uses: ./.github/actions/install-node-dependencies
      with:
        native-runtime: electron
        cache-electron-package: 'true'
    - name: Finish and validate shared
      shell: bash
      env:
        STARTED: ${{ steps.start1.outputs.started }}
        TREATMENT: shared
        CACHE_HIT: ${{ steps.install1.outputs.pnpm-store-cache-hit }}
        NATIVE_HIT: ${{ steps.install1.outputs.native-cache-hit }}
      run: node config/scripts/ci-terminal-preparation-trial.mjs finish
    - name: Reset inputs 2
      id: reset2
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs reset
    - name: Start legacy
      id: start2
      shell: bash
      run: node config/scripts/ci-terminal-preparation-trial.mjs start
    - uses: pnpm/setup@v2
      with:
        install: false
    - id: install2
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        cache: pnpm
        package-manager-cache: false
    - name: Use the original external gyp and raw lifecycle install
      shell: bash
      run: 'npm install -g node-gyp@11.5.0

        npm_config_node_gyp="$(npm root -g)/node-gyp/bin/node-gyp.js"

        export npm_config_node_gyp

        pnpm install --frozen-lockfile'
    - name: Finish and validate legacy
      shell: bash
      env:
        STARTED: ${{ steps.start2.outputs.started }}
        TREATMENT: legacy
        CACHE_HIT: ${{ steps.install2.outputs.cache-hit }}
        NATIVE_HIT: not-applicable
      run: node config/scripts/ci-terminal-preparation-trial.mjs finish
    - name: Compile the same Electron application
      shell: bash
      run: pnpm exec electron-vite build --mode e2e
    - uses: actions/upload-artifact@v7
      with:
        name: terminal-preparation-shared
        path: ${{ runner.temp }}/terminal-preparation-comparison
        retention-days: 7
