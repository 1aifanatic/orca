name: Direct composite archive cleanup path control
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: ./.github/actions/ci-store-producer-trial
  reader:
    needs: writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: bad
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/bad-marker
          key: ci-electron-path-bad-${{ github.run_id }}-${{ github.run_attempt }}
      - id: good
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/good-marker
          key: ci-electron-path-good-${{ github.run_id }}-${{ github.run_attempt }}
      - shell: bash
        env:
          BAD_HIT: ${{ steps.bad.outputs.cache-hit }}
          GOOD_HIT: ${{ steps.good.outputs.cache-hit }}
        run: |
          printf 'Direct output-path cache hit=%s\n' "$BAD_HIT"
          if [ "$BAD_HIT" = true ]; then
            test "$(cat "$RUNNER_TEMP/bad-marker/marker")" = 'archive cleanup payload'
          else
            test ! -e "$RUNNER_TEMP/bad-marker/marker"
          fi
          test "$GOOD_HIT" = true
          test "$(cat "$RUNNER_TEMP/good-marker/marker")" = 'archive cleanup payload'
