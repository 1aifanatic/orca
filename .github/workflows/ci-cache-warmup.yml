name: Automatic store publisher qualification
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            config/patches
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Prepare a small isolated lockfile with the same policies
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const original=JSON.parse(readFileSync('package.json','utf8'));
          writeFileSync('package.json',JSON.stringify({name:'auto-store-cold-control',version:'1.0.0',engines:original.engines,packageManager:original.packageManager,dependencies:{'is-number':'7.0.0'}}));
          const workspace=readFileSync('pnpm-workspace.yaml','utf8');
          writeFileSync('pnpm-workspace.yaml','packages: []\n'+workspace.slice(workspace.indexOf('minimumReleaseAge:'),workspace.indexOf('patchedDependencies:')));
          NODE
          rm pnpm-lock.yaml
          pnpm install --ignore-scripts
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          writeFileSync('pnpm-lock.yaml',readFileSync('pnpm-lock.yaml','utf8').replace(/^---\n/,`---\n# cold control ${process.env.GITHUB_RUN_ID}/${process.env.GITHUB_RUN_ATTEMPT}\n`));
          NODE
          git -c user.name='CI fixture' -c user.email='ci-fixture@example.invalid' add package.json pnpm-lock.yaml pnpm-workspace.yaml
          git -c user.name='CI fixture' -c user.email='ci-fixture@example.invalid' -c core.hooksPath=/dev/null commit -m 'Freeze isolated installer fixture'
      - name: Reset the store before the cold lookup
        shell: bash
        run: |
          store="$(pnpm store path --silent)"
          case "$store" in "$HOME"/*/store/v11) rm -rf "$store" ;; *) exit 2 ;; esac
          rm -rf node_modules
      - id: actual
        uses: ./.github/actions/ci-auto-store-nested
      - name: Require a real cold install
        shell: bash
        env:
          CACHE_HIT: ${{ steps.actual.outputs.hit }}
        run: |
          test "$CACHE_HIT" = false
          node -e 'if (!require("is-number")(12)) process.exit(1)'
      - uses: actions/upload-artifact@v7
        with:
          name: auto-store-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          retention-days: 7
  reader:
    needs: writer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - uses: actions/download-artifact@v8
        with:
          name: auto-store-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: pnpm/setup@v2
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - id: scope
        shell: bash
        run: |
          printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          printf 'arch=%s\n' "$(node -p 'require("node:os").arch()')" >> "$GITHUB_OUTPUT"
      - id: recovered
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.scope.outputs.path }}
          key: node-cache-Linux-${{ steps.scope.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Require the nested post-job save
        shell: bash
        env:
          CACHE_HIT: ${{ steps.recovered.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          pnpm install --frozen-lockfile --ignore-scripts
          node -e 'if (!require("is-number")(12)) process.exit(1)'
