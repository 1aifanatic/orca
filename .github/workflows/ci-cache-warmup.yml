name: Alpine verification record comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpine-verification-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
        replicate: [1, 2, 3]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      REPLICATE: ${{ matrix.replicate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare identical toolchains and isolated input files
        shell: bash
        run: |
          trial_root="$RUNNER_TEMP/verification-comparison"
          mkdir -p "$trial_root/fixture/native/windows-registry" "$trial_root/fixture/config" "$trial_root/results/baseline" "$trial_root/results/cached"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$trial_root/fixture/"
          cp native/windows-registry/package.json "$trial_root/fixture/native/windows-registry/"
          cp -R config/patches "$trial_root/fixture/config/"
          if [ -f .npmrc ]; then cp .npmrc "$trial_root/fixture/"; fi
          cat > "$trial_root/Dockerfile" <<'DOCKERFILE'
          FROM node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          ARG PNPM_SPEC
          RUN apk add --no-cache bash git libstdc++ python3 make g++ && npm install -g "$PNPM_SPEC"
          DOCKERFILE
          docker build --build-arg "PNPM_SPEC=$(node -p "require('./package.json').packageManager.split('+')[0]")" -t orca-verification-trial "$trial_root"
          cat > "$trial_root/run-comparison.sh" <<'SCRIPT'
          set -euo pipefail
          trial_root="$RUNNER_TEMP/verification-comparison"
          export TRIAL_RESULTS="$trial_root/results/$POLICY"
          export TRIAL_START="$trial_root/$POLICY-start"
          if [ "$POLICY" = baseline ]; then
            node -e 'require("node:fs").writeFileSync(process.env.TRIAL_START, process.hrtime.bigint().toString())'
          fi
          docker_args=(run --rm -i -e ORCA_BACKGROUND_LAUNCH=1 -v "$trial_root/fixture:/input:ro" -v "$TRIAL_RESULTS:/results")
          if [ "$POLICY" = cached ]; then
            test "$CACHE_HIT" = true
            test -s "$CACHE_DIRECTORY/lockfile-verified.jsonl"
            docker_args+=(-v "$CACHE_DIRECTORY:/root/.cache/pnpm")
          fi
          docker "${docker_args[@]}" orca-verification-trial sh -s <<'CONTAINER'
          set -eu
          mkdir /project
          cp -R /input/. /project/
          cd /project
          sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml > /results/manifests-before.sha
          pnpm install --frozen-lockfile --ignore-scripts > /results/install.log 2>&1
          sha256sum package.json pnpm-lock.yaml pnpm-workspace.yaml > /results/manifests-after.sha
          cmp /results/manifests-before.sha /results/manifests-after.sha
          node --version > /results/node-version.txt
          pnpm --version > /results/pnpm-version.txt
          CONTAINER
          node --input-type=module <<'MEASURE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const elapsedMs=Number(process.hrtime.bigint()-BigInt(readFileSync(process.env.TRIAL_START,'utf8')))/1e6
          const root=process.env.TRIAL_RESULTS
          const log=readFileSync(`${root}/install.log`,'utf8')
          assert.match(log,/Lockfile passes supply-chain policies/)
          if(process.env.POLICY==='cached') assert.match(log,/policies \(verified /)
          else assert.match(log,/entries in /)
          const result={policy:process.env.POLICY,replicate:process.env.REPLICATE,elapsedMs,cacheHit:process.env.CACHE_HIT??null,node:readFileSync(`${root}/node-version.txt`,'utf8').trim(),pnpm:readFileSync(`${root}/pnpm-version.txt`,'utf8').trim(),runner:process.env.RUNNER_ARCH,image:process.env.ImageVersion}
          writeFileSync(`${root}/measurement.json`,JSON.stringify(result,null,2))
          console.log(JSON.stringify(result))
          MEASURE
          SCRIPT
      - name: Baseline first
        if: matrix.replicate != 2
        env:
          POLICY: baseline
        run: bash "$RUNNER_TEMP/verification-comparison/run-comparison.sh"
      - name: Start the cached interval
        run: node -e 'require("node:fs").writeFileSync(require("node:path").join(process.env.RUNNER_TEMP,"verification-comparison","cached-start"), process.hrtime.bigint().toString())'
      - uses: pnpm/setup@v2
        with:
          install: false
      - name: Resolve the existing main cache identity
        id: identity
        env:
          POLICY_HASH: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc') }}
        run: |
          cache_directory="$(pnpm cache path)"
          {
            printf 'directory=%s\n' "$cache_directory"
            printf 'path=%s/lockfile-verified.jsonl\n' "$cache_directory"
            printf 'key=pnpm-verification-v1-%s-%s-%s-%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$(pnpm --version)" "$POLICY_HASH"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: restore
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}
      - name: Cached verification
        env:
          POLICY: cached
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_DIRECTORY: ${{ steps.identity.outputs.directory }}
        run: bash "$RUNNER_TEMP/verification-comparison/run-comparison.sh"
      - name: Baseline second
        if: matrix.replicate == 2
        env:
          POLICY: baseline
        run: bash "$RUNNER_TEMP/verification-comparison/run-comparison.sh"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpine-verification-${{ matrix.runner }}-${{ matrix.replicate }}
          path: ${{ runner.temp }}/verification-comparison/results
          retention-days: 7
