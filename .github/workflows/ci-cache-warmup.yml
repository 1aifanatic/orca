name: Headless detector comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headless-detector-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        treatment: [baseline, candidate]
        path: [forced, graph]
        replicate: [1, 2, 3]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare the changed-file evidence
        env:
          CASE: ${{ matrix.path }}
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync("detector-changes", (process.env.CASE === "forced" ? "package.json" : "src/main/menu/register-app-menu.ts") + "\0")'
      - name: Start the measured interval
        run: node -e 'require("node:fs").writeFileSync("detector-start", process.hrtime.bigint().toString())'
      - uses: actions/setup-node@v6
        if: matrix.treatment == 'candidate'
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Probe before installation
        id: scope
        if: matrix.treatment == 'candidate'
        run: |
          test ! -d node_modules
          node config/scripts/node-server-change-scope.mjs detector-changes --defer-graph --full-qualification
          cp "$GITHUB_OUTPUT" detector-output
      - uses: ./.github/actions/install-node-dependencies
        if: matrix.treatment == 'baseline' || steps.scope.outputs.graph_required == 'true'
      - name: Run installed analysis
        if: matrix.treatment == 'baseline' || steps.scope.outputs.graph_required == 'true'
        env:
          TREATMENT: ${{ matrix.treatment }}
        run: |
          if [ "$TREATMENT" = baseline ]; then
            node config/scripts/node-server-change-scope.baseline.mjs detector-changes --full-qualification
          else
            node config/scripts/node-server-change-scope.mjs detector-changes --full-qualification
          fi
          cp "$GITHUB_OUTPUT" detector-output
      - name: Stop timing and check the verdict
        env:
          CASE: ${{ matrix.path }}
          TREATMENT: ${{ matrix.treatment }}
          REPLICATE: ${{ matrix.replicate }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const elapsedMs = Number(process.hrtime.bigint() - BigInt(readFileSync('detector-start', 'utf8'))) / 1e6
          const fields = Object.fromEntries(readFileSync('detector-output', 'utf8').trim().split('\n').map(line => {
            const boundary = line.indexOf('=')
            return [line.slice(0, boundary), line.slice(boundary + 1)]
          }))
          assert.equal(fields.should_run, process.env.CASE === 'forced' ? 'true' : 'false')
          assert.equal(fields.qualification, 'true')
          assert.deepEqual(JSON.parse(fields.runners), ['ubuntu-22.04', 'ubuntu-24.04-arm', 'macos-14', 'macos-15-intel', 'windows-2022', 'windows-11-arm'])
          const result = { treatment: process.env.TREATMENT, path: process.env.CASE, replicate: process.env.REPLICATE, elapsedMs, fields, node: process.version, image: process.env.ImageVersion }
          writeFileSync('detector-measurement.json', JSON.stringify(result, null, 2))
          console.log(JSON.stringify(result))
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: detector-${{ matrix.treatment }}-${{ matrix.path }}-${{ matrix.replicate }}
          path: detector-measurement.json
          retention-days: 7
