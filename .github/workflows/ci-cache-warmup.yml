name: Store producer installation comparison
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  cold-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-store-producer-outer
  cold-reader:
    needs: cold-writer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: restored
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/nested-producer-marker
          key: ci-store-producer-nested-${{ github.run_id }}-${{ github.run_attempt }}
      - shell: bash
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          test "$(cat "$RUNNER_TEMP/nested-producer-marker/marker")" = 'nested producer payload'
  compare:
    name: ${{ matrix.os }} full installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            native: node
            first: cached
          - os: ubuntu-24.04-arm
            native: node
            first: lookup
          - os: windows-2022
            native: node
            first: cached
          - os: windows-11-arm
            native: node
            first: lookup
          - os: macos-15-intel
            native: none
            first: cached
          - os: macos-15
            native: none
            first: lookup
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ matrix.native }}
          cache-pnpm-store: 'false'
      - name: Prepare subprocess wrapper outside measurements
        run: |
          node --input-type=module <<'NODE'
          import {build} from 'esbuild';
          import {join} from 'node:path';
          await build({stdin:{contents:'export {runProcessSync} from "./src/shared/child-process/run-process.ts"',resolveDir:process.cwd()},bundle:true,platform:'node',format:'esm',outfile:join(process.env.RUNNER_TEMP,'producer-trial-process.mjs'),logLevel:'silent'});
          NODE
      - name: Reset first treatment
        env:
          TREATMENT: ${{ matrix.first }}
        run: node config/scripts/ci-store-producer-trial.mjs reset
      - id: first-start
        name: Start first measurement
        run: node config/scripts/ci-store-producer-trial.mjs start
      - id: first-install
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ matrix.native }}
          cache-pnpm-store-lookup-only: ${{ matrix.first == 'lookup' }}
      - name: Verify first result
        env:
          TREATMENT: ${{ matrix.first }}
          STARTED: ${{ steps.first-start.outputs.started }}
          CACHE_HIT: ${{ steps.first-install.outputs.pnpm-store-cache-hit }}
          NATIVE: ${{ matrix.native }}
          NATIVE_HIT: ${{ steps.first-install.outputs.native-cache-hit }}
        run: node config/scripts/ci-store-producer-trial.mjs finish
      - name: Reset second treatment
        env:
          TREATMENT: ${{ matrix.first == 'cached' && 'lookup' || 'cached' }}
        run: node config/scripts/ci-store-producer-trial.mjs reset
      - id: second-start
        name: Start second measurement
        run: node config/scripts/ci-store-producer-trial.mjs start
      - id: second-install
        uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ matrix.native }}
          cache-pnpm-store-lookup-only: ${{ matrix.first == 'cached' }}
      - name: Verify second result
        env:
          TREATMENT: ${{ matrix.first == 'cached' && 'lookup' || 'cached' }}
          STARTED: ${{ steps.second-start.outputs.started }}
          CACHE_HIT: ${{ steps.second-install.outputs.pnpm-store-cache-hit }}
          NATIVE: ${{ matrix.native }}
          NATIVE_HIT: ${{ steps.second-install.outputs.native-cache-hit }}
        run: node config/scripts/ci-store-producer-trial.mjs finish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: producer-install-${{ matrix.os }}
          path: ${{ runner.temp }}/producer-install-comparison/
          if-no-files-found: error
          retention-days: 7
