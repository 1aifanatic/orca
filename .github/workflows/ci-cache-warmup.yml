name: Linux root dependency store comparison
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: linux-root-store-trial-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  compare:
    name: ${{ matrix.os }} root store sample ${{ matrix.sample }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
        sample:
          - 1
          - 2
          - 3
    env:
      SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - name: Prepare the existing process wrapper outside measurement
        run: |-
          node --input-type=module <<'NODE'
          import { build } from 'esbuild'
          import { join } from 'node:path'
          await build({ stdin: { contents: 'export { runProcessSync } from "./src/shared/child-process/run-process.ts"', resolveDir: process.cwd() }, bundle: true, platform: 'node', format: 'esm', outfile: join(process.env.RUNNER_TEMP, 'linux-store-process.mjs'), logLevel: 'silent' })
          NODE
      - name: Start with a fresh dependency tree
        id: first-reset
        run: node config/scripts/ci-linux-root-store-trial.mjs reset
        env:
          TREATMENT: cached
      - uses: ./.github/actions/restore-pnpm-verification
      - name: Start first registry measurement
        id: first-registry-start
        if: matrix.sample == 2
        run: node config/scripts/ci-linux-root-store-trial.mjs start
        env:
          TREATMENT: registry
      - name: Install from registry first
        if: matrix.sample == 2
        env:
          TREATMENT: registry
          STARTED: ${{ steps.first-registry-start.outputs.started }}
        run: node config/scripts/ci-linux-root-store-trial.mjs measure
      - name: Reset after first registry measurement
        if: matrix.sample == 2
        run: node config/scripts/ci-linux-root-store-trial.mjs reset
        env:
          TREATMENT: cached
      - uses: ./.github/actions/restore-pnpm-verification
        if: matrix.sample == 2
      - name: Start cached measurement
        id: cached-start
        run: node config/scripts/ci-linux-root-store-trial.mjs start
        env:
          TREATMENT: cached
      - name: Restore the actual root store
        id: store-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.first-reset.outputs.store }}
          key: node-cache-Linux-${{ steps.first-reset.outputs.arch }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install from restored store
        env:
          TREATMENT: cached
          STARTED: ${{ steps.cached-start.outputs.started }}
          CACHE_HIT: ${{ steps.store-cache.outputs.cache-hit }}
        run: node config/scripts/ci-linux-root-store-trial.mjs measure
      - name: Reset after cached measurement
        if: matrix.sample != 2
        run: node config/scripts/ci-linux-root-store-trial.mjs reset
        env:
          TREATMENT: registry
      - uses: ./.github/actions/restore-pnpm-verification
        if: matrix.sample != 2
      - name: Start second registry measurement
        id: second-registry-start
        if: matrix.sample != 2
        run: node config/scripts/ci-linux-root-store-trial.mjs start
        env:
          TREATMENT: registry
      - name: Install from registry second
        if: matrix.sample != 2
        env:
          TREATMENT: registry
          STARTED: ${{ steps.second-registry-start.outputs.started }}
        run: node config/scripts/ci-linux-root-store-trial.mjs measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-root-store-comparison-${{ matrix.os }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/linux-root-store-comparison/
          if-no-files-found: error
          retention-days: 7
