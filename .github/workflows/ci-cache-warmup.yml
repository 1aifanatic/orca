name: Hosted headless compiler helper validation
on:
  workflow_dispatch: null
permissions:
  contents: read
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.scope.outputs.digest }}
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - id: scope
        run: |-
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          import { collectNodeServerInputs } from './config/scripts/node-server-change-scope.mjs'
          const inputs = [...(await collectNodeServerInputs())].sort()
          const digest = createHash('sha256').update(JSON.stringify(inputs)).digest('hex')
          if (process.env.EXPECTED_DIGEST && (digest !== process.env.EXPECTED_DIGEST || String(inputs.length) !== process.env.EXPECTED_COUNT)) throw new Error('Compiler graph differs')
          appendFileSync(process.env.GITHUB_OUTPUT, 'digest=' + digest + '\ncount=' + inputs.length + '\n')
          console.log(JSON.stringify({ inputs: inputs.length, digest }))
          NODE
      - id: identity
        env:
          COMPILER_POLICY_HASH: ${{ hashFiles('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.npmrc', '.pnpmfile.cjs', 'config/patches/**', '.github/actions/install-node-dependencies/**', '.github/actions/restore-pnpm-verification/**', 'config/scripts/headless-detector-compiler-cache.mjs', '.github/actions/prepare-headless-compiler/action.yml') }}
        run: node config/scripts/headless-detector-compiler-cache.mjs identity
      - env:
          COMPILER_CACHE_KEY: ${{ steps.identity.outputs.key }}
          COMPILER_CACHE_PATH: ${{ steps.identity.outputs.path }}
        run: node config/scripts/headless-detector-compiler-cache.mjs pack
      - uses: actions/cache/save@v5
        with:
          path: ${{ steps.identity.outputs.path }}
          key: ${{ steps.identity.outputs.key }}
  restore:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - id: compiler
        uses: ./.github/actions/prepare-headless-compiler
      - name: Require a production-helper hit
        env:
          AVAILABLE: ${{ steps.compiler.outputs.available }}
        run: test "$AVAILABLE" = true
      - name: Compare the real graph
        env:
          EXPECTED_DIGEST: ${{ needs.seed.outputs.digest }}
          EXPECTED_COUNT: ${{ needs.seed.outputs.count }}
        run: |-
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { appendFileSync } from 'node:fs'
          import { collectNodeServerInputs } from './config/scripts/node-server-change-scope.mjs'
          const inputs = [...(await collectNodeServerInputs())].sort()
          const digest = createHash('sha256').update(JSON.stringify(inputs)).digest('hex')
          if (process.env.EXPECTED_DIGEST && (digest !== process.env.EXPECTED_DIGEST || String(inputs.length) !== process.env.EXPECTED_COUNT)) throw new Error('Compiler graph differs')
          appendFileSync(process.env.GITHUB_OUTPUT, 'digest=' + digest + '\ncount=' + inputs.length + '\n')
          console.log(JSON.stringify({ inputs: inputs.length, digest }))
          NODE
