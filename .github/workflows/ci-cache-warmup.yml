name: Headless detector minimal-tool comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headless-detector-tools-trial-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      - id: pack
        run: node config/scripts/headless-detector-tools-trial.mjs pack
      - uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/headless-detector-tools
          key: headless-detector-tools-trial-${{ github.run_id }}-${{ hashFiles('pnpm-lock.yaml') }}
  compare:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sample: [1, 2, 3]
    env:
      SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Reset before first treatment
        run: node config/scripts/headless-detector-tools-trial.mjs reset
      - id: baseline-first-start
        if: matrix.sample != 2
        run: node config/scripts/headless-detector-tools-trial.mjs start
      - uses: ./.github/actions/install-node-dependencies
        if: matrix.sample != 2
      - name: Measure baseline first
        if: matrix.sample != 2
        env:
          TREATMENT: baseline
          STARTED: ${{ steps.baseline-first-start.outputs.started }}
        run: node config/scripts/headless-detector-tools-trial.mjs measure
      - name: Reset before candidate
        if: matrix.sample != 2
        run: node config/scripts/headless-detector-tools-trial.mjs reset
      - id: candidate-start
        run: node config/scripts/headless-detector-tools-trial.mjs start
      - id: tool-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/headless-detector-tools
          key: headless-detector-tools-trial-${{ github.run_id }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Validate and activate only compiler packages
        env:
          TOOL_CACHE_HIT: ${{ steps.tool-cache.outputs.cache-hit }}
          EXPECTED_ESBUILD_VERSION: ${{ needs.seed.outputs.version }}
        run: node config/scripts/headless-detector-tools-trial.mjs activate
      - name: Measure candidate
        env:
          TREATMENT: candidate
          STARTED: ${{ steps.candidate-start.outputs.started }}
        run: node config/scripts/headless-detector-tools-trial.mjs measure
      - name: Reset before baseline
        if: matrix.sample == 2
        run: node config/scripts/headless-detector-tools-trial.mjs reset
      - id: baseline-second-start
        if: matrix.sample == 2
        run: node config/scripts/headless-detector-tools-trial.mjs start
      - uses: ./.github/actions/install-node-dependencies
        if: matrix.sample == 2
      - name: Measure baseline second
        if: matrix.sample == 2
        env:
          TREATMENT: baseline
          STARTED: ${{ steps.baseline-second-start.outputs.started }}
        run: node config/scripts/headless-detector-tools-trial.mjs measure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: headless-detector-tools-${{ matrix.sample }}
          path: ${{ runner.temp }}/headless-detector-comparison/
          if-no-files-found: error
          retention-days: 7
