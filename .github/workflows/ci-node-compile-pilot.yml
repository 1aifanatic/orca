name: Node compile cache pilot
on:
  push:
    branches: [nwparker/ci-next-optimizations]
    paths: ['.github/workflows/ci-node-compile-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: node-compile-pilot-${{ github.ref }}
  cancel-in-progress: true
env:
  ORCA_BACKGROUND_LAUNCH: '1'
jobs:
  measure:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [2, 4, 7]
        cache: ['off', 'on']
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24'
          cache-electron-package: 'true'
      - run: node config/scripts/install-electron-package-binary.mjs
      - name: Run complete shard with a fresh compile cache
        env:
          ORCA_BALANCE_UNIT_SHARDS: '1'
          CACHE_MODE: ${{ matrix.cache }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          unset NODE_COMPILE_CACHE NODE_DISABLE_COMPILE_CACHE
          if [ "$CACHE_MODE" = on ]; then
            export NODE_COMPILE_CACHE="$RUNNER_TEMP/node-compile-cache"
            test ! -e "$NODE_COMPILE_CACHE"
          fi
          export ORCA_SHARD_SOURCE_SHA="$(git rev-parse HEAD)"
          node -e 'console.log(JSON.stringify({node:process.version,cpus:require("node:os").availableParallelism(),compileCache:require("node:module").getCompileCacheDir()}))'
          start=$(date +%s)
          pnpm exec vitest run --config config/vitest.config.ts --shard="$SHARD/8"
          elapsed=$(($(date +%s)-start))
          echo "COMPILE_MEASUREMENT mode=$CACHE_MODE shard=$SHARD seconds=$elapsed"
          if [ "$CACHE_MODE" = on ]; then du -sk "$NODE_COMPILE_CACHE"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compile-${{ matrix.shard }}-${{ matrix.cache }}
          path: ci-shards/
          retention-days: 7
