name: Antigravity musl watcher diagnostic

on:
  push:
    branches: [ci-diagnostics/antigravity-musl-watch-1003]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-watcher:
    name: musl teardown / ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: original-head
            sha: 09169edd23e2a56ee66f4d3d7b07403f0b04c478
            tree: 21cf98150157fb26d72770a205b8f1f14cfec7a7
            lock: 44548eca1b765559e1e00786a876644f7b2317f63dca557721772b812beaecd0
            package_manager: pnpm@12.0.0+sha512.9e2e3dc3911995868dc94b8175c217c27e95408fa03b4a22749778f2b34f773b77cdd3b39ede8171b22fcd53be6a35342e9fac9948a68ef58df6488ce89a7e67
          - name: original-parent
            sha: 8ce5899dc0e82993027c2d2b352e0900c5db185b
            tree: 16047d40d0fcd9a9eb30bc0756285b0b5f657377
            lock: 44548eca1b765559e1e00786a876644f7b2317f63dca557721772b812beaecd0
            package_manager: pnpm@12.0.0+sha512.9e2e3dc3911995868dc94b8175c217c27e95408fa03b4a22749778f2b34f773b77cdd3b39ede8171b22fcd53be6a35342e9fac9948a68ef58df6488ce89a7e67
          - name: hosted-merge
            sha: 8a896cb91d11e3908cf997b33713aecf2df0a603
            tree: d8d5f5b3d10b05a35fbd6901a57df4d7741640ba
            lock: 3b50e687509eac4606bdc60cd890e4485862a4c5fcfca44317ac8802f5a849c1
            package_manager: pnpm@12.8.1+sha512.f64ba907507f5ceafe06c8d38e6052d0179444580ec1279ddd5bfc11cb48aa8a2644b66598e07e761da84872a9fc57d5f902b87fa49d024198d558612aabbe45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      DIAGNOSTIC_IMAGE: node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
      DIAGNOSTIC_NONCE: ag-musl-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      DIAGNOSTIC_DIR: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}
      HOME: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/home
      USERPROFILE: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/home
      APPDATA: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/config
      LOCALAPPDATA: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/config
      XDG_CONFIG_HOME: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/config
      XDG_CACHE_HOME: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/cache
      XDG_DATA_HOME: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/data
      XDG_STATE_HOME: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/state
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/runtime
      TMPDIR: ${{ github.workspace }}/.context/integration-recovery-1003/${{ matrix.name }}/host-private/temp
    steps:
      - name: Establish owned evidence and private host state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_DIR" "$HOME" "$APPDATA" "$XDG_CACHE_HOME" \
            "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR" "$TMPDIR" \
            "$DIAGNOSTIC_DIR/host-private/docker"
          printf '%s\n' "$DIAGNOSTIC_NONCE" > "$DIAGNOSTIC_DIR/owner"
          printf '%s\n' '{"status":"failed","nativeVerified":false,"reason":"diagnostic has not completed"}' > "$DIAGNOSTIC_DIR/final-status.json"
          printf '%s\n' '{"state":"unverifiable","reason":"container cleanup has not completed"}' > "$DIAGNOSTIC_DIR/cleanup.json"
          cat > "$DIAGNOSTIC_DIR/requested-identities.json" <<'IDENTITIES'
          {"sha":"${{ matrix.sha }}","tree":"${{ matrix.tree }}","lock":"${{ matrix.lock }}","packageManager":"${{ matrix.package_manager }}","workflowSha":"${{ github.workflow_sha }}","platform":"linux/amd64","image":"${{ env.DIAGNOSTIC_IMAGE }}"}
          IDENTITIES

      - name: Checkout the reviewed diagnostic payload
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Checkout the exact original source
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          set-safe-directory: false

      - name: Write the independent observer and bootstrap
        shell: bash
        env:
          DIAGNOSTIC_SHA: ${{ matrix.sha }}
          DIAGNOSTIC_TREE: ${{ matrix.tree }}
          DIAGNOSTIC_LOCK: ${{ matrix.lock }}
          DIAGNOSTIC_PACKAGE_MANAGER: ${{ matrix.package_manager }}
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/diagnostic/config/scripts/antigravity-musl-watcher-diagnostic.sh" "$DIAGNOSTIC_DIR/diagnostic-payload.sh"
          sha256sum "$DIAGNOSTIC_DIR/diagnostic-payload.sh" > "$DIAGNOSTIC_DIR/diagnostic-payload.sha256"
          bash "$DIAGNOSTIC_DIR/diagnostic-payload.sh"

      - name: Build frozen source and observe the shipped native child
        shell: bash
        run: |
          set -euo pipefail
          # Only the dedicated container receives this private environment; no runner credentials are forwarded.
          docker_cmd() {
            local diagnostic_host_node diagnostic_docker_cli
            diagnostic_host_node="$(command -v node)"
            diagnostic_docker_cli="$(command -v docker)"
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" USERPROFILE="$USERPROFILE" \
              APPDATA="$APPDATA" LOCALAPPDATA="$LOCALAPPDATA" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
              XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" XDG_STATE_HOME="$XDG_STATE_HOME" \
              XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" TMPDIR="$TMPDIR" TMP="$TMPDIR" TEMP="$TMPDIR" \
              ORCA_USER_DATA="$APPDATA/orca" ORCA_BACKGROUND_LAUNCH=1 ORCA_DIAGNOSTIC_NONCE="$DIAGNOSTIC_NONCE" \
              "$diagnostic_host_node" "$DIAGNOSTIC_DIR/diagnostic.mjs" --host-docker \
              "$GITHUB_WORKSPACE" "$DIAGNOSTIC_DIR" "$diagnostic_docker_cli" "$@"
          }
          printf '%s\n' "docker pull --platform linux/amd64 $DIAGNOSTIC_IMAGE" > "$DIAGNOSTIC_DIR/image-pull.command.txt"
          set +e
          docker_cmd pull --platform linux/amd64 "$DIAGNOSTIC_IMAGE" > "$DIAGNOSTIC_DIR/image-pull.log" 2>&1
          pull_code=$?
          set -e
          printf '{"code":%s}\n' "$pull_code" > "$DIAGNOSTIC_DIR/image-pull.wrapper-result.json"
          if [ "$pull_code" -ne 0 ]; then exit "$pull_code"; fi
          docker_cmd image inspect "$DIAGNOSTIC_IMAGE" \
            --format '{"id":"{{.Id}}","repoDigests":{{json .RepoDigests}},"architecture":"{{.Architecture}}","os":"{{.Os}}"}' \
            > "$DIAGNOSTIC_DIR/image-identity.json"
          container_argv=(timeout --signal=TERM --kill-after=15s 21m env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" \
            ORCA_BACKGROUND_LAUNCH=1 docker --config "$DIAGNOSTIC_DIR/host-private/docker" --host unix:///var/run/docker.sock run \
            --platform linux/amd64 --init --name "$DIAGNOSTIC_NONCE" \
            --label "orca.diagnostic.nonce=$DIAGNOSTIC_NONCE" --label orca.diagnostic.task=antigravity-musl-watch-1003 \
            --cidfile "$DIAGNOSTIC_DIR/owned-container.id" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/source,target=/source" \
            --mount "type=bind,source=$DIAGNOSTIC_DIR,target=/evidence" --workdir /source \
            "$DIAGNOSTIC_IMAGE" /usr/bin/env -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/evidence/bootstrap-private/home USERPROFILE=/evidence/bootstrap-private/home \
            APPDATA=/evidence/bootstrap-private/config LOCALAPPDATA=/evidence/bootstrap-private/config \
            XDG_CONFIG_HOME=/evidence/bootstrap-private/config XDG_CACHE_HOME=/evidence/bootstrap-private/cache \
            XDG_DATA_HOME=/evidence/bootstrap-private/data XDG_STATE_HOME=/evidence/bootstrap-private/state \
            XDG_RUNTIME_DIR=/evidence/bootstrap-private/runtime TMPDIR=/evidence/bootstrap-private/temp \
            TMP=/evidence/bootstrap-private/temp TEMP=/evidence/bootstrap-private/temp \
            ORCA_USER_DATA=/evidence/bootstrap-private/userData ORCA_BACKGROUND_LAUNCH=1 \
            ORCA_DIAGNOSTIC_NONCE="$DIAGNOSTIC_NONCE" CI=1 GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/evidence/bootstrap-private/home/.gitconfig \
            /bin/sh /evidence/bootstrap.sh '${{ matrix.sha }}' '${{ matrix.tree }}' '${{ matrix.lock }}' '${{ matrix.package_manager }}')
          printf '%s\n' "${container_argv[@]}" > "$DIAGNOSTIC_DIR/container.argv.txt"
          set +e
          diagnostic_host_node="$(command -v node)"
          env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" USERPROFILE="$USERPROFILE" \
            APPDATA="$APPDATA" LOCALAPPDATA="$LOCALAPPDATA" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
            XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" XDG_STATE_HOME="$XDG_STATE_HOME" \
            XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" TMPDIR="$TMPDIR" TMP="$TMPDIR" TEMP="$TMPDIR" \
            ORCA_USER_DATA="$APPDATA/orca" ORCA_BACKGROUND_LAUNCH=1 ORCA_DIAGNOSTIC_NONCE="$DIAGNOSTIC_NONCE" \
            "$diagnostic_host_node" "$DIAGNOSTIC_DIR/diagnostic.mjs" --host-container \
            "$GITHUB_WORKSPACE" "$DIAGNOSTIC_DIR" "${container_argv[@]}"
          container_code=$?
          set -e
          printf '{"code":%s}\n' "$container_code" > "$DIAGNOSTIC_DIR/container.wrapper-result.json"
          exit "$container_code"

      - name: Record final container status and remove only the owned container
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker_cmd() {
            local diagnostic_host_node diagnostic_docker_cli
            diagnostic_host_node="$(command -v node)"
            diagnostic_docker_cli="$(command -v docker)"
            env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME" USERPROFILE="$USERPROFILE" \
              APPDATA="$APPDATA" LOCALAPPDATA="$LOCALAPPDATA" XDG_CONFIG_HOME="$XDG_CONFIG_HOME" \
              XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_DATA_HOME="$XDG_DATA_HOME" XDG_STATE_HOME="$XDG_STATE_HOME" \
              XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" TMPDIR="$TMPDIR" TMP="$TMPDIR" TEMP="$TMPDIR" \
              ORCA_USER_DATA="$APPDATA/orca" ORCA_BACKGROUND_LAUNCH=1 ORCA_DIAGNOSTIC_NONCE="$DIAGNOSTIC_NONCE" \
              "$diagnostic_host_node" "$DIAGNOSTIC_DIR/diagnostic.mjs" --host-docker \
              "$GITHUB_WORKSPACE" "$DIAGNOSTIC_DIR" "$diagnostic_docker_cli" "$@"
          }
          printf '%s\n' "list exact owned name $DIAGNOSTIC_NONCE" > "$DIAGNOSTIC_DIR/cleanup.command.txt"
          set +e
          docker_cmd container ls --all --no-trunc --filter "name=^/$DIAGNOSTIC_NONCE$" --format '{{.ID}}' \
            > "$DIAGNOSTIC_DIR/cleanup-name-query.log" 2> "$DIAGNOSTIC_DIR/cleanup.stderr.log"
          query_code=$?
          set -e
          printf '{"code":%s}\n' "$query_code" > "$DIAGNOSTIC_DIR/cleanup-name-query.result.json"
          if [ "$query_code" -ne 0 ]; then exit "$query_code"; fi
          container_id="$(cat "$DIAGNOSTIC_DIR/cleanup-name-query.log")"
          if [ -z "$container_id" ]; then
            printf '%s\n' '{"state":"exited","reason":"owning Docker host confirmed exact name absent"}' > "$DIAGNOSTIC_DIR/cleanup.json"
            exit 0
          fi
          if [ -s "$DIAGNOSTIC_DIR/owned-container.id" ] && [ "$(cat "$DIAGNOSTIC_DIR/owned-container.id")" != "$container_id" ]; then
            printf '%s\n' '{"state":"unverifiable","reason":"allocated ID and exact name disagree; no removal attempted"}' > "$DIAGNOSTIC_DIR/cleanup.json"
            exit 1
          fi
          printf '%s\n' "inspect and remove exact allocated container: $container_id" > "$DIAGNOSTIC_DIR/cleanup.command.txt"
          docker_cmd inspect "$container_id" \
            --format '{"id":"{{.Id}}","image":"{{.Image}}","running":{{.State.Running}},"exitCode":{{.State.ExitCode}},"oomKilled":{{.State.OOMKilled}},"nonce":"{{index .Config.Labels "orca.diagnostic.nonce"}}"}' \
            > "$DIAGNOSTIC_DIR/container-final-status.json" 2>> "$DIAGNOSTIC_DIR/cleanup.stderr.log"
          actual_nonce="$(docker_cmd inspect "$container_id" --format '{{index .Config.Labels "orca.diagnostic.nonce"}}')"
          actual_task="$(docker_cmd inspect "$container_id" --format '{{index .Config.Labels "orca.diagnostic.task"}}')"
          if [ "$actual_nonce" != "$DIAGNOSTIC_NONCE" ] || [ "$actual_task" != antigravity-musl-watch-1003 ]; then
            printf '%s\n' '{"state":"unverifiable","reason":"ownership labels do not match; no removal attempted"}' > "$DIAGNOSTIC_DIR/cleanup.json"
            exit 1
          fi
          set +e
          docker_cmd rm --force "$container_id" > "$DIAGNOSTIC_DIR/cleanup.stdout.log" 2>> "$DIAGNOSTIC_DIR/cleanup.stderr.log"
          cleanup_code=$?
          set -e
          if [ "$cleanup_code" -ne 0 ]; then
            printf '{"state":"unverifiable","removeCode":%s}\n' "$cleanup_code" > "$DIAGNOSTIC_DIR/cleanup.json"
            exit "$cleanup_code"
          fi
          printf '{"state":"exited","containerId":"%s","removeCode":0}\n' "$container_id" > "$DIAGNOSTIC_DIR/cleanup.json"

      - name: Upload identities, ordered lifecycle events, raw outcomes and cleanup
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: antigravity-musl-watcher-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DIAGNOSTIC_DIR }}
            !${{ env.DIAGNOSTIC_DIR }}/pnpm-store/**
            !${{ env.DIAGNOSTIC_DIR }}/tools/**
            !${{ env.DIAGNOSTIC_DIR }}/**/private-*/**
            !${{ env.DIAGNOSTIC_DIR }}/host-private/**
            !${{ env.DIAGNOSTIC_DIR }}/bootstrap-private/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
